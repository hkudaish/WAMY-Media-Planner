    function InviteUserModal({ open, initial, api, onClose, onCreated, toast }) {
        const defaults = { name: '', email: '', position: '', department: '', team: '', data_scope: 'my_data', org: 'wamy', role: 'user', permissions: { ...EMPTY_PERMISSIONS, 'Dashboard.View': true } };
        const [form,setForm] = useState(defaults);
        const [result,setResult] = useState(null);
        const [busy,setBusy] = useState(false);
        useEffect(() => {
            if (!open) return;
            setResult(null);
            setForm(initial ? { name: initial.name || '', email: initial.email || '', position: initial.position || '', department: initial.department || '', team: initial.team || '', data_scope: initial.data_scope || 'my_data',
                org: initial.org || 'wamy', role: initial.role || 'user', permissions: { ...EMPTY_PERMISSIONS, ...(initial.permissions || {}) } } : defaults);
        }, [open,initial]);
        const set = key => event => setForm(value => ({ ...value, [key]: event.target.value }));
        const toggle = key => event => setForm(value => ({ ...value, permissions: { ...value.permissions, [key]: event.target.checked } }));
        const submit = async event => {
            event.preventDefault(); setBusy(true);
            try {
                const created = await api.profiles.invite({ ...form, profile_id: initial && initial.id });
                setResult(created); await onCreated(); toast(initial ? 'تم إصدار رابط تسجيل جديد' : 'تمت إضافة المستخدم وإصدار رابط التسجيل','success');
            } catch (error) { toast(error.message,'error'); } finally { setBusy(false); }
        };
        const shareText = result ? `مرحبًا ${result.user.name}، أكمل تسجيلك في نظام متابعة WAMY عبر الرابط التالي: ${result.invitation_url}` : '';
        const copy = async () => {
            try { await navigator.clipboard.writeText(result.invitation_url); toast('تم نسخ رابط التسجيل','success'); }
            catch { window.prompt('انسخ رابط التسجيل:',result.invitation_url); }
        };
        const nativeShare = async () => {
            if (!navigator.share) { copy(); return; }
            try { await navigator.share({ title: 'دعوة تسجيل', text: shareText, url: result.invitation_url }); } catch (error) { if (error.name !== 'AbortError') toast('تعذرت المشاركة','error'); }
        };
        return <Modal open={open} onClose={onClose} size="lg" title={initial ? 'إعادة إصدار دعوة المستخدم' : 'إضافة مستخدم جديد'} subtitle="حدد الدور والصلاحيات قبل إرسال رابط التسجيل."
            footer={<React.Fragment><button onClick={onClose} className="px-4 py-2 bg-slate-800 rounded-xl">إغلاق</button>{!result && <button type="submit" form="invite-user-form" disabled={busy} className="px-5 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white rounded-xl font-bold">{busy && <i className="fa-solid fa-circle-notch fa-spin me-2"></i>}إنشاء المستخدم والرابط</button>}</React.Fragment>}>
            {!result ? <form id="invite-user-form" onSubmit={submit} className="space-y-4">
                <div className="grid sm:grid-cols-2 gap-4"><Field label="الاسم الكامل" required><input className={inputClass} value={form.name} onChange={set('name')} required maxLength="200" /></Field><Field label="البريد الإلكتروني" required hint={initial ? 'لتغيير البريد استخدم شاشة تعديل المستخدم أولًا.' : null}><input type="email" dir="ltr" readOnly={!!initial} className={cx(inputClass,'font-mono',initial && 'opacity-70')} value={form.email} onChange={set('email')} required maxLength="320" /></Field><Field label="المنصب"><input className={inputClass} value={form.position} onChange={set('position')} /></Field><Field label="الإدارة"><input className={inputClass} value={form.department} onChange={set('department')} /></Field><Field label="الفريق"><input className={inputClass} value={form.team} onChange={set('team')} /></Field><Field label="الجهة" required><select className={inputClass} value={form.org} onChange={set('org')}>{ORG_LIST.map(item => <option key={item.code} value={item.code}>{item.label}</option>)}</select></Field><Field label="الدور" required><select className={inputClass} value={form.role} onChange={set('role')}>{Object.values(ROLES).map(item => <option key={item.code} value={item.code}>{item.label} — {item.hint}</option>)}</select></Field><Field label="نطاق البيانات" required><select className={inputClass} value={form.data_scope} onChange={set('data_scope')}>{Object.entries(DATA_SCOPES).map(([key,value]) => <option key={key} value={key}>{value.label}</option>)}</select></Field></div>
                <fieldset className="border border-slate-800 rounded-xl p-4 space-y-4 max-h-[40vh] overflow-y-auto"><legend className="px-2 text-sm font-bold">الصلاحيات</legend>{form.role === 'admin' && <p className="text-xs text-purple-300">مدير النظام يحصل على جميع الصلاحيات تلقائيًا.</p>}{PERMISSION_GROUPS.map(group => <div key={group.label}><h4 className="text-xs font-extrabold text-blue-300 mb-2">{group.label}</h4><div className="grid sm:grid-cols-2 gap-2">{group.items.map(permission => <label key={permission.key} className="flex items-center gap-2 text-sm"><input type="checkbox" className="accent-purple-500" disabled={form.role === 'admin'} checked={form.role === 'admin' || !!form.permissions[permission.key]} onChange={toggle(permission.key)} /><span>{permission.label}</span></label>)}</div></div>)}</fieldset>
                <p className="text-xs text-slate-500">سيبقى الحساب بانتظار التفعيل حتى يفتح المستلم الرابط ويختار كلمة مروره. إصدار رابط جديد يلغي الرابط السابق.</p>
            </form> : <div className="space-y-4">
                <div className="p-4 bg-emerald-950/30 border border-emerald-500/30 rounded-xl"><strong className="text-emerald-300 block">تم تجهيز دعوة {result.user.name}</strong><span className="text-xs text-slate-400">صالحة حتى {formatDateTime(result.expires_at)}</span></div>
                <Field label="رابط التسجيل الخاص"><input readOnly dir="ltr" className={cx(inputClass,'font-mono text-xs')} value={result.invitation_url} onFocus={event => event.target.select()} /></Field>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2"><button onClick={copy} className="p-3 bg-blue-600 text-white rounded-xl text-sm font-bold"><i className="fa-regular fa-copy me-1"></i>نسخ</button><a href={`mailto:${encodeURIComponent(result.user.email)}?subject=${encodeURIComponent('دعوة للتسجيل في نظام متابعة WAMY')}&body=${encodeURIComponent(shareText)}`} className="p-3 bg-slate-800 text-center rounded-xl text-sm font-bold"><i className="fa-regular fa-envelope me-1"></i>البريد</a><a target="_blank" rel="noopener noreferrer" href={`https://wa.me/?text=${encodeURIComponent(shareText)}`} className="p-3 bg-emerald-600 text-white text-center rounded-xl text-sm font-bold"><i className="fa-brands fa-whatsapp me-1"></i>واتساب</a><button onClick={nativeShare} className="p-3 bg-purple-600 text-white rounded-xl text-sm font-bold"><i className="fa-solid fa-share-nodes me-1"></i>مشاركة</button></div>
                <p className="text-xs text-amber-300">هذا الرابط خاص بالمستخدم؛ لا تنشره في قناة عامة.</p>
            </div>}
        </Modal>;
    }

    /* Real uploads: the file goes to Drive, into the product's own
       proposals/approved subfolder, and the row is written from Drive's
       response -- so name, size and MIME type are observed, not typed. */
    function FileModal({ open, data, profile, api, drive, settings, driveConnected, onConnect, onClose, onFinished, toast }) {
        const [productId, setProductId] = useState('');
        const [folder, setFolder]       = useState('proposals');
        const [version, setVersion]     = useState('v1.0');
        const [queue, setQueue]         = useState([]);
        const [running, setRunning]     = useState(false);
        const [dragging, setDragging]   = useState(false);
        const inputRef = useRef(null);

        useEffect(() => {
            if (!open) return;
            setProductId(''); setFolder('proposals'); setVersion('v1.0');
            setQueue([]); setRunning(false); setDragging(false);
        }, [open]);

        const mayApprove = canAny(profile, 'Files.Approve', 'Files.MoveToApproved');
        const rootFolderId = settings && settings.drive_root_folder_id;
        const configured = drive.isConfigured();
        const product = byId(data.products, productId);

        const patchItem = (id, patch) =>
            setQueue(prev => prev.map(item => (item.id === id ? { ...item, ...patch } : item)));

        const addFiles = (fileList) => {
            const added = Array.from(fileList || []).map((file, index) => ({
                id: `${Date.now()}_${index}_${file.name}`,
                file, status: 'pending', progress: 0, error: ''
            }));
            if (added.length) setQueue(prev => [...prev, ...added]);
        };

        const registerRow = async (row) => {
            try {
                await api.files.create(row);
            } catch (err) {
                if (/مستخدمة مسبقًا/.test(err.message)) throw new Error('هذا الملف مسجَّل في النظام مسبقًا.');
                throw err;
            }
        };

        const runUploads = async () => {
            if (!product)      { toast('اختر المنتج المرتبط أولًا.', 'error'); return; }
            if (!rootFolderId) { toast('لم يُحدَّد مجلد المشروع الجذري في إعدادات النظام.', 'error'); return; }
            if (!driveConnected && !(await onConnect())) return;

            setRunning(true);
            let folders;
            try {
                folders = await resolveProductFolders(drive, api, product, rootFolderId);
            } catch (err) {
                toast(err.message, 'error');
                setRunning(false);
                return;
            }
            const parentId = folder === 'approved' ? folders.approved : folders.proposals;
            const pending = queue.filter(item => item.status === 'pending' || item.status === 'error');

            for (const item of pending) {
                patchItem(item.id, { status: 'uploading', progress: 0, error: '' });
                try {
                    const uploaded = await drive.upload(item.file, parentId,
                        (fraction) => patchItem(item.id, { progress: fraction }));
                    await registerRow({
                        name: uploaded.name,
                        product_id: product.id,
                        folder,
                        org: profile.org,
                        uploader_id: profile.id,
                        version,
                        status: folder === 'approved' ? 'approved' : 'under_review',
                        drive_file_id: uploaded.id,
                        drive_view_link: uploaded.webViewLink || null,
                        drive_url: uploaded.webViewLink || null,
                        drive_icon_link: uploaded.iconLink || null,
                        drive_parent_id: parentId,
                        mime_type: uploaded.mimeType || null,
                        size_bytes: uploaded.size ? Number(uploaded.size) : null,
                        size_label: formatBytes(uploaded.size),
                        file_type: (uploaded.name.split('.').pop() || '').toUpperCase().slice(0, 5) || null
                    });
                    patchItem(item.id, { status: 'done', progress: 1 });
                } catch (err) {
                    patchItem(item.id, { status: 'error', error: err.message });
                }
            }
            setRunning(false);
            onFinished();
        };

        const pickExisting = async () => {
            if (!configured) { toast('لم تُضبط بيانات Google Drive بعد.', 'error'); return; }
            setRunning(true);
            try {
                const docs = await drive.pick({ mode: 'files' });
                if (!docs || !docs.length) { setRunning(false); return; }
                let registered = 0;
                for (const doc of docs) {
                    try {
                        const meta = await drive.getFile(doc.id).catch(() => null);
                        const size = (meta && meta.size) || doc.sizeBytes || null;
                        await registerRow({
                            name: doc.name,
                            product_id: productId || null,
                            folder,
                            org: profile.org,
                            uploader_id: profile.id,
                            version,
                            status: folder === 'approved' ? 'approved' : 'under_review',
                            drive_file_id: doc.id,
                            drive_view_link: (meta && meta.webViewLink) || doc.url || null,
                            drive_url: (meta && meta.webViewLink) || doc.url || null,
                            drive_icon_link: (meta && meta.iconLink) || doc.iconUrl || null,
                            drive_parent_id: (meta && meta.parents && meta.parents[0]) || null,
                            mime_type: (meta && meta.mimeType) || doc.mimeType || null,
                            size_bytes: size ? Number(size) : null,
                            size_label: formatBytes(size),
                            file_type: (doc.name.split('.').pop() || '').toUpperCase().slice(0, 5) || null
                        });
                        registered += 1;
                    } catch (err) {
                        toast(`${doc.name}: ${err.message}`, 'error');
                    }
                }
                if (registered) {
                    toast(`تم تسجيل ${registered} ملفًا من Drive`, 'success');
                    onFinished();
                }
            } catch (err) {
                toast(err.message, 'error');
            } finally {
                setRunning(false);
            }
        };

        const doneCount = queue.filter(q => q.status === 'done').length;
        const canUpload = queue.some(q => q.status === 'pending' || q.status === 'error');

        return (
            <Modal open={open} onClose={running ? () => toast('انتظر انتهاء الرفع الجاري.', 'info') : onClose} size="lg"
                   title="رفع مخرج إلى Google Drive"
                   subtitle="يُرفع الملف إلى مجلد المنتج داخل Drive، وتُقرأ بياناته من Drive مباشرة."
                   footer={
                       <React.Fragment>
                           <button type="button" onClick={onClose} disabled={running}
                                   className="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 rounded-xl text-sm font-bold">
                               {doneCount ? 'إغلاق' : 'إلغاء'}
                           </button>
                           <button type="button" onClick={runUploads} disabled={running || !canUpload || !product}
                                   className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white rounded-xl text-sm font-bold">
                               {running && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}
                               رفع {queue.length ? `(${queue.length})` : ''}
                           </button>
                       </React.Fragment>
                   }>
                {!configured && (
                    <p role="alert" className="p-3 bg-rose-950/40 border border-rose-500/30 rounded-xl text-rose-200 text-sm">
                        لم تُضبط بيانات Google Drive بعد. يحتاج مدير النظام إلى إدخال معرّف العميل ومفتاح المتصفح
                        وتحديد مجلد المشروع من تبويب «إعدادات النظام».
                    </p>
                )}
                {configured && !rootFolderId && (
                    <p role="alert" className="p-3 bg-amber-950/40 border border-amber-500/30 rounded-xl text-amber-200 text-sm">
                        لم يُحدَّد مجلد المشروع الجذري بعد. حدّده من «إعدادات النظام» قبل الرفع.
                    </p>
                )}
                {configured && !driveConnected && (
                    <div className="p-3 bg-slate-950 border border-slate-700 rounded-xl flex items-center justify-between gap-3">
                        <span className="text-sm text-slate-300">لم تتصل بحساب Google بعد في هذه الجلسة.</span>
                        <button type="button" onClick={onConnect}
                                className="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold shrink-0">
                            <i className="fa-brands fa-google me-1.5"></i>الاتصال بـ Drive
                        </button>
                    </div>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <Field label="المنتج المرتبط" required>
                        <select className={inputClass} value={productId} onChange={(e) => setProductId(e.target.value)}>
                            <option value="">— اختر —</option>
                            {data.products.map(p => <option key={p.id} value={p.id}>{p.code} — {p.name}</option>)}
                        </select>
                    </Field>
                    <Field label="المجلد" hint={!mayApprove ? 'يتطلب صلاحية الاعتماد.' : null}>
                        <select className={inputClass} value={folder} onChange={(e) => setFolder(e.target.value)}>
                            <option value="proposals">{FILE_FOLDERS.proposals.label}</option>
                            <option value="approved" disabled={!mayApprove}>{FILE_FOLDERS.approved.label}</option>
                        </select>
                    </Field>
                    <Field label="الإصدار">
                        <input className={cx(inputClass, 'font-mono')} dir="ltr" value={version} onChange={(e) => setVersion(e.target.value)} />
                    </Field>
                </div>

                {product && (
                    <p className="text-xs text-slate-500">
                        الوجهة داخل Drive:
                        <span className="font-mono text-slate-400" dir="ltr"> {settings.drive_root_folder_name || 'الجذر'} / {product.code} / {FOLDER_LABELS[folder]}</span>
                    </p>
                )}

                <div onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                     onDragLeave={() => setDragging(false)}
                     onDrop={(e) => { e.preventDefault(); setDragging(false); addFiles(e.dataTransfer.files); }}
                     className={cx('border-2 border-dashed rounded-2xl p-6 text-center transition-colors',
                         dragging ? 'border-emerald-500 bg-emerald-950/20' : 'border-slate-700 bg-slate-950/40')}>
                    <i className="fa-solid fa-cloud-arrow-up text-2xl text-slate-500 mb-2 block"></i>
                    <p className="text-sm text-slate-300 font-bold">اسحب الملفات هنا</p>
                    <p className="text-xs text-slate-500 mt-1 mb-3">أو</p>
                    <div className="flex flex-wrap items-center justify-center gap-2">
                        <button type="button" onClick={() => inputRef.current && inputRef.current.click()}
                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold">
                            اختيار من الجهاز
                        </button>
                        <button type="button" onClick={pickExisting} disabled={running || !configured}
                                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-200 rounded-xl text-xs font-bold">
                            <i className="fa-brands fa-google-drive me-1.5 text-emerald-400"></i>اختيار ملف موجود في Drive
                        </button>
                    </div>
                    <input ref={inputRef} type="file" multiple className="hidden"
                           onChange={(e) => { addFiles(e.target.files); e.target.value = ''; }} />
                </div>

                {queue.length > 0 && (
                    <ul className="space-y-2 max-h-56 overflow-y-auto">
                        {queue.map(item => (
                            <li key={item.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5">
                                <div className="flex items-center justify-between gap-3">
                                    <span className="text-sm text-white truncate flex-1">{item.file.name}</span>
                                    <span className="text-xs text-slate-500 shrink-0">{formatBytes(item.file.size)}</span>
                                    {item.status === 'done'      && <i className="fa-solid fa-circle-check text-emerald-400 shrink-0"></i>}
                                    {item.status === 'error'     && <i className="fa-solid fa-circle-exclamation text-rose-400 shrink-0"></i>}
                                    {item.status === 'uploading' && <i className="fa-solid fa-circle-notch fa-spin text-blue-400 shrink-0"></i>}
                                    {item.status === 'pending'   && (
                                        <button type="button" aria-label={`إزالة ${item.file.name}`}
                                                onClick={() => setQueue(prev => prev.filter(q => q.id !== item.id))}
                                                className="text-slate-500 hover:text-rose-400 shrink-0">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    )}
                                </div>
                                {item.status === 'uploading' && (
                                    <ProgressBar value={item.progress * 100} tone="bg-emerald-500" className="h-1.5"
                                                 label={`رفع ${item.file.name}`} />
                                )}
                                {item.error && <p className="text-xs text-rose-300">{item.error}</p>}
                            </li>
                        ))}
                    </ul>
                )}
            </Modal>
        );
    }

    /* ---------------------------------------------------------------
       11. Application shell
       --------------------------------------------------------------- */

    const NAV_ITEMS = [
        { key: 'dashboard', label: 'لوحة المؤشرات',        icon: 'fa-gauge-high', permission: 'Dashboard.View' },
        { key: 'masterPlan', label: 'الخطة الرئيسية',      icon: 'fa-diagram-project', permission: 'MainPlan.View' },
        { key: 'products',  label: 'المنتجات والمراحل',    icon: 'fa-layer-group', permission: 'Products.View' },
        { key: 'tasks',     label: 'المهام والمتابعة',      icon: 'fa-list-check', permission: 'Tasks.View' },
        { key: 'gantt',     label: 'الخطة الزمنية',         icon: 'fa-chart-gantt', permission: 'Timeline.View' },
        { key: 'calendar',  label: 'التقويم والجدولة',      icon: 'fa-calendar-days', permission: 'Calendar.View' },
        { key: 'files',     label: 'مركز الملفات',          icon: 'fa-folder-open', accent: 'text-emerald-400', permission: 'Files.View' },
        { key: 'reports',   label: 'التقارير التنفيذية',    icon: 'fa-file-invoice', permission: 'Reports.View' },
        { key: 'settings',  label: 'إعدادات النظام',        icon: 'fa-sliders', accent: 'text-amber-400', permission: 'Settings.View' }
    ];

    function AppShell({ api, profile, onSignOut, theme, onToggleTheme }) {
        const toast = useToast();

        const [data, setData] = useState({ organizations: [], projects: [], planItems: [], alerts: [], products: [], tasks: [], files: [], profiles: [], logs: [] });
        const [settings, setSettings] = useState(null);
        const [loading, setLoading]   = useState(true);
        const [loadError, setLoadError] = useState('');

        const [selectedProjectId, setSelectedProjectId] = useState(() => {
            try {
                return localStorage.getItem('wamy_active_project_id') || 'all';
            } catch (e) {
                return 'all';
            }
        });

        const handleProjectChange = (projId) => {
            setSelectedProjectId(projId);
            try {
                localStorage.setItem('wamy_active_project_id', projId);
            } catch (e) {}
        };

        const [activeTab, setActiveTab]   = useState('dashboard');
        const [sidebarOpen, setSidebarOpen] = useState(false);
        const [filters, setFilters] = useState({ org: 'all', query: '' });

        const [taskModal, setTaskModal]       = useState(null); // {initial} | null
        const [productModal, setProductModal] = useState(null);
        const [userModal, setUserModal]       = useState(null);
        const [inviteUserModal, setInviteUserModal] = useState(null);
        const [changePasswordOpen, setChangePasswordOpen] = useState(false);
        const [resetPasswordUser, setResetPasswordUser]   = useState(null);
        const [planItemQuickModal, setPlanItemQuickModal] = useState(null);
        const [fileModal, setFileModal]       = useState(false);
        const [planImportOpen, setPlanImportOpen] = useState(false);
        const [masterPlanImportOpen, setMasterPlanImportOpen] = useState(false);
        const [projectModal, setProjectModal] = useState(null); // { initial } | null
        const [safeDeleteModal, setSafeDeleteModal] = useState(null); // project | null
        const [hierarchyImportModal, setHierarchyImportModal] = useState(null); // { entity: 'projects' } | null
        const [confirmState, setConfirmState] = useState(null);
        const [busy, setBusy] = useState(false);
        const refreshSequence = useRef(0);

        // One Drive client for the session; reconfigured whenever settings change.
        const drive = useMemo(createDriveClient, []);
        const [driveConnected, setDriveConnected] = useState(false);
        useEffect(() => {
            drive.configure({
                clientId: (settings && settings.drive_client_id) || '',
                apiKey:   (settings && settings.drive_picker_api_key) || ''
            });
            setDriveConnected(drive.hasToken());
        }, [drive, settings]);

        const connectDrive = useCallback(async (options) => {
            try {
                await drive.connect(options);
                setDriveConnected(true);
                toast('تم الاتصال بـ Google Drive', 'success');
                return true;
            } catch (err) {
                toast(err.message, 'error');
                return false;
            }
        }, [drive, toast]);

        const refresh = useCallback(async (includeAdmin = false) => {
            const sequence = ++refreshSequence.current;
            try {
                const fetchAdmin = includeAdmin || activeTab === 'settings';
                const [orgs, projects, planItems, alerts, products, tasks, files, profiles, logs, appSettings] = await Promise.all([
                    api.organizations ? api.organizations.list() : Promise.resolve([]),
                    canAny(profile,'Projects.View','MainPlan.View','Plans.View','Tasks.View','Tasks.Create','Timeline.View','Calendar.View','Reports.View','Dashboard.View') ? api.projects.list() : Promise.resolve([]),
                    canAny(profile,'MainPlan.View','Plans.View','Tasks.View','Tasks.Create','Timeline.View','Reports.View') ? api.planItems.list() : Promise.resolve([]),
                    canAny(profile,'Dashboard.View','MainPlan.View','Tasks.View') ? api.alerts.list() : Promise.resolve([]),
                    canAny(profile,'Products.View','Tasks.View','Tasks.Create','Timeline.View','Calendar.View','Files.View','Reports.View','Dashboard.View') ? api.products.list() : Promise.resolve([]),
                    canAny(profile,'Tasks.View','Timeline.View','Calendar.View','Reports.View','Dashboard.View') ? api.tasks.list() : Promise.resolve([]),
                    canAny(profile,'Files.View','Dashboard.View') ? api.files.list() : Promise.resolve([]),
                    fetchAdmin && can(profile,'Settings.Users') ? api.profiles.list() : Promise.resolve(null),
                    fetchAdmin && can(profile,'Audit.View') ? api.logs.list() : Promise.resolve(null),
                    fetchAdmin && can(profile,'Settings.View') ? api.settings.get() : Promise.resolve(null)
                ]);
                // A slower, older request must never replace a newer snapshot.
                if (sequence === refreshSequence.current) {
                    const safeOrgs = sanitizeRows(orgs);
                    if (safeOrgs && safeOrgs.length > 0) {
                        setDynamicOrgs(safeOrgs);
                    }
                    const safeProjects = sanitizeRows(projects);
                    const safePlanItems = sanitizeRows(planItems);
                    const safeAlerts = sanitizeRows(alerts);
                    const safeProducts = sanitizeRows(products);
                    const safeTasks = sanitizeRows(tasks);
                    const safeFiles = sanitizeRows(files);
                    setData(prev => ({
                        organizations: safeOrgs || prev.organizations || [],
                        projects: safeProjects,
                        planItems: safePlanItems,
                        alerts: safeAlerts,
                        products: safeProducts,
                        tasks: safeTasks,
                        files: safeFiles,
                        profiles: profiles !== null ? sanitizeRows(profiles) : prev.profiles,
                        logs: logs !== null ? sanitizeRows(logs) : prev.logs
                    }));
                    if (appSettings !== null) setSettings(appSettings);
                    setLoadError('');
                }
            } catch (err) {
                if (sequence === refreshSequence.current) setLoadError(err.message);
            } finally {
                if (sequence === refreshSequence.current) setLoading(false);
            }
        }, [api, profile, activeTab]);

        useEffect(() => { refresh(true); }, [refresh]);

        /* Refresh periodically so open browsers stay in sync through the one
           authorized local API connection. Pauses when the tab is hidden. */
        useEffect(() => {
            const timer = setInterval(() => {
                if (!document.hidden) refresh(false);
            }, 15000);
            const syncWhenActive = () => { if (!document.hidden) refresh(false); };
            window.addEventListener('focus', syncWhenActive);
            document.addEventListener('visibilitychange', syncWhenActive);
            return () => {
                clearInterval(timer);
                window.removeEventListener('focus', syncWhenActive);
                document.removeEventListener('visibilitychange', syncWhenActive);
            };
        }, [refresh]);

        const run = useCallback(async (action, successMessage) => {
            setBusy(true);
            try {
                await action();
                if (successMessage) toast(successMessage, 'success');
                await refresh(true);
                return true;
            } catch (err) {
                if (err.code === 'EDIT_CONFLICT') {
                    // Close editors holding the stale snapshot. The refreshed
                    // record can then be reopened without repeated conflicts.
                    setTaskModal(null);
                    setProductModal(null);
                    setUserModal(null);
                    setConfirmState(null);
                    await refresh(true);
                }
                toast(err.message || 'تعذّر إتمام العملية', 'error');
                return false;
            } finally {
                setBusy(false);
            }
        }, [refresh, toast]);

        const canFilterOrg = Boolean(profile && (profile.role === 'admin' || profile.role === 'supervisor'));
        const effectiveOrg = canFilterOrg ? (filters.org || 'all') : (profile.org || 'wamy');

        const projectFilteredData = useMemo(() => {
            if (!selectedProjectId || selectedProjectId === 'all') {
                return data;
            }
            const activeProjects = data.projects.filter(p => p.id === selectedProjectId);
            const planItems = data.planItems.filter(pi => pi.project_id === selectedProjectId);
            const planItemIds = new Set(planItems.map(pi => pi.id));
            const products = data.products.filter(p => p.project_id === selectedProjectId || (p.plan_item_id && planItemIds.has(p.plan_item_id)));
            const productIds = new Set(products.map(p => p.id));
            const tasks = data.tasks.filter(t => t.project_id === selectedProjectId || (t.product_id && productIds.has(t.product_id)) || (t.plan_item_id && planItemIds.has(t.plan_item_id)));
            const taskIds = new Set(tasks.map(t => t.id));
            const files = data.files.filter(f => f.project_id === selectedProjectId || (f.product_id && productIds.has(f.product_id)));
            const alerts = data.alerts.filter(a => (a.task_id && taskIds.has(a.task_id)) || a.project_id === selectedProjectId);

            return {
                ...data,
                projects: activeProjects.length > 0 ? activeProjects : data.projects,
                planItems,
                products,
                tasks,
                files,
                alerts
            };
        }, [data, selectedProjectId]);

        const stats = useMemo(() => {
            const { products, tasks, files } = projectFilteredData;
            const orgProducts = effectiveOrg === 'all' ? products : products.filter(p => p.org === effectiveOrg);
            const orgTasks    = effectiveOrg === 'all' ? tasks : tasks.filter(t => t.org === effectiveOrg);
            const orgFiles    = effectiveOrg === 'all' ? files : files.filter(f => f.folder === 'approved' && (effectiveOrg === 'all' || f.org === effectiveOrg));

            const totalWeight = orgProducts.reduce((sum, p) => sum + (p.active_duration_days || 1), 0);
            const weighted = totalWeight
                ? orgProducts.reduce((sum, p) => sum + productProgress(p, orgTasks) * (p.active_duration_days || 1), 0) / totalWeight
                : 0;
            return {
                totalProducts:     orgProducts.length,
                completedProducts: orgProducts.filter(p => productProgress(p, orgTasks) === 100).length,
                totalTasks:        orgTasks.length,
                completedTasks:    orgTasks.filter(isTaskDone).length,
                inProgressTasks:   orgTasks.filter(t => t.status === 'in_progress').length,
                delayedTasks:      orgTasks.filter(isOverdue).length,
                approvedFiles:     orgFiles.length,
                overallProgress:   Math.round(weighted)
            };
        }, [projectFilteredData, effectiveOrg]);

        const normalizedFilters = useMemo(
            () => ({ org: effectiveOrg, query: filters.query.trim().toLowerCase() }),
            [effectiveOrg, filters.query]);

        const visibleAlerts = useMemo(() => {
            if (effectiveOrg === 'all') return projectFilteredData.alerts;
            return projectFilteredData.alerts.filter(a => {
                const t = byId(projectFilteredData.tasks, a.task_id);
                return (t && t.org === effectiveOrg) || (!t && (!a.org || a.org === effectiveOrg));
            });
        }, [projectFilteredData.alerts, projectFilteredData.tasks, effectiveOrg]);

        /* ---- actions ---- */

        const saveTask = (values) => run(async () => {
            if (taskModal && taskModal.initial) await api.tasks.update(taskModal.initial.id, values, taskModal.initial.updated_at);
            else await api.tasks.create({ ...values, created_by: profile.id });
            setTaskModal(null);
        }, taskModal && taskModal.initial ? 'تم تحديث المهمة' : 'تمت إضافة المهمة');

        const quickComplete = (task) => setConfirmState({
            title: 'إنهاء المهمة',
            body: `سيتم وضع المهمة «${task.title}» كمكتملة بنسبة 100% وتسجيل وقت الإنجاز.`,
            confirmLabel: 'إنهاء المهمة',
            onConfirm: async () => {
                setConfirmState(null);
                await run(() => api.tasks.update(task.id, { status: 'completed', progress: 100 }, task.updated_at), 'تم إنهاء المهمة');
            }
        });

        const deleteTask = (task) => setConfirmState({
            title: 'أرشفة المهمة', tone: 'danger', confirmLabel: 'أرشفة',
            body: `ستُخفى «${task.title}» من القوائم النشطة مع الاحتفاظ بسجلها للتدقيق والاستعادة الإدارية.`,
            onConfirm: async () => {
                setConfirmState(null);
                await run(() => api.tasks.remove(task.id), 'تم حذف المهمة');
            }
        });

        const saveProduct = (values) => run(async () => {
            if (productModal && productModal.initial) await api.products.update(productModal.initial.id, values, productModal.initial.updated_at);
            else await api.products.create(values);
            setProductModal(null);
        }, 'تم حفظ المنتج');

        const saveProject = (values) => run(async () => {
            if (projectModal && projectModal.initial) {
                await api.projects.update(projectModal.initial.id, values, projectModal.initial.updated_at);
            } else {
                await api.projects.create(values);
            }
            setProjectModal(null);
        }, projectModal && projectModal.initial ? 'تم تحديث بيانات المشروع بنجاح' : 'تم إنشاء المشروع والخطة الرئيسية بنجاح');

        const saveUser = (values) => run(async () => {
            await api.profiles.update(userModal.initial.id, values, userModal.initial.updated_at);
            setUserModal(null);
        }, 'تم تحديث بيانات المستخدم');

        const deleteUser = (user) => setConfirmState({
            title: 'أرشفة المستخدم', tone: 'danger', confirmLabel: 'أرشفة الحساب',
            body: `سيفقد «${user.name}» الوصول وتُلغى جلساته، مع الاحتفاظ بسجله لأغراض التدقيق.`,
            onConfirm: async () => {
                setConfirmState(null);
                await run(() => api.profiles.remove(user.id), 'تم حذف المستخدم');
            }
        });

        const rootFolderId = settings && settings.drive_root_folder_id;

        /* Approving moves the file in Drive as well as in the database, so the
            two folders users actually browse stay true to the recorded state. */
        const approveFile = (file) => setConfirmState({
            title: 'اعتماد المخرج',
            body: file.drive_file_id
                ? `سيُنقل «${file.name}» فعليًا إلى مجلد «النسخ المعتمدة» في Google Drive، ويُسجَّل الاعتماد باسمك.`
                : `سيُعلَّم «${file.name}» كمعتمد. هذا السجل رابط يدوي بلا ملف مرتبط في Drive، لذا لن يُنقل شيء هناك.`,
            confirmLabel: 'اعتماد',
            onConfirm: async () => {
                setConfirmState(null);
                await run(async () => {
                    const patch = {
                        folder: 'approved', status: 'approved',
                        approved_by: profile.id, approved_at: new Date().toISOString()
                    };
                    const product = byId(data.products, file.product_id);

                    if (file.drive_file_id && product && rootFolderId) {
                        if (!driveConnected && !(await connectDrive())) {
                            throw new Error('يلزم الاتصال بـ Google Drive لنقل الملف بين المجلدات.');
                        }
                        const folders = await resolveProductFolders(drive, api, product, rootFolderId);
                        await drive.move(file.drive_file_id, folders.approved, file.drive_parent_id || folders.proposals);
                        patch.drive_parent_id = folders.approved;
                    }
                    await api.files.update(file.id, patch, file.updated_at);
                }, 'تم اعتماد المخرج');
            }
        });

        const deleteFile = (file) => setConfirmState({
            title: 'أرشفة سجل الملف', tone: 'danger', confirmLabel: 'أرشفة السجل',
            body: `سيُخفى سجل «${file.name}» من القوائم النشطة. الملف نفسه يبقى على Google Drive.`,
            onConfirm: async () => {
                setConfirmState(null);
                await run(() => api.files.remove(file.id), 'تم حذف السجل');
            }
        });

        const saveSettings = (values) => run(async () => {
            await api.settings.update({ ...values, updated_by: profile.id, updated_at: new Date().toISOString() }, settings && settings.updated_at);
        }, 'تم حفظ الإعدادات');

        /* CSV rather than a JSON round-trip */
        const exportCsv = () => {
            const orgFilter = effectiveOrg;
            const rows = [['الرمز', 'المنتج', 'الجهة', 'البداية', 'النهاية', 'الحالة', 'المهام', 'المنجزة', 'الإنجاز %']];
            const pList = orgFilter === 'all' ? projectFilteredData.products : projectFilteredData.products.filter(p => p.org === orgFilter);
            const tList = orgFilter === 'all' ? projectFilteredData.tasks : projectFilteredData.tasks.filter(t => t.org === orgFilter);
            pList.forEach(p => {
                const own = tList.filter(t => t && t.product_id === p.id);
                rows.push([
                    p.code, p.name, org(p.org).label, p.start_date || '', p.due_date || '',
                    lookup(PRODUCT_STATUS, p.status, 'not_started').label,
                    own.length, own.filter(isTaskDone).length, productProgress(p, tList)
                ]);
            });
            const csv = rows
                .map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                .join('\r\n');
            // BOM so Excel opens Arabic text in UTF-8 instead of mojibake.
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `WAMY_Imaan_Plan_${orgFilter !== 'all' ? orgFilter + '_' : ''}${todayISO()}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            toast('تم تصدير ملف CSV', 'success');
        };

        const visibleNav = NAV_ITEMS.filter(item => can(profile, item.permission));

        useEffect(() => {
            if (!visibleNav.some(item => item.key === activeTab)) setActiveTab(visibleNav[0] ? visibleNav[0].key : null);
        }, [profile, activeTab, visibleNav.map(item => item.key).join('|')]);

        const go = (tab) => { setActiveTab(tab); setSidebarOpen(false); };

        if (loading) {
            return <div className="min-h-screen bg-slate-950 flex items-center justify-center"><Spinner label="جارٍ تحميل بيانات الخطة…" /></div>;
        }

        const screenProps = {
            data: projectFilteredData,
            rawData: data,
            profile,
            filters: normalizedFilters,
            stats,
            activeProjectId: selectedProjectId,
            onSelectProject: handleProjectChange,
            api,
            refresh
        };

        return (
            <div className="flex h-screen overflow-hidden bg-slate-950 text-slate-100">
                {sidebarOpen && (
                    <div className="fixed inset-0 z-40 bg-slate-950/70 md:hidden no-print"
                         onClick={() => setSidebarOpen(false)} aria-hidden="true"></div>
                )}

                <aside className={cx(
                    'fixed inset-y-0 right-0 z-50 w-72 bg-slate-900 border-s border-slate-800 flex flex-col transition-transform duration-300 md:static md:translate-x-0 no-print',
                    sidebarOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0')}>
                    <div className="p-4 border-b border-slate-800 flex items-center justify-between gap-2">
                        <div className="flex items-center gap-3 min-w-0">
                            <WamyLogo className="w-10 h-10" />
                            <div className="min-w-0">
                                <h2 className="text-sm font-bold text-white leading-tight truncate">الندوة العالمية</h2>
                                <span className="text-xs text-blue-400 font-bold">إدارة المهام</span>
                            </div>
                        </div>
                        <button onClick={() => setSidebarOpen(false)} className="md:hidden p-2 text-slate-400 hover:text-white" aria-label="إغلاق القائمة">
                            <i className="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div className="m-3 p-2.5 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-between text-xs">
                        {ORG_LIST.map(o => (
                            <span key={o.code} className={cx('font-bold flex items-center gap-1.5', o.text)}>
                                <span className={cx('w-2 h-2 rounded-full', o.dot)}></span>{o.short}
                            </span>
                        ))}
                    </div>

                    <nav className="flex-1 overflow-y-auto px-3 space-y-1 pb-3" aria-label="التنقل الرئيسي">
                        {visibleNav.map(item => (
                            <button key={item.key} onClick={() => go(item.key)}
                                    aria-current={activeTab === item.key ? 'page' : undefined}
                                    className={cx('w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm transition-colors',
                                        activeTab === item.key
                                            ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30'
                                            : 'text-slate-400 hover:bg-slate-800/60 hover:text-white')}>
                                <i className={cx('fa-solid w-4 text-center shrink-0', item.icon,
                                    activeTab === item.key ? '' : item.accent)}></i>
                                <span className="truncate">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    <div className="p-3 border-t border-slate-800 bg-slate-950/60 flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2.5 min-w-0">
                            <Avatar name={profile.name} size="w-9 h-9 text-xs" />
                            <div className="min-w-0">
                                <p className="text-sm font-bold text-white truncate">{profile.name}</p>
                                <span className="text-xs text-purple-300 block truncate">
                                    {profile.position || lookup(ROLES, profile.role, 'user').label}
                                </span>
                            </div>
                        </div>
                        <div className="flex items-center gap-1 shrink-0">
                            <button type="button" onClick={() => setChangePasswordOpen(true)} className="p-2 text-slate-400 hover:text-blue-400" title="تغيير كلمة المرور" aria-label="تغيير كلمة المرور">
                                <i className="fa-solid fa-key"></i>
                            </button>
                            <button onClick={onSignOut} className="p-2 text-slate-400 hover:text-rose-400 shrink-0" title="تسجيل الخروج" aria-label="تسجيل الخروج">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i>
                            </button>
                        </div>
                    </div>
                </aside>

                <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                    <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 no-print">
                        <div className="flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3 min-w-0">
                                <button onClick={() => setSidebarOpen(true)} className="md:hidden p-2 text-slate-400 hover:text-white" aria-label="فتح القائمة">
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>
                                <h1 className="text-sm font-bold text-white truncate">
                                    نظام متابعة عقد التواصل الاستراتيجي 2026
                                </h1>
                            </div>

                            <div className="flex items-center gap-2 shrink-0">
                                <label className="relative flex items-center">
                                    <span className="sr-only">المشروع النشط</span>
                                    <div className="relative">
                                        <i className="fa-solid fa-folder-tree absolute top-1/2 -translate-y-1/2 start-3 text-blue-400 text-xs pointer-events-none" aria-hidden="true"></i>
                                        <select
                                            value={selectedProjectId}
                                            onChange={(e) => handleProjectChange(e.target.value)}
                                            aria-label="المشروع النشط"
                                            className="bg-slate-950 border border-slate-700 hover:border-blue-500 rounded-xl ps-8 pe-3 py-2 text-sm text-white font-medium focus:border-blue-500 focus:outline-none max-w-[180px] sm:max-w-[220px] md:max-w-[260px] truncate">
                                            <option value="all">📁 كل المشاريع</option>
                                            {data.projects
                                                .filter(p => p.status !== 'disabled' && p.status !== 'archived')
                                                .map(p => (
                                                    <option key={p.id} value={p.id}>
                                                        {p.code ? `[${p.code}] ` : ''}{p.name}
                                                    </option>
                                                ))}
                                        </select>
                                    </div>
                                </label>

                                <button type="button" onClick={onToggleTheme}
                                        className="w-10 h-10 bg-slate-950 border border-slate-700 rounded-xl text-slate-300 hover:text-blue-300 hover:bg-slate-800 flex items-center justify-center transition-colors"
                                        title={theme === 'dark' ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن'}
                                        aria-label={theme === 'dark' ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن'}
                                        aria-pressed={theme === 'light'}>
                                    <i className={cx('fa-solid', theme === 'dark' ? 'fa-sun' : 'fa-moon')} aria-hidden="true"></i>
                                </button>

                                <label className="relative hidden sm:block">
                                    <span className="sr-only">بحث</span>
                                    <i className="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 start-3 text-slate-500 text-xs" aria-hidden="true"></i>
                                    <input type="search" value={filters.query}
                                           onChange={(e) => setFilters(f => ({ ...f, query: e.target.value }))}
                                           placeholder="بحث…"
                                           className="w-36 lg:w-48 bg-slate-950 border border-slate-700 rounded-xl ps-9 pe-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none" />
                                </label>

                                {canFilterOrg && (
                                    <label>
                                        <span className="sr-only">تصفية حسب الجهة</span>
                                        <select value={filters.org} onChange={(e) => setFilters(f => ({ ...f, org: e.target.value }))}
                                                className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
                                            <option value="all">كل الجهات</option>
                                            {ORG_LIST.map(o => <option key={o.code} value={o.code}>{o.label}</option>)}
                                        </select>
                                    </label>
                                )}

                                {can(profile, 'MainPlan.View') && <button type="button" onClick={() => go('masterPlan')}
                                        className="relative w-10 h-10 bg-slate-950 border border-slate-700 rounded-xl text-slate-300 hover:text-amber-300 flex items-center justify-center"
                                        title="تنبيهات التنفيذ" aria-label={`تنبيهات التنفيذ: ${visibleAlerts.length}`}>
                                    <i className="fa-solid fa-bell"></i>
                                    {visibleAlerts.length > 0 && <span className="absolute -top-1 -end-1 min-w-5 h-5 px-1 bg-rose-600 text-white text-[10px] rounded-full flex items-center justify-center">{Math.min(visibleAlerts.length, 99)}</span>}
                                </button>}

                                {can(profile, 'Tasks.Create') && activeTab !== 'tasks' && (
                                    <button onClick={() => setTaskModal({ initial: null, initialStep: 1, mode: 'create' })}
                                            className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shrink-0">
                                        <i className="fa-solid fa-plus"></i>
                                        <span className="hidden md:inline">مهمة جديدة</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="sm:hidden mt-2">
                            <input type="search" value={filters.query}
                                   onChange={(e) => setFilters(f => ({ ...f, query: e.target.value }))}
                                   placeholder="بحث…" aria-label="بحث"
                                   className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none" />
                        </div>
                    </header>

                    <main className="flex-1 p-4 md:p-6 overflow-y-auto">
                        {loadError && (
                            <div role="alert" className="mb-4 p-4 bg-rose-950/50 border border-rose-500/40 rounded-2xl text-rose-200 text-sm flex items-center justify-between gap-4">
                                <span><i className="fa-solid fa-triangle-exclamation me-2"></i>{loadError}</span>
                                <button onClick={refresh} className="px-3 py-1.5 bg-rose-600/30 hover:bg-rose-600/50 rounded-lg font-bold shrink-0">
                                    إعادة المحاولة
                                </button>
                            </div>
                        )}

                        {!activeTab && <div className="max-w-xl mx-auto mt-20 p-8 bg-slate-900 border border-rose-500/30 rounded-2xl text-center"><i className="fa-solid fa-lock text-3xl text-rose-400 mb-3"></i><h2 className="font-extrabold text-white">لا توجد شاشات مصرح بها</h2><p className="text-sm text-slate-400 mt-2">راجع مدير النظام لمنح صلاحية عرض شاشة واحدة على الأقل.</p></div>}
                        {activeTab === 'dashboard' && <DashboardScreen {...screenProps} goTo={go}
                                                          onEditTask={(t) => setTaskModal({ initial: t, initialStep: 1, mode: 'edit' })} />}
                        {activeTab === 'masterPlan' && <MasterPlanScreen {...screenProps}
                                                          onCreateProject={() => setProjectModal({ initial: null })}
                                                          onImport={() => setMasterPlanImportOpen(true)}
                                                          onEditTask={(t) => setTaskModal({ initial: t, initialStep: 1, mode: 'edit' })} />}
                        {activeTab === 'products'  && <ProductsScreen {...screenProps}
                                                          onCreate={() => setProductModal({ initial: null })}
                                                          onEdit={(p) => setProductModal({ initial: p })} />}
                        {activeTab === 'tasks'     && <TasksScreen {...screenProps}
                                                          onCreate={() => setTaskModal({ initial: null, initialStep: 1, mode: 'create' })}
                                                          onImport={() => setPlanImportOpen(true)}
                                                          templateUrl={api.plans.templateUrl}
                                                          onAssign={(t) => setTaskModal({ initial: t, initialStep: 3, mode: 'assign' })}
                                                          onEdit={(t) => setTaskModal({ initial: t, initialStep: 1, mode: 'edit' })}
                                                          onDelete={deleteTask}
                                                          onQuickStatus={quickComplete} />}
                        {activeTab === 'gantt'     && <GanttScreen {...screenProps} />}
                        {activeTab === 'calendar'  && <CalendarScreen {...screenProps} />}
                        {activeTab === 'files'     && <FilesScreen {...screenProps}
                                                          drive={drive} driveConnected={driveConnected}
                                                          onConnect={connectDrive} rootFolderId={rootFolderId}
                                                          onUpload={() => setFileModal(true)}
                                                          onApprove={approveFile}
                                                          onDelete={deleteFile} />}
                        {activeTab === 'reports'   && <ReportsScreen {...screenProps} onExport={exportCsv} exportExcelUrl={api.plans.exportUrl} />}
                        {activeTab === 'settings'  && <SettingsScreen {...screenProps} data={data} settings={settings} onSave={saveSettings} saving={busy}
                                                          drive={drive} driveConnected={driveConnected}
                                                          onConnect={connectDrive} toast={toast} api={api} refresh={refresh}
                                                          onEditUser={(u) => setUserModal({ initial: u })}
                                                          onDeleteUser={deleteUser}
                                                          onInviteUser={(u) => setInviteUserModal({ initial: u })}
                                                          onResetPasswordUser={(u) => setResetPasswordUser(u)}
                                                          onEditProject={(p) => setProjectModal({ initial: p })}
                                                          onCreateProject={() => setProjectModal({ initial: null })}
                                                          onSafeDeleteProject={(p) => setSafeDeleteModal(p)}
                                                          onOpenImport={(ent) => setHierarchyImportModal({ entity: ent || 'projects' })} />}
                    </main>
                </div>

                <TaskWizardModal open={!!taskModal} initial={taskModal && taskModal.initial}
                                 defaultProjectId={selectedProjectId !== 'all' ? selectedProjectId : undefined}
                                 initialStep={taskModal && taskModal.initialStep} mode={taskModal && taskModal.mode}
                                 data={data} profile={profile} api={api}
                                 onCreateProject={() => setProjectModal({ initial: null })}
                                 onCreatePlanItem={(projId) => setPlanItemQuickModal({ projectId: projId })}
                                 onClose={() => setTaskModal(null)} onSubmit={saveTask} busy={busy} />
                <ProductModal open={!!productModal} initial={productModal && productModal.initial}
                              defaultProjectId={selectedProjectId !== 'all' ? selectedProjectId : undefined}
                              data={data}
                              onClose={() => setProductModal(null)} onSubmit={saveProduct} busy={busy} />
                <UserModal open={!!userModal} initial={userModal && userModal.initial}
                           isSelf={!!(userModal && userModal.initial && userModal.initial.id === profile.id)}
                           onClose={() => setUserModal(null)} onSubmit={saveUser} busy={busy} />
                <InviteUserModal open={!!inviteUserModal} initial={inviteUserModal && inviteUserModal.initial}
                                 api={api} onClose={() => setInviteUserModal(null)} onCreated={refresh} toast={toast} />
                <ChangePasswordModal open={changePasswordOpen} api={api}
                                     onClose={() => setChangePasswordOpen(false)} toast={toast} />
                <ResetPasswordModal open={!!resetPasswordUser} user={resetPasswordUser}
                                    api={api} onClose={() => setResetPasswordUser(null)} toast={toast} />
                <PlanItemQuickModal open={!!planItemQuickModal} projectId={planItemQuickModal && planItemQuickModal.projectId}
                                    api={api} onClose={() => setPlanItemQuickModal(null)}
                                    onCreated={() => refresh(true)} toast={toast} />
                <PlanImportModal open={planImportOpen} api={api} onClose={() => setPlanImportOpen(false)}
                                 onImported={refresh} toast={toast} />
                <MasterPlanImportModal open={masterPlanImportOpen} api={api} onClose={() => setMasterPlanImportOpen(false)}
                                       onImported={refresh} toast={toast} />
                <ProjectModal open={!!projectModal} initial={projectModal && projectModal.initial}
                              profiles={data.profiles} onClose={() => setProjectModal(null)}
                              onSubmit={saveProject} busy={busy} />
                <SafeDeleteProjectModal open={!!safeDeleteModal} project={safeDeleteModal}
                                        api={api} onClose={() => setSafeDeleteModal(null)}
                                        onDeleted={refresh} onArchived={refresh} toast={toast} />
                <HierarchicalImportModal open={!!hierarchyImportModal}
                                         initialEntity={hierarchyImportModal && hierarchyImportModal.entity}
                                         api={api} onClose={() => setHierarchyImportModal(null)}
                                         onImported={refresh} toast={toast} />
                <FileModal open={fileModal} data={data} profile={profile} api={api}
                           drive={drive} settings={settings} driveConnected={driveConnected}
                           onConnect={connectDrive} onClose={() => setFileModal(false)}
                           onFinished={refresh} toast={toast} />
                <ConfirmDialog state={confirmState} onCancel={() => setConfirmState(null)} />
            </div>
        );
    }

    /* ---------------------------------------------------------------
       12. Root
       --------------------------------------------------------------- */
    function App() {
        const api = useMemo(createApi, []);

        const [session, setSession] = useState(undefined); // undefined = still resolving
        const [profile, setProfile] = useState(undefined);
        const [toasts, setToasts]   = useState([]);
        const [theme, setTheme] = useState(() => {
            try {
                const saved = localStorage.getItem('wamy-theme');
                if (saved === 'light' || saved === 'dark') return saved;
            } catch { /* storage may be disabled */ }
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        });

        useEffect(() => {
            document.documentElement.dataset.theme = theme;
            try { localStorage.setItem('wamy-theme', theme); } catch { /* preference remains session-only */ }
        }, [theme]);

        const pushToast = useCallback((message, tone = 'info') => {
            const id = Date.now() + Math.random();
            setToasts(prev => [...prev, { id, message, tone }]);
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 6000);
        }, []);
        const dismissToast = useCallback((id) => setToasts(prev => prev.filter(t => t.id !== id)), []);

        useEffect(() => {
            if (!api) return undefined;
            let cancelled = false;

            api.auth.getSession().then(({ data }) => {
                if (!cancelled) setSession(data.session || null);
            }).catch(() => { if (!cancelled) setSession(null); });

            const { data: sub } = api.auth.onAuthStateChange((_event, next) => {
                setSession(next || null);
                if (!next) setProfile(null);
            });
            return () => { cancelled = true; sub.subscription.unsubscribe(); };
        }, [api]);

        useEffect(() => {
            if (!api || !session) { if (session === null) setProfile(null); return; }
            let cancelled = false;
            const reloadProfile = () => api.profiles.mine(session.user.id)
                .then(row => { if (!cancelled) setProfile(row || null); })
                .catch(() => { if (!cancelled) setProfile(null); });
            reloadProfile();
            const timer = setInterval(reloadProfile, 10000);
            const onFocus = () => reloadProfile();
            window.addEventListener('focus', onFocus);
            return () => { cancelled = true; clearInterval(timer); window.removeEventListener('focus', onFocus); };
        }, [api, session]);

        const signOut = useCallback(async () => {
            await api.auth.signOut();
        }, [api, profile]);

        const inviteToken = new URLSearchParams(window.location.search).get('invite');
        let view;
        if (session === undefined)       view = <div className="min-h-screen bg-slate-950 flex items-center justify-center"><Spinner /></div>;
        else if (!session && inviteToken) view = <InvitationAcceptanceScreen api={api} token={inviteToken} />;
        else if (!session)               view = <AuthScreen api={api} />;
        else if (profile === undefined)  view = <div className="min-h-screen bg-slate-950 flex items-center justify-center"><Spinner label="جارٍ تحميل الحساب…" /></div>;
        else if (!profile || profile.status !== 'active')
                                         view = <AccountHoldScreen profile={profile}
                                                    email={session.user && session.user.email}
                                                    onSignOut={signOut} />;
        else                             view = <AppShell api={api} profile={profile} onSignOut={signOut}
                                                    theme={theme} onToggleTheme={() => setTheme(value => value === 'dark' ? 'light' : 'dark')} />;

        return (
            <ToastContext.Provider value={pushToast}>
                {view}
                <ToastHost toasts={toasts} dismiss={dismissToast} />
            </ToastContext.Provider>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
        <ErrorBoundary><App /></ErrorBoundary>
    );
    </script>
</body>
</html>
