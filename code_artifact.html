                    </React.Fragment>
                )}
            </Modal>
        );
    }

    function TaskWizardModal({ open, initial, defaultProjectId, initialStep, mode, data, profile, api, onClose, onSubmit, onCreateProject, onCreatePlanItem, busy }) {
        const blank = { task_mode: 'structured', project_id: defaultProjectId || '', plan_track: '', plan_item_id: '', phase_name: '', title: '', description: '', goal: '', required_outputs: '',
            priority: 'normal', notes: '', scheduled_start_at: '', scheduled_due_at: '', assignee_ids: [], org: profile.org,
            status: 'not_started', progress: 0, schedule_change_reason: '' };
        const [form, setForm] = useState(blank);
        const [step, setStep] = useState(1);
        const [history, setHistory] = useState([]);
        const initializedSessionRef = useRef('');
        const safeProjects = sanitizeRows(data.projects);
        const safePlanItems = sanitizeRows(data.planItems);
        const safeProfiles = sanitizeRows(data.profiles);

        const localDateTime = (value, fallbackTime = '09:00') => {
            if (!value) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return `${value}T${fallbackTime}`;
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        };

        const safeIsoDate = (val, fallbackDate, defaultTime = '09:00') => {
            let str = val;
            if (!str) str = fallbackDate ? (fallbackDate.includes('T') ? fallbackDate : `${fallbackDate}T${defaultTime}`) : `${todayISO()}T${defaultTime}`;
            else if (/^\d{4}-\d{2}-\d{2}$/.test(str)) str = `${str}T${defaultTime}`;
            let d = new Date(str);
            if (Number.isNaN(d.getTime())) {
                d = new Date(`${todayISO()}T${defaultTime}`);
            }
            return d.toISOString();
        };

        const safeDateOnlyStr = (val, fallbackDate) => {
            if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
            if (val && typeof val === 'string' && val.length >= 10 && /^\d{4}-\d{2}-\d{2}/.test(val)) return val.slice(0, 10);
            const d = new Date(val || fallbackDate || todayISO());
            return Number.isNaN(d.getTime()) ? (fallbackDate || todayISO()) : d.toISOString().slice(0, 10);
        };

        const sessionKey = open ? `${(initial && initial.id) || (initial ? 'init-obj' : 'create')}_${initialStep || (mode === 'assign' ? 3 : 1)}_${mode || ''}_${defaultProjectId || ''}` : '';

        useEffect(() => {
            if (!open) {
                initializedSessionRef.current = '';
                return;
            }
            if (initializedSessionRef.current === sessionKey) {
                return;
            }
            initializedSessionRef.current = sessionKey;

            const targetStep = (initial && (initialStep || (mode === 'assign' ? 3 : 1))) || 1;
            setStep(targetStep);
            setHistory([]);
            if (initial) {
                let resolvedPlanItemId = initial.plan_item_id || '';
                let resolvedProjectId = initial.project_id || '';
                if (!resolvedProjectId && resolvedPlanItemId) {
                    const matchedPlan = byId(data.planItems, resolvedPlanItemId);
                    if (matchedPlan && matchedPlan.project_id) {
                        resolvedProjectId = matchedPlan.project_id;
                    }
                }
                const matchedBaseline = byId(data.planItems, resolvedPlanItemId);
                const matchedProject = byId(data.projects, resolvedProjectId);
                const isAdhocTask = initial.task_mode === 'adhoc' || (matchedProject && matchedProject.is_system);
                setForm({
                    ...blank,
                    ...initial,
                    task_mode: isAdhocTask ? 'adhoc' : 'structured',
                    project_id: resolvedProjectId,
                    plan_track: (matchedBaseline && matchedBaseline.track) || '',
                    plan_item_id: resolvedPlanItemId,
                    phase_name: initial.phase_name || (matchedBaseline && (matchedBaseline.phase || matchedBaseline.track)) || '',
                    title: initial.title || '',
                    description: initial.description || (matchedBaseline && (matchedBaseline.content || matchedBaseline.description)) || '',
                    goal: initial.goal || (matchedBaseline && [matchedBaseline.kpi, matchedBaseline.target].filter(Boolean).join(' — ')) || '',
                    required_outputs: initial.required_outputs || (matchedBaseline && matchedBaseline.title) || initial.title || '',
                    priority: initial.priority || (matchedBaseline && matchedBaseline.priority) || 'normal',
                    status: initial.status || 'not_started',
                    progress: initial.progress || 0,
                    org: initial.org || (matchedProject ? matchedProject.org : profile.org),
                    scheduled_start_at: localDateTime(initial.scheduled_start_at || initial.planned_start || (matchedBaseline && matchedBaseline.planned_start) || todayISO(), '09:00'),
                    scheduled_due_at: localDateTime(initial.scheduled_due_at || initial.due_date || (matchedBaseline && matchedBaseline.planned_end) || initial.planned_start || todayISO(), '17:00'),
                    assignee_ids: initial.assignee_ids && initial.assignee_ids.length ? initial.assignee_ids : initial.assignee_id ? [initial.assignee_id] : [],
                    schedule_change_reason: ''
                });
                if (initial.id && api && api.tasks && api.tasks.history) {
                    api.tasks.history(initial.id).then(setHistory).catch(() => setHistory([]));
                }
            } else {
                setForm({ ...blank, task_mode: 'structured', project_id: defaultProjectId || '' });
            }
        }, [open, sessionKey]);

        const project = byId(data.projects, form.project_id);
        const projectPlanItems = useMemo(() => safePlanItems.filter(item => item && item.project_id === form.project_id), [safePlanItems, form.project_id]);

        const availableTracks = useMemo(() => {
            const set = new Set();
            projectPlanItems.forEach(item => { if (item.track) set.add(item.track); });
            return Array.from(set);
        }, [projectPlanItems]);

        const availableProducts = useMemo(() => {
            return projectPlanItems.filter(item => !form.plan_track || item.track === form.plan_track);
        }, [projectPlanItems, form.plan_track]);

        const availablePhases = useMemo(() => {
            const set = new Set();
            projectPlanItems.forEach(item => { if (item.phase) set.add(item.phase); });
            return Array.from(set);
        }, [projectPlanItems]);

        const baseline = byId(data.planItems, form.plan_item_id);

        const chooseProject = (valOrEvent) => {
            const newProjectId = (valOrEvent && valOrEvent.target) ? valOrEvent.target.value : (valOrEvent || '');
            const newProj = byId(data.projects, newProjectId);
            setForm(prev => {
                const nextProjectPlanItems = safePlanItems.filter(item => item && item.project_id === newProjectId);
                const nextProjectTracks = new Set(nextProjectPlanItems.map(item => item.track).filter(Boolean));
                const currentItem = prev.plan_item_id ? byId(data.planItems, prev.plan_item_id) : null;
                const isItemValid = currentItem && currentItem.project_id === newProjectId;
                const isTrackValid = prev.plan_track && nextProjectTracks.has(prev.plan_track);

                return {
                    ...prev,
                    project_id: newProjectId,
                    plan_track: isTrackValid ? prev.plan_track : '',
                    plan_item_id: isItemValid ? prev.plan_item_id : '',
                    phase_name: isItemValid ? prev.phase_name : '',
                    org: (!canEditOrg && newProj) ? newProj.org : (prev.org || (newProj ? newProj.org : profile.org))
                };
            });
        };

        const chooseTrack = (valOrEvent) => {
            const track = (valOrEvent && valOrEvent.target) ? valOrEvent.target.value : (valOrEvent || '');
            setForm(prev => {
                const currentItem = prev.plan_item_id ? byId(data.planItems, prev.plan_item_id) : null;
                const isItemInTrack = currentItem && (!track || currentItem.track === track);
                return {
                    ...prev,
                    plan_track: track,
                    plan_item_id: isItemInTrack ? prev.plan_item_id : ''
                };
            });
        };

        const chooseProduct = (valOrEvent) => {
            const planItemId = (valOrEvent && valOrEvent.target) ? valOrEvent.target.value : (valOrEvent || '');
            const item = byId(data.planItems, planItemId);
            setForm(prev => {
                const currentProject = byId(data.projects, prev.project_id);
                const prevBaseline = prev.plan_item_id ? byId(data.planItems, prev.plan_item_id) : null;
                const isTitleAuto = !prev.title || (prevBaseline && prev.title === prevBaseline.title);
                const isDescAuto = !prev.description || (prevBaseline && prev.description === (prevBaseline.content || prevBaseline.description));
                const isGoalAuto = !prev.goal || (prevBaseline && prev.goal === [prevBaseline.kpi, prevBaseline.target].filter(Boolean).join(' — '));
                const isOutputsAuto = !prev.required_outputs || (prevBaseline && (prev.required_outputs === prevBaseline.title || prev.required_outputs.startsWith(prevBaseline.title)));

                return {
                    ...prev,
                    plan_item_id: planItemId,
                    plan_track: (item && item.track) || prev.plan_track,
                    phase_name: (item && (item.phase || item.track)) || (item ? prev.phase_name : ''),
                    title: item ? (isTitleAuto ? item.title : prev.title) : prev.title,
                    description: item ? (isDescAuto ? (item.content || item.description || '') : prev.description) : prev.description,
                    goal: item ? (isGoalAuto ? [item.kpi, item.target].filter(Boolean).join(' — ') : prev.goal) : prev.goal,
                    required_outputs: item ? (isOutputsAuto ? (item.title + (item.quantity ? ` (${item.quantity} ${item.unit || ''})` : '')) : prev.required_outputs) : prev.required_outputs,
                    priority: item && item.priority ? item.priority : prev.priority,
                    scheduled_start_at: item && item.planned_start ? `${item.planned_start}T09:00` : prev.scheduled_start_at,
                    scheduled_due_at: item && item.planned_end ? `${item.planned_end}T17:00` : prev.scheduled_due_at,
                    org: prev.org || (currentProject ? currentProject.org : ((profile && profile.org) || 'wamy'))
                };
            });
        };

        const canEditOrg = Boolean(
            profile && (
                isAdmin(profile) ||
                isSupervisor(profile) ||
                String(profile.role || '').toLowerCase() === 'admin' ||
                String(profile.role || '').toLowerCase() === 'supervisor' ||
                can(profile, 'Tasks.Edit') ||
                can(profile, 'Tasks.Assign') ||
                can(profile, 'Tasks.Create') ||
                can(profile, 'Settings.Users') ||
                can(profile, 'Settings.Permissions') ||
                profile.data_scope === 'all_data'
            )
        );

        const set = key => event => {
            const val = event.target.type === 'number' ? Number(event.target.value) : event.target.value;
            setForm(prev => {
                const next = { ...prev, [key]: val };
                if (key === 'status' && (val === 'completed' || val === 'approved')) {
                    next.progress = 100;
                }
                if (key === 'org') {
                    next.assignee_ids = (prev.assignee_ids || []).filter(id => {
                        const u = byId(safeProfiles, id);
                        return u && u.org === val;
                    });
                }
                return next;
            });
        };

        const toggleAssignee = id => setForm(prev => ({
            ...prev,
            assignee_ids: prev.assignee_ids.includes(id)
                ? prev.assignee_ids.filter(candidate => candidate !== id)
                : [...prev.assignee_ids, id]
        }));

        const baselineStart = baseline && baseline.planned_start ? `${baseline.planned_start} 09:00` : 'غير محدد في الخطة';
        const baselineDue = baseline && baseline.planned_end ? `${baseline.planned_end} 17:00` : 'غير محدد في الخطة';
        const baselineStartInput = baseline && baseline.planned_start ? `${baseline.planned_start}T09:00` : '';
        const baselineDueInput = baseline && baseline.planned_end ? `${baseline.planned_end}T17:00` : '';

        const scheduleChanged = initial
            ? localDateTime(initial.scheduled_start_at || initial.planned_start) !== form.scheduled_start_at
                || localDateTime(initial.scheduled_due_at || initial.due_date) !== form.scheduled_due_at
            : !!baseline && (baselineStartInput !== form.scheduled_start_at || baselineDueInput !== form.scheduled_due_at);

        const eligibleProfiles = safeProfiles.filter(user => user.status === 'active' && (form.org ? user.org === form.org : (!project || user.org === project.org)));

        const durationHours = useMemo(() => {
            const sStr = form.scheduled_start_at || form.planned_start || (baseline && baseline.planned_start) || todayISO();
            const dStr = form.scheduled_due_at || form.due_date || (baseline && baseline.planned_end) || sStr;
            const s = new Date(sStr.includes('T') ? sStr : `${sStr}T09:00`).getTime();
            const d = new Date(dStr.includes('T') ? dStr : `${dStr}T17:00`).getTime();
            if (Number.isNaN(s) || Number.isNaN(d)) return 24;
            return Math.max(0, Math.round((d - s) / 3600000));
        }, [form.scheduled_start_at, form.scheduled_due_at, form.planned_start, form.due_date, baseline]);
        const durationLabel = durationHours >= 24
            ? `${Math.floor(durationHours / 24)} يوم${durationHours % 24 ? ` و${durationHours % 24} ساعة` : ''}`
            : durationHours > 0
                ? `${durationHours} ساعة`
                : 'يوم واحد';

        const canContinueStep1 = form.task_mode === 'adhoc' || Boolean(
            form.project_id && (projectPlanItems.length === 0 || (form.plan_item_id && projectPlanItems.some(i => i.id === form.plan_item_id)))
        );
        const canContinueStep2 = Boolean(
            form.title.trim() && form.required_outputs.trim() && form.scheduled_start_at && form.scheduled_due_at
            && new Date(form.scheduled_due_at).getTime() >= new Date(form.scheduled_start_at).getTime()
        );
        const canContinueStep3 = form.assignee_ids.length > 0;

        const canContinue = step === 1 ? canContinueStep1 : step === 2 ? canContinueStep2 : canContinueStep3;

        const submit = event => {
            if (event && event.preventDefault) event.preventDefault();
            if (step < 3) { if (canContinue) setStep(value => value + 1); return; }

            const defStart = form.planned_start || (baseline && baseline.planned_start) || todayISO();
            const defDue = form.due_date || (baseline && baseline.planned_end) || defStart;

            const startIso = safeIsoDate(form.scheduled_start_at, defStart, '09:00');
            let dueIso = safeIsoDate(form.scheduled_due_at, defDue, '17:00');

            if (new Date(dueIso).getTime() < new Date(startIso).getTime()) {
                dueIso = startIso;
            }

            const plannedStart = safeDateOnlyStr(form.scheduled_start_at, defStart);
            const dueDate = safeDateOnlyStr(form.scheduled_due_at, defDue);
            const startMs = new Date(startIso).getTime();
            const dueMs = new Date(dueIso).getTime();
            const activeDuration = Math.max(1, Math.ceil((dueMs - startMs) / 86400000));

            let matchedProductId = form.product_id || null;
            if (form.task_mode !== 'adhoc' && !matchedProductId && form.plan_item_id && data.products) {
                const matchedP = data.products.find(p => p.project_id === form.project_id && (
                    (p.hierarchical_code && baseline && p.hierarchical_code === baseline.hierarchical_code) ||
                    (p.code && baseline && (p.code === baseline.product_code || p.code === baseline.external_id))
                ));
                if (matchedP) matchedProductId = matchedP.id;
            }

            const assignedList = form.assignee_ids && form.assignee_ids.length ? form.assignee_ids : (form.assignee_id ? [form.assignee_id] : []);

            onSubmit({
                task_mode: form.task_mode || 'structured',
                project_id: form.task_mode === 'adhoc' ? (form.project_id || null) : form.project_id,
                plan_item_id: form.task_mode === 'adhoc' ? null : (form.plan_item_id || null),
                product_id: form.task_mode === 'adhoc' ? null : matchedProductId,
                phase_name: form.phase_name || null,
                title: form.title,
                description: form.description || null,
                goal: form.goal || null,
                required_outputs: form.required_outputs,
                priority: form.priority,
                notes: form.notes || null,
                org: form.org,
                status: form.status,
                progress: form.progress,
                assignee_ids: assignedList,
                assignee_id: assignedList[0] || null,
                scheduled_start_at: startIso,
                scheduled_due_at: dueIso,
                planned_start: plannedStart,
                due_date: dueDate,
                active_duration: activeDuration,
                schedule_change_reason: scheduleChanged ? (form.schedule_change_reason || 'تعديل التزمين المعتمد للمهمة') : undefined
            });
        };

        const labels = ['المشروع والمنتج', 'التفاصيل والتزمين', 'الإسناد والمراجعة'];

        return (
            <Modal open={open} onClose={onClose} size="xl"
                   title={initial ? (mode === 'assign' ? 'إسناد المهمة التنفيذية' : 'تعديل المهمة التنفيذية') : 'إنشاء مهمة تنفيذية جديدة'}
                   subtitle="المشروع ← الخطة/المسار ← المنتج/المخرج ← المرحلة ← المهمة ← المسؤولون"
                   footer={
                       <React.Fragment>
                           <button type="button" onClick={step === 1 ? onClose : () => setStep(value => value - 1)} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">
                               {step === 1 ? 'إلغاء' : 'السابق'}
                           </button>
                           <button type={step < 3 ? "submit" : "button"} form="task-wizard-form" onClick={step === 3 ? submit : undefined} disabled={busy || !canContinue}
                                   className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold disabled:opacity-50">
                               {busy && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}
                               {step < 3 ? 'التالي' : mode === 'assign' ? 'تأكيد الإسناد' : initial ? 'حفظ التعديلات' : 'إنشاء وإسناد المهمة'}
                           </button>
                       </React.Fragment>
                   }>

                {/* Mode Selector Toggle */}
                {!initial && (
                    <div className="flex p-1 bg-slate-950 border border-slate-800 rounded-xl mb-4">
                        <button type="button" onClick={() => setForm(prev => ({ ...prev, task_mode: 'structured' }))}
                                className={cx('flex-1 py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5',
                                    form.task_mode !== 'adhoc' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white')}>
                            <i className="fa-solid fa-folder-tree"></i>
                            <span>مهمة مرتبطة بمشروع وخطة</span>
                        </button>
                        <button type="button" onClick={() => setForm(prev => ({ ...prev, task_mode: 'adhoc' }))}
                                className={cx('flex-1 py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5',
                                    form.task_mode === 'adhoc' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-white')}>
                            <i className="fa-solid fa-bolt"></i>
                            <span>مهمة تشغيلية مستقلة</span>
                        </button>
                    </div>
                )}

                <div className="grid grid-cols-3 gap-2 mb-5">
                    {labels.map((label, index) => {
                        const targetStepNum = index + 1;
                        const isCurrent = step === targetStepNum;
                        const isPast = step > targetStepNum;
                        const canJump = isPast || (targetStepNum === 2 && canContinueStep1) || (targetStepNum === 3 && canContinueStep1 && canContinueStep2);
                        return (
                            <button key={label} type="button" disabled={!canJump}
                                    onClick={() => canJump && setStep(targetStepNum)}
                                    className={cx('p-2 rounded-xl text-center text-xs font-bold border transition-colors',
                                        isCurrent ? 'bg-blue-600 border-blue-500 text-white shadow-md'
                                            : isPast ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-300 hover:bg-emerald-900/40'
                                            : canJump ? 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'
                                            : 'bg-slate-950 border-slate-800 text-slate-500 cursor-not-allowed opacity-60')}>
                                <span className="block text-base">{targetStepNum}</span>{label}
                            </button>
                        );
                    })}
                </div>

                <form id="task-wizard-form" onSubmit={submit}>
                    {step === 1 && form.task_mode === 'adhoc' && (
                        <div className="space-y-4">
                            <div className="p-4 bg-amber-950/40 border border-amber-500/30 rounded-xl text-amber-300 text-sm flex items-start gap-3">
                                <i className="fa-solid fa-bolt text-amber-400 mt-0.5 text-base"></i>
                                <div>
                                    <strong className="block font-bold mb-0.5">مهمة تشغيلية مستقلة</strong>
                                    <span>هذه المهمة مستقلة وتشغيلية مباشرة ولا تشترط ربطاً مسبقاً بمشروع أو خطة معتمدة. سيتم إسنادها وتزمينها فوراً، مع إمكانية ربطها بمشروع لاحقاً عند الحاجة.</span>
                                </div>
                            </div>
                            <Field label="الجهة المسؤولة" required hint="اختر الجهة المسؤولة عن تنفيذ هذه المهمة التشغيلية">
                                <select className={inputClass} value={form.org} onChange={set('org')}>
                                    {Object.values(DYNAMIC_ORGS_MAP).filter(o => o.is_active !== false).map(o => (
                                        <option key={o.code} value={o.code}>{o.label}</option>
                                    ))}
                                </select>
                            </Field>
                            <Field label="المرحلة / التصنيف الداخلي (اختياري)" hint="مثال: تشغيل يومي، دعم فني، عاجل">
                                <input className={inputClass} value={form.phase_name} onChange={e => setForm(prev => ({ ...prev, phase_name: e.target.value }))} placeholder="مثال: مهمة تشغيلية مباشرة" />
                            </Field>
                        </div>
                    )}

                    {step === 1 && form.task_mode !== 'adhoc' && (
                        <div className="space-y-5">
                            <div>
                                <div className="flex items-center justify-between mb-1.5">
                                    <span className="text-xs text-slate-400">اختر المشروع المعتمد لربط المهمة به</span>
                                    {onCreateProject && (
                                        <button type="button" onClick={onCreateProject} className="text-xs text-blue-400 hover:text-blue-300 font-bold flex items-center gap-1">
                                            <i className="fa-solid fa-plus text-[10px]"></i>إنشاء مشروع جديد
                                        </button>
                                    )}
                                </div>
                                <SearchableSelect
                                    label="1. المشروع"
                                    required
                                    hint="تُحمَّل المشاريع المعتمدة والنشطة تلقائيًا من قاعدة البيانات."
                                    placeholder="— اختر المشروع المعتمد —"
                                    value={form.project_id}
                                    onChange={chooseProject}
                                    options={safeProjects.filter(item => item.status !== 'cancelled' && !item.is_system).map(item => ({
                                        value: item.id,
                                        label: item.name,
                                        code: '',
                                        badge: null,
                                        subtitle: item.description
                                    }))}
                                    emptyMessage="لا توجد مشاريع مطابقة"
                                />
                            </div>

                            {!form.project_id && (
                                <div className="p-4 bg-slate-900/60 border border-slate-800 rounded-xl text-slate-400 text-xs flex items-center gap-2.5">
                                    <i className="fa-solid fa-circle-info text-blue-400 text-sm"></i>
                                    <span>اختر المشروع المعتمد أولاً لتحميل ومزامنة المسارات والمنتجات والمراحل المرتبطة به تلقائياً.</span>
                                </div>
                            )}

                            {form.project_id && projectPlanItems.length === 0 && (
                                <div className="p-4 bg-amber-950/40 border border-amber-500/30 rounded-xl text-amber-300 text-sm flex items-start justify-between gap-3">
                                    <div className="flex items-start gap-3">
                                        <i className="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5 text-base"></i>
                                        <div>
                                            <strong className="block font-bold mb-0.5">تنبيه</strong>
                                            <span>لا توجد منتجات أو بنود خطة مسجلة حالياً لهذا المشروع. يمكنك إضافة بند جديد الآن فورياً.</span>
                                        </div>
                                    </div>
                                    {onCreatePlanItem && (
                                        <button type="button" onClick={() => onCreatePlanItem(form.project_id)}
                                                className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shrink-0">
                                            <i className="fa-solid fa-plus me-1"></i>إضافة بند خطة
                                        </button>
                                    )}
                                </div>
                            )}

                            {form.project_id && projectPlanItems.length > 0 && (
                                <React.Fragment>
                                    <SearchableSelect
                                        label="2. الخطة / المسار"
                                        placeholder="— كل المسارات والخطط المعرفة —"
                                        hint="تصفية اختيارية حسب المسارات والخطط المعرفة للمشروع."
                                        allOptionLabel={`— جميع المسارات والخطط (${availableTracks.length}) —`}
                                        value={form.plan_track}
                                        onChange={chooseTrack}
                                        clearable
                                        options={availableTracks.map(track => ({
                                            value: track,
                                            label: track
                                        }))}
                                        emptyMessage="لا توجد مسارات مطابقة"
                                    />

                                    <div>
                                        <div className="flex items-center justify-between mb-1.5">
                                            <span className="text-xs text-slate-400">حدد المنتج أو المخرج المعتمد من الخطة</span>
                                            {onCreatePlanItem && (
                                                <button type="button" onClick={() => onCreatePlanItem(form.project_id)} className="text-xs text-emerald-400 hover:text-emerald-300 font-bold flex items-center gap-1">
                                                    <i className="fa-solid fa-plus text-[10px]"></i>إضافة بند خطة جديد
                                                </button>
                                            )}
                                        </div>
                                        <SearchableSelect
                                            label="3. منتج المشروع / المخرج المعتمد"
                                            required
                                            hint="القائمة مقيّدة بالمنتجات والمخرجات المعتمدة التابعة للمشروع والمسار المختار."
                                            placeholder={`— اختر المنتج أو المخرج (${availableProducts.length}) —`}
                                            value={form.plan_item_id}
                                            onChange={chooseProduct}
                                            options={availableProducts.map(item => ({
                                                value: item.id,
                                                label: item.title,
                                                code: item.hierarchical_code || item.external_id || item.code,
                                                badge: item.hierarchical_code || item.external_id || item.code,
                                                subtitle: item.content || item.description,
                                                meta: item.quantity ? `الكمية المستهدفة: ${item.quantity} ${item.unit || ''}` : null,
                                                track: item.track,
                                                phase: item.phase
                                            }))}
                                            emptyMessage="لا توجد منتجات أو مخرجات مطابقة"
                                        />
                                    </div>

                                    <div className="grid sm:grid-cols-2 gap-4">
                                        <SearchableSelect
                                            label="4. المرحلة / المعلم المرتبط"
                                            hint="اختر مرحلة معتمدة من خطة المشروع أو أدخل مرحلة مخصصة."
                                            placeholder="مثال: مرحلة الانطلاق والتنفيذ"
                                            value={form.phase_name}
                                            onChange={(val) => setForm(prev => ({ ...prev, phase_name: val }))}
                                            allowCustom
                                            clearable
                                            options={availablePhases.map(phase => ({
                                                value: phase,
                                                label: phase
                                            }))}
                                            emptyMessage="اكتب اسم المرحلة واضغط إضافة أو إنتر"
                                        />
                                        <Field label="الجهة المسؤولة" hint={canEditOrg ? 'صلاحية لمدير أو مشرف النظام لتعديل الجهة المسؤولة عند الحاجة' : 'محددة تلقائياً حسب المشروع والخطة'}>
                                            <select className={inputClass} value={form.org} onChange={set('org')} disabled={!canEditOrg}>
                                                {Object.values(DYNAMIC_ORGS_MAP).filter(o => o.is_active !== false).map(o => (
                                                    <option key={o.code} value={o.code}>{o.label}</option>
                                                ))}
                                            </select>
                                        </Field>
                                    </div>
                                </React.Fragment>
                            )}

                            {baseline && (
                                <div className="p-4 bg-blue-950/30 border border-blue-500/30 rounded-xl space-y-2">
                                    <div className="flex items-center justify-between">
                                        <strong className="text-blue-300 text-sm flex items-center gap-2">
                                            <i className="fa-solid fa-layer-group"></i>بيانات خط الأساس المعتمد
                                        </strong>
                                        <span className="font-mono text-xs text-blue-400 bg-blue-950 px-2 py-0.5 rounded border border-blue-500/20">{baseline.hierarchical_code || baseline.external_id}</span>
                                    </div>
                                    <p className="text-sm text-slate-200">{baseline.title}</p>
                                    {baseline.content && <p className="text-xs text-slate-400">{baseline.content}</p>}
                                    <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400 pt-1 border-t border-blue-500/20">
                                        <span><strong>المسار:</strong> {baseline.track || '—'}</span>
                                        <span><strong>المرحلة:</strong> {baseline.phase || '—'}</span>
                                        {baseline.kpi && <span><strong>مؤشر الأداء:</strong> {baseline.kpi}</span>}
                                        <span className="font-mono text-blue-300 ms-auto" dir="ltr">{baselineStart} → {baselineDue}</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-4">
                            <Field label="اسم المهمة التنفيذية" required>
                                <input className={inputClass} value={form.title} onChange={set('title')} maxLength="300" required />
                            </Field>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Field label="الوصف التفصيلي">
                                    <textarea className={cx(inputClass, 'h-24')} value={form.description} onChange={set('description')} />
                                </Field>
                                <Field label="الهدف ومؤشرات التحقق">
                                    <textarea className={cx(inputClass, 'h-24')} value={form.goal} onChange={set('goal')} />
                                </Field>
                            </div>

                            <Field label="المخرجات المطلوبة والتسليمات" required>
                                <textarea className={cx(inputClass, 'h-20')} value={form.required_outputs} onChange={set('required_outputs')} required />
                            </Field>

                            <div className="grid md:grid-cols-3 gap-4">
                                <Field label="الأولوية">
                                    <select className={inputClass} value={form.priority} onChange={set('priority')}>
                                        {Object.values(PRIORITY).map(item => <option key={item.code} value={item.code}>{item.label}</option>)}
                                    </select>
                                </Field>
                                <Field label="الحالة">
                                    <select className={inputClass} value={form.status} onChange={set('status')}>
                                        {Object.values(TASK_STATUS).map(s => <option key={s.code} value={s.code}>{s.label}</option>)}
                                    </select>
                                </Field>
                                <Field label={`نسبة الإنجاز: ${form.progress}%`}>
                                    <input type="range" min="0" max="100" step="5" value={form.progress} onChange={set('progress')}
                                           className="w-full accent-blue-500 mt-2" aria-label="نسبة الإنجاز" />
                                </Field>
                            </div>

                            <Field label="الملاحظات والتعليمات">
                                <input className={inputClass} value={form.notes} onChange={set('notes')} placeholder="تعليمات تشغيلية إضافية..." />
                            </Field>

                            <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                                <div className="flex items-center justify-between">
                                    <strong className="text-sm text-white flex items-center gap-2">
                                        <i className="fa-regular fa-clock text-blue-400"></i>التزمين المعتمد للمهمة
                                    </strong>
                                    <span className="font-mono text-xs text-blue-400" dir="ltr">{baselineStart} → {baselineDue}</span>
                                </div>
                                <div className="grid md:grid-cols-2 gap-4">
                                    <Field label="بداية المهمة المعتمدة" required>
                                        <input type="datetime-local" lang="en" dir="ltr" className={inputClass} value={form.scheduled_start_at} onChange={set('scheduled_start_at')} required />
                                    </Field>
                                    <Field label="استحقاق المهمة المعتمد" required>
                                        <input type="datetime-local" lang="en" dir="ltr" className={inputClass} value={form.scheduled_due_at} min={form.scheduled_start_at} onChange={set('scheduled_due_at')} required />
                                    </Field>
                                </div>
                                <p className="text-xs text-slate-400">مدة التنفيذ المحسوبة: <strong className="text-white">{durationLabel}</strong></p>
                                {scheduleChanged && (
                                    <Field label="سبب تعديل التزمين">
                                        <input className={inputClass} value={form.schedule_change_reason} onChange={set('schedule_change_reason')} placeholder="سبب التعديل لأغراض سجل المتابعة والتدقيق" />
                                    </Field>
                                )}
                            </div>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="space-y-5">
                            <div>
                                <h3 className="font-bold text-white mb-3">اختيار مسؤول أو أكثر من جهة المشروع ({project ? org(project.org || form.org).label : org(form.org).label})</h3>
                                <div className="grid sm:grid-cols-2 gap-2 max-h-56 overflow-auto">
                                    {eligibleProfiles.map(user => (
                                        <label key={user.id} className={cx('p-3 rounded-xl border flex items-center gap-3 cursor-pointer transition-colors',
                                            form.assignee_ids.includes(user.id) ? 'bg-blue-950 border-blue-500/50 text-white' : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700')}>
                                            <input type="checkbox" checked={form.assignee_ids.includes(user.id)} onChange={() => toggleAssignee(user.id)} className="accent-blue-500" />
                                            <Avatar name={user.name} size="w-8 h-8 text-xs" />
                                            <span>
                                                <strong className="block text-sm">{user.name}</strong>
                                                <small className="text-slate-500">{user.position || org(user.org).short}</small>
