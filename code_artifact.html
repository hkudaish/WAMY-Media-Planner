    <script type="text/babel" data-presets="react">
    /* =================================================================
       لوحة متابعة الخطة الزمنية — WAMY & إمعان
       -----------------------------------------------------------------
       Data and identity live in the local PostgreSQL database. The browser
       talks only to the same-origin API; database credentials and permission
       enforcement stay on the server.
       ================================================================= */

    const { useState, useEffect, useMemo, useCallback, useRef, useContext, createContext } = React;

    /* ---------------------------------------------------------------
       2. Domain constants
       Codes are the stored values; labels are presentation only. This is
       what lets a status be renamed or translated without a migration.
       --------------------------------------------------------------- */
    const ORG_ACCENTS = {
        blue:    { dot: 'bg-blue-500',    text: 'text-blue-300',    chip: 'bg-blue-950 text-blue-300 border-blue-500/40',       bar: 'bg-blue-500' },
        emerald: { dot: 'bg-emerald-500', text: 'text-emerald-300', chip: 'bg-emerald-950 text-emerald-300 border-emerald-500/40', bar: 'bg-emerald-500' },
        purple:  { dot: 'bg-purple-500',  text: 'text-purple-300',  chip: 'bg-purple-950 text-purple-300 border-purple-500/40',   bar: 'bg-purple-500' },
        amber:   { dot: 'bg-amber-500',   text: 'text-amber-300',   chip: 'bg-amber-950 text-amber-300 border-amber-500/40',     bar: 'bg-amber-500' },
        cyan:    { dot: 'bg-cyan-500',    text: 'text-cyan-300',    chip: 'bg-cyan-950 text-cyan-300 border-cyan-500/40',       bar: 'bg-cyan-500' },
        rose:    { dot: 'bg-rose-500',    text: 'text-rose-300',    chip: 'bg-rose-950 text-rose-300 border-rose-500/40',       bar: 'bg-rose-500' }
    };
    const ORGS = {
        wamy:  { code: 'wamy',  label: 'الندوة WAMY', short: 'الندوة', accent: 'blue',    ...ORG_ACCENTS.blue },
        imaan: { code: 'imaan', label: 'إمعان',        short: 'إمعان',  accent: 'emerald', ...ORG_ACCENTS.emerald }
    };
    let DYNAMIC_ORGS_MAP = { ...ORGS };
    const setDynamicOrgs = (orgsList) => {
        if (!Array.isArray(orgsList)) return;
        const map = { ...ORGS };
        orgsList.forEach(o => {
            const acc = ORG_ACCENTS[o.accent_color] || ORG_ACCENTS.blue;
            map[o.code] = {
                code: o.code,
                label: o.name,
                short: o.short_name || o.name,
                accent: o.accent_color || 'blue',
                ...acc
            };
        });
        DYNAMIC_ORGS_MAP = map;
    };
    const ORG_LIST = Object.values(ORGS);

    const ROLES = {
        admin:              { code: 'admin',              label: 'مدير نظام',       hint: 'صلاحيات كاملة', chip: 'bg-purple-950 text-purple-300 border-purple-500/40' },
        supervisor:         { code: 'supervisor',         label: 'مشرف',            hint: 'إشراف تشغيلي', chip: 'bg-blue-950 text-blue-300 border-blue-500/40' },
        project_manager:    { code: 'project_manager',    label: 'مدير مشروع',      hint: 'إدارة المشروع', chip: 'bg-cyan-950 text-cyan-300 border-cyan-500/40' },
        department_manager: { code: 'department_manager', label: 'مدير إدارة',      hint: 'إدارة القسم', chip: 'bg-indigo-950 text-indigo-300 border-indigo-500/40' },
        team_lead:          { code: 'team_lead',          label: 'قائد فريق',       hint: 'إدارة الفريق', chip: 'bg-sky-950 text-sky-300 border-sky-500/40' },
        user:               { code: 'user',               label: 'موظف',            hint: 'تنفيذ المهام', chip: 'bg-slate-800 text-slate-300 border-slate-600/40' },
        reviewer:           { code: 'reviewer',           label: 'مراجع',           hint: 'مراجعة الأعمال', chip: 'bg-amber-950 text-amber-300 border-amber-500/40' },
        approver:           { code: 'approver',           label: 'معتمد',           hint: 'اعتماد الأعمال', chip: 'bg-emerald-950 text-emerald-300 border-emerald-500/40' },
        read_only:          { code: 'read_only',          label: 'قراءة فقط',       hint: 'عرض دون تعديل', chip: 'bg-slate-900 text-slate-400 border-slate-600/40' }
    };
    const DATA_SCOPES = {
        my_data: { label: 'بياناتي فقط' }, my_team: { label: 'فريقي' },
        my_department: { label: 'إدارتي' }, my_project: { label: 'مشروعي' }, all_data: { label: 'كل البيانات' }
    };

    const USER_STATUS = {
        pending:  { code: 'pending',  label: 'بانتظار التفعيل', chip: 'bg-amber-950 text-amber-300 border-amber-500/40' },
        active:   { code: 'active',   label: 'نشط',             chip: 'bg-emerald-950 text-emerald-300 border-emerald-500/40' },
        disabled: { code: 'disabled', label: 'معطل',            chip: 'bg-rose-950 text-rose-300 border-rose-500/40' }
    };

    const TASK_STATUS = {
        not_started: { code: 'not_started', label: 'لم تبدأ',     chip: 'bg-slate-800 text-slate-300 border-slate-600/40',       done: false },
        in_progress: { code: 'in_progress', label: 'قيد التنفيذ', chip: 'bg-amber-950 text-amber-300 border-amber-500/40',       done: false },
        blocked:     { code: 'blocked',     label: 'متعثرة',      chip: 'bg-rose-950 text-rose-300 border-rose-500/40',          done: false },
        completed:   { code: 'completed',   label: 'مكتملة',      chip: 'bg-emerald-950 text-emerald-300 border-emerald-500/40', done: true  },
        approved:    { code: 'approved',    label: 'معتمدة',      chip: 'bg-blue-950 text-blue-300 border-blue-500/40',          done: true  }
    };

    const PRODUCT_STATUS = {
        not_started: { code: 'not_started', label: 'لم يبدأ',     chip: 'bg-slate-800 text-slate-300 border-slate-600/40' },
        in_progress: { code: 'in_progress', label: 'قيد التنفيذ', chip: 'bg-amber-950 text-amber-300 border-amber-500/40' },
        completed:   { code: 'completed',   label: 'مكتمل',       chip: 'bg-emerald-950 text-emerald-300 border-emerald-500/40' },
        approved:    { code: 'approved',    label: 'معتمد',       chip: 'bg-blue-950 text-blue-300 border-blue-500/40' },
        cancelled:   { code: 'cancelled',   label: 'ملغى',        chip: 'bg-rose-950 text-rose-300 border-rose-500/40' },
        archived:    { code: 'archived',    label: 'مؤرشف',       chip: 'bg-slate-900 text-slate-400 border-slate-600/40' }
    };

    const PRIORITY = {
        low:      { code: 'low',      label: 'منخفضة', chip: 'bg-slate-800 text-slate-300' },
        normal:   { code: 'normal',   label: 'عادية',  chip: 'bg-slate-800 text-slate-200' },
        high:     { code: 'high',     label: 'عاجلة',  chip: 'bg-amber-950 text-amber-300' },
        critical: { code: 'critical', label: 'حرجة',   chip: 'bg-rose-950 text-rose-300' }
    };

    const FILE_FOLDERS = {
        proposals: { code: 'proposals', label: 'المقترحات',      chip: 'bg-amber-950 text-amber-300 border-amber-500/40' },
        approved:  { code: 'approved',  label: 'النسخ المعتمدة', chip: 'bg-emerald-950 text-emerald-300 border-emerald-500/40' }
    };

    const FILE_STATUS = {
        draft:              { code: 'draft',              label: 'مسودة',           chip: 'bg-slate-800 text-slate-300' },
        under_review:       { code: 'under_review',       label: 'قيد المراجعة',    chip: 'bg-amber-950 text-amber-300' },
        ready_for_approval: { code: 'ready_for_approval', label: 'جاهز للاعتماد',   chip: 'bg-blue-950 text-blue-300' },
        approved:           { code: 'approved',           label: 'معتمد',           chip: 'bg-emerald-950 text-emerald-300' },
        rejected:           { code: 'rejected',           label: 'مُعاد للتعديل',   chip: 'bg-rose-950 text-rose-300' }
    };

    /* Each permission gates both the interface and its matching API route. */
    const permissionEntries = (prefix, actions) => actions.map(([key,label]) => ({ key: `${prefix}.${key}`, label }));
    const PERMISSION_GROUPS = [
        { label: 'الشاشات', items: [['Dashboard.View','لوحة المؤشرات'],['MainPlan.View','الخطة الرئيسية'],['Products.View','المنتجات'],['Tasks.View','المهام'],['Timeline.View','الخطة الزمنية'],['Calendar.View','التقويم'],['Files.View','الملفات'],['Reports.View','التقارير'],['Settings.View','الإعدادات'],['Audit.View','سجل النشاط']].map(([key,label]) => ({key,label})) },
        { label: 'المشاريع', items: permissionEntries('Projects', [['View','عرض'],['Create','إنشاء'],['Edit','تعديل'],['Delete','حذف'],['Archive','أرشفة']]) },
        { label: 'الخطط', items: permissionEntries('Plans', [['View','عرض'],['Create','إنشاء'],['Import','استيراد'],['Edit','تعديل'],['Archive','أرشفة'],['Export','تصدير']]) },
        { label: 'الجهات', items: permissionEntries('Organizations', [['View','عرض'],['Create','إنشاء'],['Edit','تعديل'],['Delete','حذف'],['Activate','تفعيل'],['Deactivate','تعطيل']]) },
        { label: 'المنتجات والمراحل', items: [...permissionEntries('Products', [['Create','إنشاء منتج'],['Edit','تعديل منتج'],['Delete','حذف منتج']]), ...permissionEntries('Milestones', [['View','عرض مرحلة'],['Create','إنشاء مرحلة'],['Edit','تعديل مرحلة'],['Delete','حذف مرحلة']])] },
        { label: 'المهام', items: permissionEntries('Tasks', [['Create','إنشاء'],['Edit','تعديل'],['Assign','إسناد'],['Delete','حذف'],['Start','بدء'],['Complete','إنهاء'],['Approve','اعتماد'],['Close','إغلاق']]) },
        { label: 'التقارير', items: permissionEntries('Reports', [['Export','تصدير'],['ExecutiveView','تنفيذي'],['FinancialView','مالي'],['TeamPerformanceView','أداء الفرق']]) },
        { label: 'الملفات', items: permissionEntries('Files', [['Upload','رفع'],['Download','تنزيل'],['Edit','تعديل'],['Delete','حذف'],['Approve','اعتماد'],['MoveToApproved','نقل للمعتمد']]) },
        { label: 'التقويم', items: permissionEntries('Calendar', [['Create','إنشاء'],['Edit','تعديل'],['Delete','حذف'],['ManageSchedule','إدارة الجدولة']]) },
        { label: 'الإعدادات', items: permissionEntries('Settings', [['General','عامة'],['Users','المستخدمون'],['Roles','الأدوار'],['Permissions','الصلاحيات'],['Departments','الإدارات'],['Backup','النسخ الاحتياطي'],['Security','الأمان'],['Integrations','التكاملات']]) }
    ];
    const PERMISSIONS = PERMISSION_GROUPS.flatMap(group => group.items);
    const EMPTY_PERMISSIONS = PERMISSIONS.reduce((acc, p) => ({ ...acc, [p.key]: false }), {});

    const LOG_TYPES = {
        AUTH:     { label: 'دخول',    icon: 'fa-right-to-bracket', color: 'text-slate-400' },
        CREATE:   { label: 'إنشاء',   icon: 'fa-plus',             color: 'text-blue-400' },
        UPDATE:   { label: 'تعديل',   icon: 'fa-pen',              color: 'text-amber-400' },
        DELETE:   { label: 'حذف',     icon: 'fa-trash-can',        color: 'text-rose-400' },
        UPLOAD:   { label: 'رفع',     icon: 'fa-cloud-arrow-up',   color: 'text-emerald-400' },
        APPROVAL: { label: 'اعتماد',  icon: 'fa-circle-check',     color: 'text-emerald-400' },
        SETTINGS: { label: 'إعدادات', icon: 'fa-sliders',          color: 'text-purple-400' }
    };

    /* ---------------------------------------------------------------
       3. Small helpers
       --------------------------------------------------------------- */
    const cx = (...parts) => parts.filter(Boolean).join(' ');
    const org = (code) => DYNAMIC_ORGS_MAP[code] || ORGS[code] || {
        code,
        label: code,
        short: code,
        accent: 'blue',
        ...ORG_ACCENTS.blue
    };
    const lookup = (map, code, fallbackKey) => map[code] || map[fallbackKey];

    const todayISO = () => new Date().toISOString().slice(0, 10);

    /* Keep the Arabic interface while rendering every system-generated
       number with Latin (English) digits and the approved Gregorian order. */
    const dateParts = (value, withTime = false) => {
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return null;
        const options = { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit' };
        if (withTime) Object.assign(options, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
        return Object.fromEntries(new Intl.DateTimeFormat('en-US-u-nu-latn', options)
            .formatToParts(d).filter(part => part.type !== 'literal').map(part => [part.type, part.value]));
    };

    const formatDate = (value) => {
        if (!value) return '—';
        const parts = dateParts(value);
        return parts ? `${parts.year}/${parts.month}/${parts.day}` : '—';
    };

    const formatDateTime = (value) => {
        if (!value) return '—';
        const parts = dateParts(value, true);
        return parts ? `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}` : '—';
    };

    const daysUntil = (dateStr) => {
        if (!dateStr) return null;
        const due = new Date(dateStr); due.setHours(0, 0, 0, 0);
        const now = new Date();       now.setHours(0, 0, 0, 0);
        return Math.round((due - now) / 86400000);
    };

    const initials = (name) => (name || '?')
        .trim().split(/\s+/).filter(w => !/^(د\.|م\.|أ\.|Dr\.?|Eng\.?)$/i.test(w))
        .slice(0, 2).map(w => w[0]).join('');

    /* Progress reported by a product is the mean of its tasks. manual_progress
       is only a fallback for a product that has no tasks yet, which removes
       the two-sources-of-truth drift the previous version had. */
    const sanitizeRows = (rows) => Array.isArray(rows) ? rows.filter(Boolean) : [];
    const productProgress = (product, tasks) => {
        if (!product) return 0;
        if (!Array.isArray(tasks) || tasks.length === 0) return product.manual_progress ?? 0;
        let sum = 0;
        let count = 0;
        for (let i = 0; i < tasks.length; i++) {
            const t = tasks[i];
            if (t && t.product_id === product.id) {
                sum += (t.progress || 0);
                count++;
            }
        }
        if (count === 0) return product.manual_progress ?? 0;
        return Math.round(sum / count);
    };
    const byId = (rows, id) => {
        if (!id || !rows) return undefined;
        if (rows instanceof Map) return rows.get(id);
        if (Array.isArray(rows)) {
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                if (r && r.id === id) return r;
            }
        }
        return undefined;
    };

    const isTaskDone = (task) => !!(TASK_STATUS[task.status] || {}).done;

    const isOverdue = (task) => {
        const due = task.scheduled_due_at || task.due_date;
        if (isTaskDone(task) || !due) return false;
        return new Date(due).getTime() < Date.now();
    };

    /* ---------------------------------------------------------------
       4. Permission helpers (the API repeats every authorization check)
       --------------------------------------------------------------- */
    const isActive     = (p) => !!p && p.status === 'active';
    const isAdmin      = (p) => isActive(p) && p.role === 'admin';
    const isSupervisor = (p) => isActive(p) && p.role === 'supervisor';
    const LEGACY_PERMISSION_MAP = { 'Tasks.Create':'canCreateTasks','Tasks.Edit':'canCreateTasks','Tasks.Assign':'canCreateTasks','Plans.Import':'canCreateTasks','Files.Approve':'canApproveFiles','Files.MoveToApproved':'canApproveFiles','Settings.Users':'canEditUsers','Settings.Permissions':'canEditUsers','Reports.Export':'canExportReports','Settings.Integrations':'canManageSettings' };
    const can = (p, perm) => isAdmin(p) || (isActive(p) && ((p.permissions || {})[perm] === true || (!(perm in (p.permissions || {})) && !!(p.permissions || {})[LEGACY_PERMISSION_MAP[perm]])));
    const canAny = (p, ...permissions) => permissions.some(permission => can(p, permission));

    /* ---------------------------------------------------------------
       5. Data access layer
       Every query lives here, so swapping the backend touches one section.
       --------------------------------------------------------------- */
    /* Database errors returned by the local API, translated into actionable
       messages. PostgreSQL credentials never leave the server. */
    const DENIED = 'ليست لديك الصلاحية لتنفيذ هذه العملية، أو أن العنصر لم يعد موجودًا.';
    function describeDbError(error) {
        const message = String((error && error.message) || '');
        const code    = (error && error.code) || '';
        if (code === '42501' || code === 'FORBIDDEN') return DENIED;
        if (code === '23505')  return 'هذه القيمة مستخدمة مسبقًا؛ اختر رمزًا أو بريدًا مختلفًا.';
        if (code === '23503')  return 'لا يمكن إتمام العملية لارتباط السجل بعناصر أخرى.';
        if (code === '23514')  return 'إحدى القيم خارج النطاق المسموح.';
        if (/Failed to fetch|NetworkError/i.test(message)) return 'تعذّر الاتصال بالخادم. تحقق من الشبكة ثم أعد المحاولة.';
        return message || 'تعذّر تنفيذ العملية';
    }

    function createApi() {
        const listeners = new Set();
        const request = async (path, options = {}) => {
            const { headers = {}, ...rest } = options;
            const isFormData = typeof FormData !== 'undefined' && rest.body instanceof FormData;
            const response = await fetch('/api' + path, {
                credentials: 'same-origin',
                ...rest,
                headers: isFormData ? headers : { 'Content-Type': 'application/json', ...headers }
            });
            const payload = response.status === 204 ? null : await response.json().catch(() => null);
            if (!response.ok) {
                const error = new Error((payload && payload.message) || `HTTP ${response.status}`);
                error.code = payload && payload.code;
                throw error;
            }
            return payload;
        };
        const resource = (name) => ({
            list:   () => request('/' + name),
            create: (row) => request('/' + name, { method: 'POST', body: JSON.stringify(row) }),
            update: (id, patch, updatedAt) => request('/' + name + '/' + encodeURIComponent(id), {
                method: 'PATCH', body: JSON.stringify(patch),
                headers: updatedAt ? { 'If-Match': `"${updatedAt}"` } : {}
            }),
            remove: (id) => request('/' + name + '/' + encodeURIComponent(id), { method: 'DELETE' })
        });
        const notify = (session) => listeners.forEach(listener => listener('SESSION', session));
        const auth = {
            getSession: async () => ({ data: await request('/auth/session') }),
            onAuthStateChange: (listener) => {
                listeners.add(listener);
                return { data: { subscription: { unsubscribe: () => listeners.delete(listener) } } };
            },
            signInWithPassword: async (credentials) => {
                try {
                    const data = await request('/auth/login', { method: 'POST', body: JSON.stringify(credentials) });
                    notify(data.session);
                    return { data, error: null };
                } catch (error) { return { data: null, error }; }
            },
            signUp: async ({ email, password, options }) => {
                try {
                    const data = await request('/auth/signup', {
                        method: 'POST', body: JSON.stringify({ email, password, ...(options && options.data) })
                    });
                    return { data, error: null };
                } catch (error) { return { data: null, error }; }
            },
            invitation: (token) => request('/auth/invitations/' + encodeURIComponent(token)),
            acceptInvitation: async (token, password) => {
                const data = await request('/auth/invitations/' + encodeURIComponent(token) + '/accept', {
                    method: 'POST', body: JSON.stringify({ password })
                });
                notify(data.session);
                return data;
            },
            signOut: async () => {
                await request('/auth/logout', { method: 'POST' });
                notify(null);
                return { error: null };
            }
        };

        return {
            auth: {
                ...auth,
                changePassword: (payload) => request('/auth/change-password', { method: 'POST', body: JSON.stringify(payload) })
            },
            profiles: {
                ...resource('profiles'), mine: () => request('/profiles/me'),
                invite: (values) => request('/profiles/invite', { method: 'POST', body: JSON.stringify(values) }),
                resetPassword: (id, payload) => request('/profiles/' + encodeURIComponent(id) + '/reset-password', { method: 'POST', body: JSON.stringify(payload) })
            },
            organizations: {
                ...resource('organizations'),
                activate: (id) => request('/organizations/' + encodeURIComponent(id) + '/activate', { method: 'POST' }),
                deactivate: (id) => request('/organizations/' + encodeURIComponent(id) + '/deactivate', { method: 'POST' }),
                getDependencies: (id) => request('/organizations/' + encodeURIComponent(id) + '/dependencies')
            },
            projects: {
                ...resource('projects'),
                getDependencies: (id) => request('/projects/' + encodeURIComponent(id) + '/dependencies'),
                archive: (id) => request('/projects/' + encodeURIComponent(id) + '/archive', { method: 'POST' }),
                activate: (id) => request('/projects/' + encodeURIComponent(id) + '/activate', { method: 'POST' }),
                deactivate: (id) => request('/projects/' + encodeURIComponent(id) + '/deactivate', { method: 'POST' }),
                deleteSafe: (id, force = false) => request('/projects/' + encodeURIComponent(id) + '?force=' + force, { method: 'DELETE' })
            },
            backups: {
                list: () => request('/backups'),
                create: (payload) => request('/backups', { method: 'POST', body: JSON.stringify(payload) }),
                downloadUrl: (id) => '/api/backups/' + encodeURIComponent(id) + '/download',
                restore: (id) => request('/backups/' + encodeURIComponent(id) + '/restore', { method: 'POST' }),
                remove: (id) => request('/backups/' + encodeURIComponent(id), { method: 'DELETE' })
            },
            system: {
                resetProjects: (payload) => request('/system/reset-projects', { method: 'POST', body: JSON.stringify(payload) })
            },
            templates: {
                url: (entity) => '/api/templates/' + encodeURIComponent(entity)
            },
            export: {
                url: (entity) => '/api/export/' + encodeURIComponent(entity)
            },
            hierarchyImport: {
                preview: (entity, file) => {
                    const body = new FormData(); body.append('file', file);
                    return request('/import/' + encodeURIComponent(entity) + '/preview', { method: 'POST', body, headers: {} });
                },
                commit: (entity, rows, mode = 'add_only') => request('/import/' + encodeURIComponent(entity) + '/commit', {
                    method: 'POST', body: JSON.stringify({ rows, mode })
                })
            },
            planItems: { ...resource('master-plan-items'), list: () => request('/master-plan-items') },
            alerts: { list: () => request('/alerts') },
            masterPlans: {
                preview: (file) => {
                    const body = new FormData(); body.append('file', file);
                    return request('/master-plans/preview', { method: 'POST', body, headers: {} });
                },
                import: (rows, definitions) => request('/master-plans/import', {
                    method: 'POST', body: JSON.stringify({ rows, definitions })
                })
            },
            products: resource('products'),
            tasks: { ...resource('tasks'), history: (id) => request('/tasks/' + encodeURIComponent(id) + '/schedule-history') },
            plans: {
                templateUrl: '/api/plans/template',
                exportUrl: '/api/plans/export',
                preview: (file) => {
                    const body = new FormData(); body.append('file', file);
                    return request('/plans/preview', { method: 'POST', body, headers: {} });
                },
                import: (rows) => request('/plans/import', { method: 'POST', body: JSON.stringify({ rows }) })
            },
            files: resource('files'),
            logs: {
                list: (params = 200) => {
                    if (typeof params === 'number') return request('/logs?limit=' + params);
                    const q = new URLSearchParams(Object.entries(params).filter(([_, v]) => v != null && v !== '' && v !== 'all')).toString();
                    return request('/logs' + (q ? '?' + q : ''));
                }
            },
            settings: { get: () => request('/settings'), update: (patch, updatedAt) => request('/settings', {
                method: 'PATCH', body: JSON.stringify(patch),
                headers: updatedAt ? { 'If-Match': `"${updatedAt}"` } : {}
            }) }
        };
    }

    /* ---------------------------------------------------------------
       5b. Google Drive integration
       -----------------------------------------------------------------
       Uses Google Identity Services' token client: the browser obtains a
       short-lived access token directly, so there is no client secret and
       no server-side token exchange to host.

       The scope is drive.file -- access limited to files this app created
       or the user explicitly picked. It is deliberately the narrowest one
       that works: the broader drive/drive.readonly scopes are "restricted"
       and drag an organisation into Google's annual third-party security
       assessment. drive.file does not.
       --------------------------------------------------------------- */
    const DRIVE_SCOPE       = 'https://www.googleapis.com/auth/drive.file';
    const DRIVE_FOLDER_MIME = 'application/vnd.google-apps.folder';
    const DRIVE_FILE_FIELDS = 'id,name,size,mimeType,webViewLink,iconLink,parents,modifiedTime';
    const FOLDER_LABELS     = { proposals: 'المقترحات', approved: 'النسخ المعتمدة' };

    const formatBytes = (bytes) => {
        const n = Number(bytes);
        if (bytes === null || bytes === undefined || Number.isNaN(n)) return null;
        if (n < 1024) return n + ' بايت';
        const units = ['كيلوبايت', 'ميجابايت', 'جيجابايت', 'تيرابايت'];
        let value = n / 1024, index = 0;
        while (value >= 1024 && index < units.length - 1) { value /= 1024; index += 1; }
        return value.toFixed(value < 10 ? 1 : 0) + ' ' + units[index];
    };

    function loadExternalScript(src, id) {
        return new Promise((resolve, reject) => {
            const fail = () => reject(new Error('تعذّر تحميل مكتبات Google. تحقق من الاتصال بالإنترنت أو من مانع الإعلانات.'));
            const existing = document.getElementById(id);
            if (existing) {
                if (existing.dataset.loaded === 'true') { resolve(); return; }
                existing.addEventListener('load', () => resolve());
                existing.addEventListener('error', fail);
                return;
            }
            const el = document.createElement('script');
            el.src = src; el.id = id; el.async = true; el.defer = true;
            el.addEventListener('load', () => { el.dataset.loaded = 'true'; resolve(); });
            el.addEventListener('error', fail);
            document.head.appendChild(el);
        });
    }

    /* Drive query strings are not parameterised, so any value interpolated
       into one must be escaped or a file named  ' or x='  changes the query. */
    const escapeDriveQuery = (value) => String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

    function describeDriveError(status, payload) {
        const reason  = (((payload || {}).error || {}).errors || [{}])[0] || {};
        const message = ((payload || {}).error || {}).message || '';
        if (status === 401) return 'انتهت صلاحية جلسة Google. أعد الاتصال بـ Drive.';
        if (status === 403 && /storageQuotaExceeded/i.test(reason.reason || '')) return 'مساحة Google Drive ممتلئة.';
        if (status === 403) return 'ليست لديك صلاحية على هذا المجلد في Google Drive. راجع مشاركة المجلد.';
        if (status === 404) return 'العنصر غير موجود في Drive، أو لم يُمنح التطبيق حق الوصول إليه بعد.';
        if (status === 429 || status === 503) return 'خدمة Google مشغولة حاليًا. أعد المحاولة بعد قليل.';
        return message || `تعذّر تنفيذ العملية على Google Drive (${status}).`;
    }

    function createDriveClient() {
        let config = { clientId: '', apiKey: '' };
        let tokenClient = null;
        let token = null;            // { value, expiresAt }
        let scriptsReady = false;

        const configure = (next) => {
            const changed = next.clientId !== config.clientId;
            config = next;
            if (changed) { tokenClient = null; token = null; }
        };

        const isConfigured = () => !!(config.clientId && config.apiKey);

        const ensureScripts = async () => {
            if (scriptsReady) return;
            await loadExternalScript('https://accounts.google.com/gsi/client', 'google-identity-services');
            await loadExternalScript('https://apis.google.com/js/api.js', 'google-api-loader');
            await new Promise((resolve, reject) => {
                if (!window.gapi) { reject(new Error('تعذّر تحميل مكتبة Google API.')); return; }
                window.gapi.load('picker', { callback: resolve, onerror: () => reject(new Error('تعذّر تحميل أداة اختيار الملفات.')) });
            });
            scriptsReady = true;
        };

        const requestToken = (prompt) => new Promise((resolve, reject) => {
            if (!tokenClient) {
                tokenClient = window.google.accounts.oauth2.initTokenClient({
                    client_id: config.clientId,
                    scope: DRIVE_SCOPE,
                    callback: () => {}
                });
            }
            tokenClient.callback = (response) => {
                if (response.error) {
                    reject(new Error(response.error === 'access_denied'
                        ? 'تم رفض الإذن للوصول إلى Google Drive.'
                        : 'تعذّر الحصول على إذن Google Drive.'));
                    return;
                }
                token = { value: response.access_token, expiresAt: Date.now() + ((Number(response.expires_in) || 3600) - 60) * 1000 };
                resolve(token.value);
            };
            tokenClient.error_callback = (err) => {
                reject(new Error((err && err.type === 'popup_closed')
                    ? 'أُغلقت نافذة تسجيل الدخول قبل إتمام الإذن.'
                    : 'تعذّر فتح نافذة إذن Google. تأكد من السماح بالنوافذ المنبثقة.'));
            };
            tokenClient.requestAccessToken({ prompt });
        });

        /* A cached token is reused until it is nearly expired. Only an
           explicitly interactive call is allowed to open a popup, because
           browsers block popups not tied to a user gesture. */
        const getToken = async ({ interactive = false } = {}) => {
            if (!isConfigured()) throw new Error('لم تُضبط بيانات Google Drive بعد. راجع إعدادات النظام.');
            if (token && token.expiresAt > Date.now()) return token.value;
            await ensureScripts();
            if (!interactive) throw new Error('يلزم الاتصال بـ Google Drive أولًا.');
            return requestToken('');
        };

        const request = async (path, { method = 'GET', params, body, base = 'https://www.googleapis.com/drive/v3/' } = {}) => {
            const accessToken = await getToken();
            const url = new URL(base + path);
            url.searchParams.set('supportsAllDrives', 'true');
            Object.entries(params || {}).forEach(([key, value]) => {
                if (value !== undefined && value !== null) url.searchParams.set(key, value);
            });
            const response = await fetch(url.toString(), {
                method,
                headers: {
                    Authorization: 'Bearer ' + accessToken,
                    ...(body ? { 'Content-Type': 'application/json' } : {})
                },
                body: body ? JSON.stringify(body) : undefined
            });
            if (!response.ok) {
                let payload = null;
                try { payload = await response.json(); } catch { /* non-JSON error body */ }
                if (response.status === 401) token = null;   // force a fresh grant next time
                throw new Error(describeDriveError(response.status, payload));
            }
            return response.status === 204 ? null : response.json();
        };

        const getFile = (fileId) => request('files/' + encodeURIComponent(fileId), { params: { fields: DRIVE_FILE_FIELDS } });

        const canAccess = async (fileId) => {
            if (!fileId) return false;
            try { await getFile(fileId); return true; } catch { return false; }
        };

        const findFolder = async (name, parentId) => {
            const query = [
                `name = '${escapeDriveQuery(name)}'`,
                `mimeType = '${DRIVE_FOLDER_MIME}'`,
                `'${escapeDriveQuery(parentId)}' in parents`,
                'trashed = false'
            ].join(' and ');
            const found = await request('files', {
                params: { q: query, fields: 'files(id,name)', pageSize: 1, includeItemsFromAllDrives: 'true' }
            });
            return (found.files && found.files[0]) ? found.files[0].id : null;
        };

        const ensureFolder = async (name, parentId) => {
            const existing = await findFolder(name, parentId);
            if (existing) return existing;
            const created = await request('files', {
                method: 'POST',
                params: { fields: 'id' },
                body: { name, mimeType: DRIVE_FOLDER_MIME, parents: [parentId] }
            });
            return created.id;
        };

        const upload = async (file, parentId, onProgress) => {
            const accessToken = await getToken();
            const metadata = { name: file.name, parents: [parentId] };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files'
                    + '?uploadType=multipart&supportsAllDrives=true&fields=' + encodeURIComponent(DRIVE_FILE_FIELDS));
                xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable && onProgress) onProgress(event.loaded / event.total);
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try { resolve(JSON.parse(xhr.responseText)); }
                        catch { reject(new Error('رد غير متوقع من Google Drive.')); }
                    } else {
                        let payload = null;
                        try { payload = JSON.parse(xhr.responseText); } catch { /* ignore */ }
                        reject(new Error(describeDriveError(xhr.status, payload)));
                    }
                };
                xhr.onerror   = () => reject(new Error('انقطع الاتصال أثناء رفع الملف.'));
                xhr.onabort   = () => reject(new Error('أُلغيت عملية الرفع.'));
                xhr.ontimeout = () => reject(new Error('استغرق الرفع وقتًا طويلًا وتم إيقافه.'));
                xhr.send(form);
            });
        };

        const move = (fileId, toParentId, fromParentId) => request('files/' + encodeURIComponent(fileId), {
            method: 'PATCH',
            params: { addParents: toParentId, removeParents: fromParentId || undefined, fields: 'id,parents' }
        });

        const pick = async ({ mode = 'files' }) => {
            const accessToken = await getToken({ interactive: true });
            await ensureScripts();
            const picker = window.google.picker;
            return new Promise((resolve, reject) => {
                try {
                    const view = new picker.DocsView(mode === 'folder' ? picker.ViewId.FOLDERS : picker.ViewId.DOCS)
                        .setIncludeFolders(true);
                    if (mode === 'folder') { view.setSelectFolderEnabled(true); view.setMimeTypes(DRIVE_FOLDER_MIME); }

                    const builder = new picker.PickerBuilder()
                        .setDeveloperKey(config.apiKey)
                        .setOAuthToken(accessToken)
                        .addView(view)
                        .setLocale('ar')
                        .setCallback((result) => {
                            if (result.action === picker.Action.PICKED)      resolve(result.docs || []);
                            else if (result.action === picker.Action.CANCEL) resolve(null);
                        });
                    if (mode !== 'folder') builder.enableFeature(picker.Feature.MULTISELECT_ENABLED);
                    builder.build().setVisible(true);
                } catch (err) {
                    reject(new Error('تعذّر فتح أداة اختيار Google Drive: ' + err.message));
                }
            });
        };

        return {
            configure, isConfigured, ensureScripts,
            connect: (options = {}) => {
                const prompt = options.prompt !== undefined ? options.prompt : 'select_account consent';
                return requestToken(prompt).then(() => ensureScripts());
            },
            getAbout: async () => {
                return request('about', { params: { fields: 'user(displayName,emailAddress,photoLink),storageQuota' } });
            },
            createFolder: async (name, parentId) => {
                return request('files', {
                    method: 'POST',
                    params: { fields: 'id,name,webViewLink' },
                    body: { name, mimeType: DRIVE_FOLDER_MIME, parents: parentId ? [parentId] : undefined }
                });
            },
            getFolder: async (folderId) => {
                return request('files/' + encodeURIComponent(folderId), {
                    params: { fields: 'id,name,webViewLink,parents,trashed' }
                });
            },
            signIn:  () => getToken({ interactive: true }),
            hasToken: () => !!(token && token.expiresAt > Date.now()),
            disconnect: () => {
                if (token && window.google && window.google.accounts) {
                    try { window.google.accounts.oauth2.revoke(token.value, () => {}); } catch { /* best effort */ }
                }
                token = null;
            },
            getFile, canAccess, findFolder, ensureFolder, upload, move, pick, request
        };
    }

    /* Resolves <root>/<PRD-01 — name>/<المقترحات|النسخ المعتمدة>, creating
       folders as needed and caching the ids on the product row when the
       caller is allowed to write them. */
    async function resolveProductFolders(drive, api, product, rootFolderId) {
        if (!rootFolderId) throw new Error('لم يُحدَّد مجلد المشروع الجذري في إعدادات النظام.');

        let productFolderId = product.drive_folder_id;
        if (!productFolderId || !(await drive.canAccess(productFolderId))) {
            productFolderId = await drive.ensureFolder(`${product.code} — ${product.name}`.slice(0, 120), rootFolderId);
        }

        const proposals = await drive.ensureFolder(FOLDER_LABELS.proposals, productFolderId);
        const approved  = await drive.ensureFolder(FOLDER_LABELS.approved,  productFolderId);

        const patch = {
            drive_folder_id: productFolderId,
            drive_proposals_folder_id: proposals,
            drive_approved_folder_id: approved
        };
        const changed = Object.keys(patch).some(key => product[key] !== patch[key]);
        if (changed) {
            // Only admins and supervisors may write these. A regular uploader
            // still gets working folder ids for this operation; the ids are
            // simply not cached until someone with rights touches the product.
            try { await api.products.update(product.id, patch, product.updated_at); } catch { /* not permitted or stale: ignore */ }
        }
        return { productFolderId, proposals, approved };
    }

    /* ---------------------------------------------------------------
       6. UI primitives
       --------------------------------------------------------------- */

    class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { error: null }; }
        static getDerivedStateFromError(error) { return { error }; }
        componentDidCatch(error, info) { console.error('Unhandled UI error:', error, info); }
        render() {
            if (!this.state.error) return this.props.children;
            return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="max-w-lg w-full bg-slate-900 border border-rose-500/40 rounded-2xl p-6 space-y-4 text-center">
                        <i className="fa-solid fa-triangle-exclamation text-3xl text-rose-400"></i>
                        <h1 className="text-lg font-bold text-white">حدث خطأ غير متوقع في الواجهة</h1>
                        <p className="text-sm text-slate-400">
                            لم تُفقد أي بيانات؛ جميع السجلات محفوظة على الخادم. أعد تحميل الصفحة للمتابعة.
                        </p>
                        <pre className="text-start text-[11px] text-rose-300 bg-slate-950 border border-slate-800 rounded-xl p-3 overflow-x-auto">
                            {String(this.state.error && this.state.error.message)}
                        </pre>
                        <button onClick={() => window.location.reload()}
                                className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold">
                            إعادة تحميل
                        </button>
                    </div>
                </div>
            );
        }
    }

    const ToastContext = createContext(() => {});
    const useToast = () => useContext(ToastContext);

    function ToastHost({ toasts, dismiss }) {
        return (
            <div className="fixed bottom-4 start-4 z-[100] space-y-2 no-print" aria-live="polite" aria-atomic="false">
                {toasts.map(t => (
                    <div key={t.id} role="status"
                         className={cx('flex items-start gap-3 px-4 py-3 rounded-xl border shadow-2xl max-w-sm text-sm',
                             t.tone === 'error'   ? 'bg-rose-950 border-rose-500/50 text-rose-100'
                           : t.tone === 'success' ? 'bg-emerald-950 border-emerald-500/50 text-emerald-100'
                                                  : 'bg-slate-900 border-slate-700 text-slate-100')}>
                        <i className={cx('fa-solid mt-0.5',
                            t.tone === 'error' ? 'fa-circle-exclamation' : t.tone === 'success' ? 'fa-circle-check' : 'fa-circle-info')}></i>
                        <span className="flex-1">{t.message}</span>
                        <button onClick={() => dismiss(t.id)} className="text-current/60 hover:text-current" aria-label="إغلاق التنبيه">
                            <i className="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                ))}
            </div>
        );
    }

    /* Accessible dialog: labelled, Escape-dismissable, focus-trapped, and it
       restores focus to whatever opened it. */
    function Modal({ open, title, subtitle, onClose, children, footer, size = 'md' }) {
        const panelRef = useRef(null);
        const returnFocusRef = useRef(null);
        const titleId = useRef('dlg-' + Math.random().toString(36).slice(2)).current;

        useEffect(() => {
            if (!open) return undefined;
            returnFocusRef.current = document.activeElement;

            const selector = 'a[href],button:not([disabled]),textarea:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])';
            const focusables = () => Array.from(panelRef.current ? panelRef.current.querySelectorAll(selector) : []);

            const first = focusables()[0];
            if (first) first.focus();

            const onKeyDown = (event) => {
                if (event.key === 'Escape') { event.preventDefault(); onClose(); return; }
                if (event.key !== 'Tab') return;
                const items = focusables();
                if (!items.length) return;
                const index = items.indexOf(document.activeElement);
                if (event.shiftKey && index <= 0) { event.preventDefault(); items[items.length - 1].focus(); }
                else if (!event.shiftKey && index === items.length - 1) { event.preventDefault(); items[0].focus(); }
            };

            document.addEventListener('keydown', onKeyDown);
            const previousOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';

            return () => {
                document.removeEventListener('keydown', onKeyDown);
                document.body.style.overflow = previousOverflow;
                const target = returnFocusRef.current;
                if (target && typeof target.focus === 'function') target.focus();
            };
        }, [open, onClose]);

        if (!open) return null;
        const widths = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl', xl: 'max-w-4xl' };

        return (
            <div className="fixed inset-0 z-[90] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 no-print"
                 onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                <div ref={panelRef} role="dialog" aria-modal="true" aria-labelledby={titleId}
                     className={cx('bg-slate-900 border border-slate-700 rounded-2xl w-full shadow-2xl flex flex-col max-h-[90vh]', widths[size])}>
                    <div className="flex justify-between items-start gap-4 border-b border-slate-800 p-5">
                        <div>
                            <h2 id={titleId} className="text-base font-bold text-white">{title}</h2>
                            {subtitle && <p className="text-xs text-slate-400 mt-1">{subtitle}</p>}
                        </div>
                        <button onClick={onClose} aria-label="إغلاق النافذة"
                                className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg shrink-0">
                            <i className="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div className="p-5 space-y-4 overflow-y-auto">{children}</div>
                    {footer && <div className="border-t border-slate-800 p-4 flex justify-end gap-2">{footer}</div>}
                </div>
            </div>
        );
    }

    function ConfirmDialog({ state, onCancel }) {
        if (!state) return null;
        const danger = state.tone === 'danger';
        return (
            <Modal open title={state.title} subtitle={state.description} onClose={onCancel} size="sm"
                   footer={
                       <React.Fragment>
                           <button onClick={onCancel} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">
                               إلغاء
                           </button>
                           <button onClick={state.onConfirm}
                                   className={cx('px-4 py-2 text-white rounded-xl text-sm font-bold',
                                       danger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-blue-600 hover:bg-blue-500')}>
                               {state.confirmLabel || 'تأكيد'}
                           </button>
                       </React.Fragment>
                   }>
                <p className="text-sm text-slate-300">{state.body}</p>
            </Modal>
        );
    }

    const Chip = ({ className, children, title }) => (
        <span title={title} className={cx('inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold border border-transparent whitespace-nowrap', className)}>
            {children}
        </span>
    );

    const OrgChip = ({ code }) => { const o = org(code); return <Chip className={o.chip}>{o.label}</Chip>; };

    function ProgressBar({ value, className, tone = 'bg-blue-500', label }) {
        const safe = Math.max(0, Math.min(100, Math.round(value || 0)));
        return (
            <div className={cx('w-full bg-slate-950 rounded-full overflow-hidden h-2', className)}
                 role="progressbar" aria-valuenow={safe} aria-valuemin="0" aria-valuemax="100"
                 aria-label={label || 'نسبة الإنجاز'}>
                <div className={cx('h-full rounded-full transition-[width] duration-500', tone)} style={{ width: safe + '%' }}></div>
            </div>
        );
    }

    const WamyLogo = ({ className = 'w-10 h-10' }) => (
        <span className={cx('bg-white rounded-xl flex items-center justify-center text-[#0080ff] shrink-0 font-black shadow-md shadow-blue-900/20 border border-slate-100 select-none overflow-hidden p-1', className)} aria-hidden="true">
            <svg viewBox="17 23 64 54" className="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                {/* Left Stroke */}
                <path d="M19 25.5 H28 C33 25.5 36.5 28.5 38.5 34 L49.5 68 C51 72.5 48 75 43.5 75 H34 C29.5 75 26.5 71.5 25 66.5 L19 25.5 Z" fill="currentColor" />
                {/* Middle Stroke */}
                <path d="M39 25.5 H48 C53 25.5 56.5 28.5 58.5 34 L62.5 50 L62.2 75 H50.5 C46.5 75 44 71.5 42.5 66.5 L39 25.5 Z" fill="currentColor" />
                {/* Right Wing Stroke */}
                <path d="M66.5 25.5 H76 C78.5 25.5 80 27 79 30 L74 45 C73 48 70 49.5 66.5 49.5 H61 L66.5 25.5 Z" fill="currentColor" />
            </svg>
        </span>
    );

    const Avatar = ({ name, size = 'w-9 h-9', className }) => (
        <span className={cx('inline-flex items-center justify-center rounded-full bg-slate-800 border border-slate-700 text-slate-200 font-bold shrink-0',
                            size, className)} aria-hidden="true">
            {initials(name)}
        </span>
    );

    const EmptyState = ({ icon = 'fa-inbox', title, hint, action }) => (
        <div className="text-center py-14 px-6">
            <i className={cx('fa-solid text-3xl text-slate-600 mb-3 block', icon)}></i>
            <p className="text-sm font-bold text-slate-300">{title}</p>
            {hint && <p className="text-xs text-slate-500 mt-1 max-w-md mx-auto">{hint}</p>}
            {action && <div className="mt-4">{action}</div>}
        </div>
    );

    const Spinner = ({ label = 'جارٍ التحميل…' }) => (
        <div className="flex items-center justify-center gap-3 py-16 text-slate-400 text-sm">
            <i className="fa-solid fa-circle-notch fa-spin"></i><span>{label}</span>
        </div>
    );

    const Field = ({ label, hint, children, required }) => (
        <label className="block">
            <span className="block text-slate-300 font-bold mb-1.5 text-sm">
                {label}{required && <span className="text-rose-400"> *</span>}
            </span>
            {children}
            {hint && <span className="block text-xs text-slate-500 mt-1">{hint}</span>}
        </label>
    );

    const inputClass = 'w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:border-blue-500 focus:outline-none placeholder:text-slate-600';

    function normalizeArabic(text) {
        if (!text) return '';
        return String(text)
            .toLowerCase()
            .replace(/[أإآ]/g, 'ا')
            .replace(/[ة]/g, 'ه')
            .replace(/[ى]/g, 'ي')
            .replace(/[\u064B-\u065F]/g, '');
    }

    function SearchableSelect({
        label,
        required,
        hint,
        value,
        onChange,
        options = [],
        placeholder = '— اختر من القائمة —',
        emptyMessage = 'لا توجد نتائج مطابقة',
        allowCustom = false,
        clearable = false,
        allOptionLabel = null,
        disabled = false,
        className = ''
    }) {
        const [isOpen, setIsOpen] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [highlightedIndex, setHighlightedIndex] = useState(-1);
        const containerRef = useRef(null);
        const searchInputRef = useRef(null);
        const listRef = useRef(null);

        useEffect(() => {
            if (!isOpen) {
                setSearchTerm('');
                setHighlightedIndex(-1);
                return;
            }

            const handlePointerDown = (e) => {
                if (containerRef.current && !containerRef.current.contains(e.target)) {
                    setIsOpen(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    setIsOpen(false);
                }
            };

            document.addEventListener('mousedown', handlePointerDown);
            document.addEventListener('touchstart', handlePointerDown);
            document.addEventListener('keydown', handleKeyDown);

            const timer = setTimeout(() => {
                if (searchInputRef.current) {
                    searchInputRef.current.focus();
                }
            }, 50);

            return () => {
                document.removeEventListener('mousedown', handlePointerDown);
                document.removeEventListener('touchstart', handlePointerDown);
                document.removeEventListener('keydown', handleKeyDown);
                clearTimeout(timer);
            };
        }, [isOpen]);

        const selectedOption = useMemo(() => {
            if (value === undefined || value === null || value === '') return null;
            return options.find(opt => opt.value === value || String(opt.value) === String(value)) || null;
        }, [options, value]);

        const filteredOptions = useMemo(() => {
            if (!searchTerm.trim()) return options;
            const normQuery = normalizeArabic(searchTerm.trim());
            return options.filter(opt => {
                const labelMatch = normalizeArabic(opt.label).includes(normQuery);
                const codeMatch = opt.code && normalizeArabic(opt.code).includes(normQuery);
                const badgeMatch = opt.badge && normalizeArabic(opt.badge).includes(normQuery);
                const subMatch = opt.subtitle && normalizeArabic(opt.subtitle).includes(normQuery);
                const trackMatch = opt.track && normalizeArabic(opt.track).includes(normQuery);
                const phaseMatch = opt.phase && normalizeArabic(opt.phase).includes(normQuery);
                return labelMatch || codeMatch || badgeMatch || subMatch || trackMatch || phaseMatch;
            });
        }, [options, searchTerm]);

        const handleSelect = (val) => {
            onChange(val);
            setIsOpen(false);
            setSearchTerm('');
        };

        const handleClear = (e) => {
            e.stopPropagation();
            onChange('');
            setSearchTerm('');
        };

        const handleKeyDownInTrigger = (e) => {
            if (disabled) return;
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
                e.preventDefault();
                setIsOpen(true);
            }
        };

        const handleSearchKeyDown = (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                setHighlightedIndex(prev => (prev < filteredOptions.length - 1 ? prev + 1 : 0));
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                setHighlightedIndex(prev => (prev > 0 ? prev - 1 : filteredOptions.length - 1));
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightedIndex >= 0 && highlightedIndex < filteredOptions.length) {
                    handleSelect(filteredOptions[highlightedIndex].value);
                } else if (allowCustom && searchTerm.trim()) {
                    handleSelect(searchTerm.trim());
                } else if (filteredOptions.length === 1) {
                    handleSelect(filteredOptions[0].value);
                }
            }
        };

        useEffect(() => {
            if (highlightedIndex >= 0 && listRef.current) {
                const items = listRef.current.querySelectorAll('[data-option-index]');
                if (items[highlightedIndex]) {
                    items[highlightedIndex].scrollIntoView({ block: 'nearest' });
                }
            }
        }, [highlightedIndex]);

        const displayText = selectedOption
            ? selectedOption.label
            : (allowCustom && value ? value : '');

        const displayCode = selectedOption ? (selectedOption.badge || selectedOption.code) : null;
        const showAllOption = allOptionLabel && !searchTerm.trim();

        return (
            <div className={cx('block w-full', className)}>
                {label && (
                    <label className="block text-slate-300 font-bold mb-1.5 text-sm">
                        {label}{required && <span className="text-rose-400"> *</span>}
                    </label>
                )}

                <div ref={containerRef} className="relative w-full">
                    <div
                        tabIndex={disabled ? -1 : 0}
                        role="combobox"
                        aria-expanded={isOpen}
                        aria-haspopup="listbox"
                        aria-disabled={disabled}
                        onClick={() => { if (!disabled) setIsOpen(prev => !prev); }}
                        onKeyDown={handleKeyDownInTrigger}
                        className={cx(
                            'w-full bg-slate-950 border rounded-xl px-3.5 py-2.5 text-sm flex items-center justify-between gap-2 text-right transition-all cursor-pointer select-none min-h-[42px]',
                            disabled ? 'opacity-50 cursor-not-allowed border-slate-800 bg-slate-900/50' : 'hover:border-slate-600',
                            isOpen ? 'border-blue-500 ring-2 ring-blue-500/20 shadow-lg' : (value ? 'border-slate-600' : 'border-slate-700')
                        )}
                    >
                        <div className="flex items-center gap-2 flex-1 min-w-0 overflow-hidden">
                            {displayCode && (
                                <span className="font-mono text-xs px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-500/30 shrink-0">
                                    {displayCode}
                                </span>
                            )}
                            {displayText ? (
                                <span className="text-white truncate font-medium">{displayText}</span>
                            ) : (
                                <span className="text-slate-500 truncate">{placeholder}</span>
                            )}
                        </div>

                        <div className="flex items-center gap-1.5 shrink-0 text-slate-400">
                            {clearable && value && !disabled && (
                                <button
                                    type="button"
                                    onClick={handleClear}
                                    title="إلغاء الاختيار"
                                    aria-label="إلغاء الاختيار"
                                    className="p-1 hover:text-rose-400 rounded transition-colors"
                                >
                                    <i className="fa-solid fa-xmark text-xs"></i>
                                </button>
                            )}
                            <i className={cx('fa-solid text-xs transition-transform duration-200', isOpen ? 'fa-chevron-up text-blue-400' : 'fa-chevron-down')}></i>
                        </div>
                    </div>

                    {isOpen && (
                        <div
                            className="absolute top-full right-0 left-0 mt-1.5 z-[100] bg-slate-900 border border-slate-700 rounded-xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150"
                            style={{ minWidth: '100%' }}
                            onMouseDown={(e) => e.stopPropagation()}
                        >
                            <div className="p-2 border-b border-slate-800 bg-slate-950/80 flex items-center gap-2">
                                <div className="relative flex-1">
                                    <i className="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none"></i>
                                    <input
                                        ref={searchInputRef}
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => {
                                            setSearchTerm(e.target.value);
                                            setHighlightedIndex(0);
                                        }}
                                        onKeyDown={handleSearchKeyDown}
                                        placeholder={allowCustom ? 'ابحث أو اكتب قيمة جديدة...' : 'ابحث بالاسم...'}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg pr-8 pl-3 py-1.5 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-blue-500"
                                    />
                                    {searchTerm && (
                                        <button
                                            type="button"
                                            onClick={() => setSearchTerm('')}
                                            className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs"
                                        >
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    )}
                                </div>
                                <span className="text-[10px] text-slate-400 bg-slate-800 px-2 py-1 rounded font-mono shrink-0">
                                    {filteredOptions.length}
                                </span>
                            </div>

                            {allowCustom && searchTerm.trim() && !options.some(o => o.value === searchTerm.trim() || o.label === searchTerm.trim()) && (
                                <div className="p-2 bg-blue-950/40 border-b border-blue-500/20">
                                    <button
                                        type="button"
                                        onClick={() => handleSelect(searchTerm.trim())}
                                        className="w-full text-right px-3 py-2 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-300 rounded-lg text-xs font-semibold flex items-center justify-between transition-colors"
                                    >
                                        <span className="truncate">استخدام القيمة المدخلة: &quot;{searchTerm.trim()}&quot;</span>
                                        <i className="fa-solid fa-arrow-left text-xs shrink-0 mr-2"></i>
                                    </button>
                                </div>
                            )}

                            <div
                                ref={listRef}
                                role="listbox"
                                className="max-h-60 overflow-y-auto divide-y divide-slate-800/60 overscroll-contain"
                                onWheel={(e) => e.stopPropagation()}
                                onTouchMove={(e) => e.stopPropagation()}
                            >
                                {showAllOption && (
                                    <div
                                        role="option"
                                        aria-selected={!value}
                                        onClick={() => handleSelect('')}
                                        className={cx(
                                            'px-3.5 py-2.5 text-xs text-right cursor-pointer flex items-center justify-between transition-colors',
                                            !value ? 'bg-blue-950/60 text-blue-300 font-bold border-r-4 border-blue-500' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'
                                        )}
                                    >
                                        <span>{allOptionLabel}</span>
                                        {!value && <i className="fa-solid fa-check text-blue-400 text-xs"></i>}
                                    </div>
                                )}

                                {filteredOptions.length === 0 ? (
                                    <div className="py-6 px-4 text-center text-slate-500 text-xs">
                                        <i className="fa-solid fa-filter-circle-xmark text-lg mb-1.5 block opacity-40"></i>
                                        {emptyMessage}
                                    </div>
                                ) : (
                                    filteredOptions.map((opt, idx) => {
                                        const isSelected = value !== undefined && value !== null && value !== '' && (opt.value === value || String(opt.value) === String(value));
                                        const isHighlighted = highlightedIndex === idx;

                                        return (
                                            <div
                                                key={opt.value || idx}
                                                data-option-index={idx}
                                                role="option"
                                                aria-selected={isSelected}
                                                onClick={() => !opt.disabled && handleSelect(opt.value)}
                                                onMouseEnter={() => setHighlightedIndex(idx)}
                                                className={cx(
                                                    'px-3.5 py-2.5 text-right cursor-pointer transition-colors flex items-start justify-between gap-2.5',
                                                    opt.disabled ? 'opacity-40 cursor-not-allowed bg-slate-950/50' : '',
                                                    isSelected
                                                        ? 'bg-blue-950/60 text-blue-200 font-bold border-r-4 border-blue-500'
                                                        : (isHighlighted ? 'bg-slate-800 text-white' : 'text-slate-200 hover:bg-slate-800/80')
                                                )}
                                            >
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        {(opt.badge || opt.code) && (
                                                            <span className={cx(
                                                                'font-mono text-[11px] px-1.5 py-0.5 rounded border shrink-0',
                                                                isSelected ? 'bg-blue-900/60 text-blue-300 border-blue-400/40' : 'bg-slate-800 text-slate-300 border-slate-700'
                                                            )}>
                                                                {opt.badge || opt.code}
                                                            </span>
                                                        )}
                                                        <span className={cx('text-xs font-semibold', isSelected ? 'text-blue-300' : 'text-slate-100')}>
                                                            {opt.label}
                                                        </span>
                                                    </div>

                                                    {opt.subtitle && (
                                                        <p className="text-[11px] text-slate-400 mt-1 line-clamp-2 leading-relaxed">
                                                            {opt.subtitle}
                                                        </p>
                                                    )}

                                                    {(opt.meta || opt.track || opt.phase) && (
                                                        <div className="flex flex-wrap items-center gap-2 mt-1.5 text-[10px] text-slate-500">
                                                            {opt.track && <span className="bg-slate-800 px-1.5 py-0.5 rounded text-slate-400">المسار: {opt.track}</span>}
                                                            {opt.phase && <span className="bg-slate-800 px-1.5 py-0.5 rounded text-slate-400">المرحلة: {opt.phase}</span>}
                                                            {opt.meta && <span className="text-slate-400">{opt.meta}</span>}
                                                        </div>
                                                    )}
                                                </div>

                                                {isSelected && (
                                                    <i className="fa-solid fa-check text-blue-400 text-xs shrink-0 mt-1"></i>
                                                )}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    )}
                </div>

                {hint && <span className="block text-xs text-slate-500 mt-1">{hint}</span>}
            </div>
        );
    }


    const SectionHeading = ({ icon, title, description, children }) => (
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h2 className="text-lg font-bold text-white flex items-center gap-2.5">
                    {icon && <i className={cx('fa-solid text-blue-400', icon)}></i>}
