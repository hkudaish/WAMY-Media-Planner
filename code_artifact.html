                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {filtered.map(proj => {
                                        const pTasks = safeTasks.filter(t => t.project_id === proj.id);
                                        const pProducts = safeProducts.filter(p => p.project_id === proj.id);
                                        const pPlans = safePlanItems.filter(p => p.project_id === proj.id);
                                        const plansCount = proj.plans_count !== undefined ? Number(proj.plans_count) : pPlans.length;
                                        const productsCount = proj.products_count !== undefined ? Number(proj.products_count) : pProducts.length;
                                        const phasesCount = proj.phases_count !== undefined ? Number(proj.phases_count) : 0;
                                        const tasksCount = proj.tasks_count !== undefined ? Number(proj.tasks_count) : pTasks.length;
                                        const completedTasks = pTasks.filter(isTaskDone).length;
                                        const calcProgress = tasksCount > 0 ? Math.round(completedTasks / tasksCount * 100) : (proj.progress ? Number(proj.progress) : 0);
                                        const isAct = proj.status === 'active';
                                        const isBusy = busyId === proj.id;

                                        return (
                                            <tr key={proj.id} className="hover:bg-slate-800/40 transition-colors">
                                                <td className="p-3.5 max-w-xs">
                                                    <strong className="block text-white truncate">{proj.name}</strong>
                                                    {proj.description && <span className="block text-slate-400 text-[11px] truncate mt-0.5">{proj.description}</span>}
                                                </td>
                                                <td className="p-3.5 whitespace-nowrap">
                                                    <OrgChip code={proj.org} />
                                                </td>
                                                <td className="p-3.5 text-slate-300 whitespace-nowrap">
                                                    {proj.manager_name || (byId(data.profiles, proj.manager_id) ? byId(data.profiles, proj.manager_id).name : '—')}
                                                </td>
                                                <td className="p-3.5 font-mono text-slate-400 whitespace-nowrap" dir="ltr">
                                                    {proj.planned_start ? proj.planned_start.slice(0, 10) : '—'} → {proj.planned_end ? proj.planned_end.slice(0, 10) : '—'}
                                                </td>
                                                <td className="p-3.5 text-center font-bold text-cyan-400 tabular-nums">{plansCount}</td>
                                                <td className="p-3.5 text-center font-bold text-blue-400 tabular-nums">{productsCount}</td>
                                                <td className="p-3.5 text-center font-bold text-indigo-400 tabular-nums">{phasesCount}</td>
                                                <td className="p-3.5 text-center font-bold text-amber-400 tabular-nums">{tasksCount}</td>
                                                <td className="p-3.5 text-center">
                                                    <div className="inline-flex items-center gap-1.5 font-bold text-emerald-400 tabular-nums">
                                                        <span>{calcProgress}%</span>
                                                        <div className="w-12 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                                            <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${Math.min(100, calcProgress)}%` }}></div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="p-3.5 text-center whitespace-nowrap">
                                                    <div className="inline-flex flex-col items-center gap-1">
                                                        <span className={cx('px-2 py-0.5 rounded text-[10px] font-bold border',
                                                            proj.status === 'active' ? 'bg-emerald-950 text-emerald-300 border-emerald-500/30' :
                                                            proj.status === 'planning' ? 'bg-blue-950 text-blue-300 border-blue-500/30' :
                                                            proj.status === 'completed' ? 'bg-purple-950 text-purple-300 border-purple-500/30' :
                                                            proj.status === 'disabled' ? 'bg-slate-800 text-slate-400 border-slate-700' :
                                                            proj.status === 'on_hold' ? 'bg-amber-950 text-amber-300 border-amber-500/30' :
                                                            proj.status === 'cancelled' ? 'bg-rose-950 text-rose-300 border-rose-500/30' :
                                                            'bg-slate-800 text-slate-300 border-slate-700')}>
                                                            {proj.status === 'active' ? 'نشط' : proj.status === 'planning' ? 'تخطيط' : proj.status === 'completed' ? 'مكتمل' : proj.status === 'disabled' ? 'معطل' : proj.status === 'on_hold' ? 'معلق' : proj.status === 'cancelled' ? 'ملغى / مؤرشف' : proj.status}
                                                        </span>
                                                        <button type="button" onClick={() => toggleActivation(proj)} disabled={isBusy}
                                                                title={isAct ? 'تعطيل المشروع وإخفائه من القوائم النشطة' : 'تفعيل المشروع وإتاحته في فلتر النظام'}
                                                                className={cx('px-2 py-0.5 rounded text-[10px] font-bold flex items-center gap-1 transition-colors border',
                                                                    isAct
                                                                        ? 'bg-amber-950/40 text-amber-300 border-amber-500/30 hover:bg-amber-900/60'
                                                                        : 'bg-emerald-950/40 text-emerald-300 border-emerald-500/30 hover:bg-emerald-900/60')}>
                                                            {isBusy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className={cx('fa-solid', isAct ? 'fa-pause' : 'fa-play')}></i>}
                                                            <span>{isAct ? 'تعطيل' : 'تفعيل'}</span>
                                                        </button>
                                                    </div>
                                                </td>
                                                <td className="p-3.5 text-center whitespace-nowrap">
                                                    <div className="inline-flex items-center gap-1">
                                                        <button type="button" onClick={() => onEditProject(proj)}
                                                                title="تعديل بيانات المشروع"
                                                                className="w-7 h-7 bg-slate-800 hover:bg-blue-600 text-slate-300 hover:text-white rounded-lg flex items-center justify-center transition-colors">
                                                            <i className="fa-solid fa-pen-to-square"></i>
                                                        </button>
                                                        <button type="button" onClick={() => onSafeDeleteProject(proj)}
                                                                title="حذف أو أرشفة المشروع"
                                                                className="w-7 h-7 bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white rounded-lg flex items-center justify-center transition-colors">
                                                            <i className="fa-solid fa-trash-can"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    function BackupManagementSection({ api, toast, refresh }) {
        const [backups, setBackups] = useState([]);
        const [loading, setLoading] = useState(true);
        const [busy, setBusy] = useState(false);
        const [createModalOpen, setCreateModalOpen] = useState(false);
        const [backupType, setBackupType] = useState('FULL');
        const [backupNotes, setBackupNotes] = useState('');
        const [restoreTarget, setRestoreTarget] = useState(null);
        const [deleteTarget, setDeleteTarget] = useState(null);

        const fetchBackups = useCallback(async () => {
            setLoading(true);
            try {
                const list = await api.backups.list();
                setBackups(Array.isArray(list) ? list : []);
            } catch (err) {
                toast(err.message || 'تعذر جلب قائمة النسخ الاحتياطية', 'error');
            } finally {
                setLoading(false);
            }
        }, [api, toast]);

        useEffect(() => {
            fetchBackups();
        }, [fetchBackups]);

        const handleCreate = async (e) => {
            e.preventDefault();
            setBusy(true);
            try {
                const res = await api.backups.create({ type: backupType, notes: backupNotes });
                toast(`تم إنشاء النسخة الاحتياطية بنجاح (${res.sizeFormatted})`, 'success');
                setCreateModalOpen(false);
                setBackupNotes('');
                await fetchBackups();
            } catch (err) {
                toast(err.message || 'فشل إنشاء النسخة الاحتياطية', 'error');
            } finally {
                setBusy(false);
            }
        };

        const handleRestore = async () => {
            if (!restoreTarget) return;
            setBusy(true);
            try {
                await api.backups.restore(restoreTarget.id);
                toast('تمت استعادة قاعدة البيانات بنجاح من النسخة الاحتياطية.', 'success');
                setRestoreTarget(null);
                if (refresh) await refresh();
                await fetchBackups();
            } catch (err) {
                toast(err.message || 'فشلت عملية الاستعادة', 'error');
            } finally {
                setBusy(false);
            }
        };

        const handleDelete = async () => {
            if (!deleteTarget) return;
            setBusy(true);
            try {
                await api.backups.remove(deleteTarget.id);
                toast('تم حذف النسخة الاحتياطية بنجاح.', 'info');
                setDeleteTarget(null);
                await fetchBackups();
            } catch (err) {
                toast(err.message || 'تعذر حذف النسخة الاحتياطية', 'error');
            } finally {
                setBusy(false);
            }
        };

        return (
            <div className="space-y-5">
                <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                    <div className="space-y-1">
                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                            <i className="fa-solid fa-database text-emerald-400"></i>
                            إدارة النسخ الاحتياطية واستعادة النظام
                        </h3>
                        <p className="text-xs text-slate-400">
                            توليد لقطات آمنة لقاعدة البيانات، التحقق من بصمة SHA-256، والاستعادة الذرية عبر المعاملات.
                        </p>
                    </div>

                    <div className="flex items-center gap-2">
                        <button type="button" onClick={fetchBackups} disabled={loading}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors">
                            <i className={cx('fa-solid fa-arrows-rotate', loading && 'fa-spin')}></i>
                            تحديث
                        </button>
                        <button type="button" onClick={() => setCreateModalOpen(true)}
                                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md shadow-emerald-600/20 transition-colors">
                            <i className="fa-solid fa-cloud-arrow-down"></i>
                            إنشاء نسخة احتياطية فورية
                        </button>
                    </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">النسخ المتوفرة</span>
                        <strong className="text-xl font-bold text-white">{backups.length}</strong>
                    </div>
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">آخر نسخة تم إنشاؤها</span>
                        <strong className="text-sm font-bold text-emerald-400 block truncate">
                            {backups[0] ? formatDateTime(backups[0].createdAt) : 'لا يوجد'}
                        </strong>
                    </div>
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">نوع أحدث نسخة</span>
                        <strong className="text-sm font-bold text-cyan-400 block truncate">
                            {backups[0] ? (backups[0].type === 'FULL' ? 'شاملة للنظام' : backups[0].type === 'PRE_RESET' ? 'تلقائية قبل التهيئة' : 'مشاريع فقط') : '—'}
                        </strong>
                    </div>
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">سلامة البيانات المشفرة</span>
                        <strong className="text-sm font-bold text-purple-400 block">SHA-256 معتمد</strong>
                    </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md">
                    {loading ? (
                        <div className="py-12 text-center text-slate-400">
                            <i className="fa-solid fa-circle-notch fa-spin text-2xl text-blue-400 mb-2"></i>
                            <p>جارٍ تحميل ملفات النسخ الاحتياطي...</p>
                        </div>
                    ) : backups.length === 0 ? (
                        <div className="py-12 text-center text-slate-400">
                            <i className="fa-solid fa-box-archive text-3xl mb-2 text-slate-600"></i>
                            <p className="font-bold text-slate-300">لا توجد أي نسخ احتياطية مسجلة حتى الآن</p>
                            <p className="text-xs text-slate-500 mt-1">اضغط على زر «إنشاء نسخة احتياطية فورية» لحفظ لقطة من النظام.</p>
                        </div>
                    ) : (
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs min-w-[62rem]">
                                <thead>
                                    <tr className="border-b border-slate-800 text-slate-400 bg-slate-950/60 text-start">
                                        <th className="p-3.5">معرف النسخة / التاريخ</th>
                                        <th className="p-3.5 text-center">النوع</th>
                                        <th className="p-3.5">الملاحظات</th>
                                        <th className="p-3.5 text-center">الحجم</th>
                                        <th className="p-3.5 text-center">إجمالي السجلات</th>
                                        <th className="p-3.5">بصمة التشفير (SHA-256)</th>
                                        <th className="p-3.5 text-center">الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {backups.map(b => (
                                        <tr key={b.id} className="hover:bg-slate-800/40 transition-colors">
                                            <td className="p-3.5">
                                                <strong className="block text-white font-mono">{b.id}</strong>
                                                <span className="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5">
                                                    <i className="fa-solid fa-calendar-day text-slate-500"></i>
                                                    {formatDateTime(b.createdAt)} · {b.createdBy?.name || 'النظام'}
                                                </span>
                                            </td>
                                            <td className="p-3.5 text-center whitespace-nowrap">
                                                <span className={cx('px-2 py-0.5 rounded text-[10px] font-bold border',
                                                    b.type === 'FULL' ? 'bg-emerald-950 text-emerald-300 border-emerald-500/30' :
                                                    b.type === 'PRE_RESET' ? 'bg-amber-950 text-amber-300 border-amber-500/30' :
                                                    'bg-blue-950 text-blue-300 border-blue-500/30')}>
                                                    {b.type === 'FULL' ? 'نسخة شاملة' : b.type === 'PRE_RESET' ? 'قبل التهيئة' : 'مشاريع فقط'}
                                                </span>
                                            </td>
                                            <td className="p-3.5 max-w-xs">
                                                <span className="text-slate-300 block truncate">{b.notes || '—'}</span>
                                            </td>
                                            <td className="p-3.5 text-center font-mono text-cyan-400 font-bold whitespace-nowrap">
                                                {b.sizeFormatted || `${Math.round(b.size / 1024)} KB`}
                                            </td>
                                            <td className="p-3.5 text-center font-bold text-white tabular-nums whitespace-nowrap">
                                                {b.totalRecords}
                                            </td>
                                            <td className="p-3.5 font-mono text-[11px] text-slate-400 whitespace-nowrap">
                                                <span title={b.checksum} className="cursor-pointer hover:text-white" onClick={() => {
                                                    navigator.clipboard.writeText(b.checksum);
                                                    toast('تم نسخ بصمة SHA-256 للحافظة', 'info');
                                                }}>
                                                    {b.checksum ? `${b.checksum.slice(0, 16)}...` : '—'} <i className="fa-regular fa-copy ms-1 text-[10px]"></i>
                                                </span>
                                            </td>
                                            <td className="p-3.5 text-center whitespace-nowrap">
                                                <div className="inline-flex items-center gap-1.5">
                                                    <a href={api.backups.downloadUrl(b.id)} download
                                                       title="تحميل ملف النسخة الاحتياطية"
                                                       className="w-7 h-7 bg-slate-800 hover:bg-emerald-600 text-slate-300 hover:text-white rounded-lg flex items-center justify-center transition-colors">
                                                        <i className="fa-solid fa-download"></i>
                                                    </a>
                                                    <button type="button" onClick={() => setRestoreTarget(b)}
                                                            title="استعادة النظام من هذه النسخة"
                                                            className="w-7 h-7 bg-slate-800 hover:bg-amber-600 text-slate-300 hover:text-white rounded-lg flex items-center justify-center transition-colors">
                                                        <i className="fa-solid fa-rotate-left"></i>
                                                    </button>
                                                    <button type="button" onClick={() => setDeleteTarget(b)}
                                                            title="حذف النسخة الاحتياطية"
                                                            className="w-7 h-7 bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white rounded-lg flex items-center justify-center transition-colors">
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>

                {createModalOpen && (
                    <Modal open={createModalOpen} onClose={() => setCreateModalOpen(false)} size="md"
                           title="إنشاء نسخة احتياطية جديدة"
                           subtitle="حفظ لقطة متكاملة من قاعدة البيانات على الخادم مع بصمة أمان SHA-256"
                           footer={
                               <React.Fragment>
                                   <button type="button" onClick={() => setCreateModalOpen(false)} disabled={busy}
                                           className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                                   <button type="submit" form="create-backup-form" disabled={busy}
                                           className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white rounded-xl text-sm font-bold flex items-center gap-2">
                                       {busy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-cloud-arrow-down"></i>}
                                       بدء النسخ الاحتياطي
                                   </button>
                               </React.Fragment>
                           }>
                        <form id="create-backup-form" onSubmit={handleCreate} className="space-y-4">
                            <Field label="نوع النسخة الاحتياطية" required>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                    <label className={cx('p-3 rounded-xl border cursor-pointer flex items-start gap-2.5 transition-colors',
                                        backupType === 'FULL' ? 'bg-emerald-950/40 border-emerald-500/50 text-white' : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700')}>
                                        <input type="radio" name="btype" value="FULL" checked={backupType === 'FULL'} onChange={() => setBackupType('FULL')} className="mt-0.5 accent-emerald-500" />
                                        <div>
                                            <strong className="block text-emerald-300">نسخة شاملة (موصى بها)</strong>
                                            <span className="text-[11px] text-slate-400">تتضمن المشاريع والخطط والمهام والملفات والمستخدمين والإعدادات</span>
                                        </div>
                                    </label>
                                    <label className={cx('p-3 rounded-xl border cursor-pointer flex items-start gap-2.5 transition-colors',
                                        backupType === 'PROJECTS_ONLY' ? 'bg-blue-950/40 border-blue-500/50 text-white' : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700')}>
                                        <input type="radio" name="btype" value="PROJECTS_ONLY" checked={backupType === 'PROJECTS_ONLY'} onChange={() => setBackupType('PROJECTS_ONLY')} className="mt-0.5 accent-blue-500" />
                                        <div>
                                            <strong className="block text-blue-300">هيكل المشاريع والمهام فقط</strong>
                                            <span className="text-[11px] text-slate-400">تتضمن المشاريع والخطط والمنتجات والمراحل والمهام والملفات</span>
                                        </div>
                                    </label>
                                </div>
                            </Field>

                            <Field label="ملاحظات أو وصف النسخة (اختياري)">
                                <textarea value={backupNotes} onChange={e => setBackupNotes(e.target.value)}
                                          placeholder="مثال: نسخة دورية قبل إطلاق الحملة الإعلامية..."
                                          className={cx(inputClass, 'h-20 resize-none text-xs')} maxLength={500} />
                            </Field>
                        </form>
                    </Modal>
                )}

                {restoreTarget && (
                    <Modal open={!!restoreTarget} onClose={() => setRestoreTarget(null)} size="md"
                           title="تأكيد استعادة النظام من النسخة الاحتياطية"
                           subtitle={`الملف: ${restoreTarget.id}`}
                           footer={
                               <React.Fragment>
                                   <button type="button" onClick={() => setRestoreTarget(null)} disabled={busy}
                                           className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                                   <button type="button" onClick={handleRestore} disabled={busy}
                                           className="px-5 py-2 bg-amber-600 hover:bg-amber-500 disabled:opacity-60 text-white rounded-xl text-sm font-bold flex items-center gap-2">
                                       {busy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-rotate-left"></i>}
                                       تأكيد الاستعادة واستبدال البيانات
                                   </button>
                               </React.Fragment>
                           }>
                        <div className="space-y-3">
                            <div className="p-4 bg-amber-950/40 border border-amber-500/40 rounded-xl text-amber-200 text-sm space-y-2">
                                <div className="flex items-center gap-2 font-bold text-amber-300">
                                    <i className="fa-solid fa-triangle-exclamation text-base"></i>
                                    <span>تحذير: هذه العملية ستستبدل البيانات الحالية في النظام</span>
                                </div>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    سيتم إفراغ جداول هيكل المشاريع واستعادة بيانات النسخة المحددة ({restoreTarget.createdAt ? formatDateTime(restoreTarget.createdAt) : ''}).
                                    تتم العملية بشكل ذري Transactional كامل.
                                </p>
                            </div>
                            <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs space-y-1">
                                <p><span className="text-slate-500">حجم النسخة:</span> <strong className="text-cyan-400 font-mono">{restoreTarget.sizeFormatted}</strong></p>
                                <p><span className="text-slate-500">إجمالي السجلات:</span> <strong className="text-white">{restoreTarget.totalRecords}</strong></p>
                                <p><span className="text-slate-500">البصمة:</span> <strong className="text-slate-300 font-mono text-[10px] break-all">{restoreTarget.checksum}</strong></p>
                            </div>
                        </div>
                    </Modal>
                )}

                {deleteTarget && (
                    <Modal open={!!deleteTarget} onClose={() => setDeleteTarget(null)} size="sm"
                           title="حذف النسخة الاحتياطية"
                           subtitle={deleteTarget.id}
                           footer={
                               <React.Fragment>
                                   <button type="button" onClick={() => setDeleteTarget(null)} disabled={busy}
                                           className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                                   <button type="button" onClick={handleDelete} disabled={busy}

    function SystemResetSection({ api, toast, refresh }) {
        const [phrase, setPhrase] = useState('');
        const [autoBackup, setAutoBackup] = useState(true);
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);

        const targetPhrase = 'إعادة تهيئة النظام بالكامل';
        const isMatch = phrase.trim() === targetPhrase;

        const handleReset = async () => {
            if (!isMatch) return;
            setBusy(true);
            setResult(null);
            try {
                const res = await api.system.resetProjects({
                    confirmation: phrase.trim(),
                    createBackupFirst: autoBackup
                });
                setResult(res.result || res);
                toast('تمت إعادة تهيئة بيانات المشاريع بنجاح.', 'success');
                setPhrase('');
                if (refresh) await refresh();
            } catch (err) {
                toast(err.message || 'فشلت عملية إعادة التهيئة', 'error');
            } finally {
                setBusy(false);
            }
        };

        return (
            <div className="space-y-6">
                <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex flex-wrap items-center justify-between gap-4">
                    <div className="space-y-1">
                        <h3 className="text-base font-bold text-rose-400 flex items-center gap-2">
                            <i className="fa-solid fa-triangle-exclamation"></i>
                            إعادة تهيئة النظام وحذف بيانات المشاريع (System Reset)
                        </h3>
                        <p className="text-xs text-slate-400">
                            أداة إدارية حساسة مخصصة لمدير النظام لتفريغ كافة المشاريع والخطط والمهام والملفات مع الحفاظ الكامل على الحسابات والإعدادات.
                        </p>
                    </div>
                </div>

                <div className="p-5 bg-rose-950/30 border border-rose-500/40 rounded-2xl space-y-4">
                    <div className="flex items-start gap-3">
                        <i className="fa-solid fa-shield-virus text-rose-400 text-xl mt-1 shrink-0"></i>
                        <div className="space-y-2 text-xs text-slate-200 leading-relaxed">
                            <h4 className="font-bold text-sm text-rose-300">تأثير إعادة التهيئة على محتويات النظام:</h4>
                            <ul className="list-disc list-inside space-y-1 text-slate-300">
                                <li><strong className="text-rose-300">البيانات التي سيتم حذفها بالكامل:</strong> المشاريع (Projects)، خطط ومسارات الأساس (Master Plan Items)، المنتجات والمخرجات (Products)، المراحل والمعالم (Phases &amp; Milestones)، المهام التشغيلية وتعييناتها (Tasks &amp; Assignees)، سجلات تغيير التزمين، مركز الملفات، والتنبيهات.</li>
                                <li><strong className="text-emerald-400">البيانات المحمية التي لن تتأثر إطلاقًا:</strong> حسابات المستخدمين (Profiles)، كلمات المرور والصلاحيات والأدوار، إعدادات النظام وتكامل Google Drive، سجلات النشاط والتدقيق (Activity Log)، وملفات النسخ الاحتياطية (Backups).</li>
                            </ul>
                        </div>
                    </div>

                    <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl">
                        <label className="flex items-center gap-2.5 text-xs text-slate-200 cursor-pointer">
                            <input type="checkbox" checked={autoBackup} onChange={e => setAutoBackup(e.target.checked)} className="accent-emerald-500 rounded" />
                            <span className="font-bold">إنشاء نسخة احتياطية تلقائية آمنة قبل تفريغ البيانات (موصى به للغاية)</span>
                        </label>
                    </div>

                    <div className="p-4 bg-slate-950 border border-rose-500/30 rounded-xl space-y-3">
                        <label className="block text-xs font-bold text-slate-300">
                            لتأكيد العملية، يرجى كتابة العبارة التالية بدقة في الحقل أدناه:
                            <span className="block mt-1 font-mono text-rose-400 select-all font-bold text-sm">{targetPhrase}</span>
                        </label>
                        <input type="text" value={phrase} onChange={e => setPhrase(e.target.value)}
                               placeholder={`اكتب "${targetPhrase}" هنا`}
                               className={cx(inputClass, 'border-rose-500/50 focus:border-rose-400 text-white font-bold')} />
                        <button type="button" onClick={handleReset} disabled={!isMatch || busy}
                                className="w-full py-2.5 bg-rose-600 hover:bg-rose-500 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-rose-600/20">
                            {busy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-trash-can"></i>}
                            تأكيد إعادة تهيئة النظام وحذف بيانات المشاريع
                        </button>
                    </div>
                </div>

                {result && (
                    <div className="p-5 bg-slate-900 border border-emerald-500/40 rounded-2xl space-y-3">
                        <div className="flex items-center gap-2 font-bold text-emerald-400 text-sm">
                            <i className="fa-solid fa-circle-check"></i>
                            <span>اكتملت عملية إعادة تهيئة النظام بنجاح</span>
                        </div>

                            <p className="text-xs text-slate-300">
                                تم حفظ لقطة أمان مسبقة برمز: <strong className="text-cyan-400 font-mono">{result.preResetBackup.id}</strong> ({result.preResetBackup.sizeFormatted}).

                                    <strong className="text-rose-400 tabular-nums">{count} محذوف</strong>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    function AuditManagementSection({ api, toast }) {
        const [logs, setLogs] = useState([]);

        const [search, setSearch] = useState('');
        const [typeFilter, setTypeFilter] = useState('all');
        const [entityFilter, setEntityFilter] = useState('all');
        const [startDate, setStartDate] = useState('');
        const [endDate, setEndDate] = useState('');

        const fetchLogs = useCallback(async () => {
            setLoading(true);
            try {
                const params = {
                    limit: 300,
                    type: typeFilter !== 'all' ? typeFilter : undefined,
                    entity_table: entityFilter !== 'all' ? entityFilter : undefined,
                    start_date: startDate || undefined,
                    end_date: endDate || undefined,
                    search: search.trim() || undefined
                };
                const res = await api.logs.list(params);
                setLogs(Array.isArray(res) ? res : []);
            } catch (err) {
                toast(err.message || 'تعذر جلب سجل النشاط', 'error');
            } finally {
                setLoading(false);
            }
        }, [api, typeFilter, entityFilter, startDate, endDate, search, toast]);

        useEffect(() => {
            const t = setTimeout(fetchLogs, 250);
            return () => clearTimeout(t);
        }, [fetchLogs]);

        const resetFilters = () => {
            setSearch('');
            setTypeFilter('all');
            setEntityFilter('all');
            setStartDate('');
            setEndDate('');

                        </h3>
                        <p className="text-xs text-slate-400">

                        </p>

                    <button type="button" onClick={fetchLogs} disabled={loading}

                        <i className={cx('fa-solid fa-arrows-rotate', loading && 'fa-spin')}></i>
                        تحديث السجل
                    </button>
                </div>

                <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5 text-xs">
                        <div className="relative">
                            <i className="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 start-3 text-slate-500 text-xs"></i>
                            <input type="search" value={search} onChange={e => setSearch(e.target.value)}

                        </div>

                        <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)}
                                className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-blue-500 focus:outline-none">
                            <option value="all">كل أنواع العمليات</option>
                            {Object.entries(LOG_TYPES).map(([k, m]) => (
                                <option key={k} value={k}>{m.label} ({k})</option>
                            ))}
                        </select>

                        <select value={entityFilter} onChange={e => setEntityFilter(e.target.value)}
                                className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-blue-500 focus:outline-none">
                            <option value="all">كل الجداول والكيانات</option>
                            <option value="projects">المشاريع (projects)</option>
                            <option value="master_plan_items">بنود الخطة (master_plan_items)</option>

                            <option value="backups">النسخ الاحتياطي (backups)</option>
                            <option value="system">النظام (system)</option>
                            <option value="app_settings">الإعدادات (app_settings)</option>
                            <option value="profiles">المستخدمون (profiles)</option>

                        <input type="date" lang="en" dir="ltr" value={startDate} onChange={e => setStartDate(e.target.value)}

                                            <span className={cx('w-8 h-8 rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-center shrink-0 mt-0.5', meta.color)}>

    function MasterPlanImportModal({ open, api, onClose, onImported, toast }) {
        const [file,setFile] = useState(null); const [preview,setPreview] = useState(null); const [busy,setBusy] = useState(false);
        useEffect(() => { if (open) { setFile(null); setPreview(null); } }, [open]);
        const inspect = async () => { if (!file) return; setBusy(true); try { setPreview(await api.masterPlans.preview(file)); } catch (error) { toast(error.message,'error'); } finally { setBusy(false); } };
        const commit = async () => { setBusy(true); try { const result = await api.masterPlans.import(preview.rows,preview.definitions); toast(`تم استيراد ${result.inserted} بند وتحديث ${result.updated} بند.`, 'success'); await onImported(); onClose(); } catch(error) { toast(error.message,'error'); } finally { setBusy(false); } };
        return <Modal open={open} onClose={onClose} size="xl" title="استيراد الخطة الرئيسية" subtitle="القالب المعتمد يتكون من 24 عمودًا ويحافظ على التسلسل والمسارات والمواعيد والمستهدفات."
            footer={preview && <React.Fragment><button onClick={onClose} className="px-4 py-2 bg-slate-800 rounded-xl">إلغاء</button><button onClick={commit} disabled={busy || preview.summary.invalid} className="px-5 py-2 bg-emerald-600 text-white rounded-xl font-bold disabled:opacity-50">اعتماد {preview.summary.valid} بند</button></React.Fragment>}>
            <div className="flex gap-3 items-end"><Field label="ملف الخطة الرئيسية XLSX" required><input type="file" accept=".xlsx" onChange={event => { setFile(event.target.files[0] || null); setPreview(null); }} className="block w-full text-sm" /></Field>
            <button onClick={inspect} disabled={!file || busy} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold disabled:opacity-50">فحص الملف</button></div>
            {preview && <div className="space-y-3"><div className="grid grid-cols-4 gap-3">{[['المشاريع',preview.summary.projects],['الإجمالي',preview.summary.total],['صالح',preview.summary.valid],['أخطاء',preview.summary.invalid]].map(([label,value]) => <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-center" key={label}><strong className="block text-xl">{value}</strong><span className="text-xs text-slate-500">{label}</span></div>)}</div>

        </Modal>;
    }

            if (!product) return false;
            if (initial && product.id === initial.product_id) return true;
            if (product.is_active === false || ['completed', 'approved', 'cancelled', 'archived'].includes(product.status)) return false;
            if (product.allow_multiple_tasks) return true;
            return !safeTasks.some(task => task && task.product_id === product.id && task.id !== (initial && initial.id));
        }) : []), [data.products, safeTasks, initial]);
        const availablePlanItems = useMemo(() => safePlanItems.filter(item => item && item.project_id === form.project_id), [safePlanItems, form.project_id]);
        const selectPlanItem = (valOrEvent) => {
            const id = (valOrEvent && valOrEvent.target) ? valOrEvent.target.value : (valOrEvent || '');

            setForm(prev => ({
                ...prev, plan_item_id: id,
                title: item && !prev.title ? item.title : prev.title,
                description: item && !prev.description ? (item.content || item.description || '') : prev.description,
                phase_name: item && !prev.phase_name ? (item.phase || item.track || '') : prev.phase_name,
                planned_start: item && item.planned_start ? item.planned_start : prev.planned_start,
                due_date: item && item.planned_end ? item.planned_end : prev.due_date,
                priority: item ? item.priority : prev.priority
            }));
        };

        const submit = (event) => {
            event.preventDefault();
            onSubmit({
                ...form,
                product_id:  form.product_id  || null,
                project_id:  form.project_id  || null,
                plan_item_id: form.plan_item_id || null,
                assignee_id: form.assignee_id || null,
                planned_start: form.planned_start || null,
                due_date:      form.due_date      || null
            });
        };

        return (
            <Modal open={open} onClose={onClose} size="lg"
                   title={initial ? 'تعديل المهمة' : 'إضافة مهمة جديدة'}
                   subtitle={initial ? 'تُسجَّل كل تعديلاتك في سجل التدقيق تلقائيًا.' : null}

                           <button type="submit" form="task-form" disabled={busy}

                               {busy && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}حفظ
                           </button>
                       </React.Fragment>
                   }>
                <form id="task-form" onSubmit={submit} className="space-y-4">
                    <Field label="عنوان المهمة" required>
                        <input className={inputClass} value={form.title} onChange={set('title')} required maxLength={200} />
                    </Field>

                    <Field label="الوصف">
                        <textarea className={cx(inputClass, 'h-20 resize-none')} value={form.description} onChange={set('description')} maxLength={1000} />
                    </Field>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <Field label="اسم المرحلة">
                            <input className={inputClass} value={form.phase_name} onChange={set('phase_name')} maxLength={200} />
                        </Field>
                        <Field label="الملاحظات">
                            <input className={inputClass} value={form.notes} onChange={set('notes')} maxLength={1000} />
                        </Field>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <SearchableSelect
                            label="المشروع / الخطة الرئيسية"
                            placeholder="— بدون مشروع —"
                            value={form.project_id}
                            onChange={(val) => setForm(prev => ({ ...prev, project_id: val, plan_item_id: '' }))}
                            clearable
                            options={safeProjects.map(project => ({
                                value: project.id,
                                label: project.name,
                                code: '',
                                badge: null
                            }))}
                        />
                        <SearchableSelect
                            label="بند الخطة المعتمد"
                            hint="يربط المهمة بخط الأساس لقياس الالتزام والانحراف."
                            placeholder="— بدون بند —"
                            value={form.plan_item_id}
                            onChange={selectPlanItem}
                            disabled={!form.project_id}
                            clearable
                            options={availablePlanItems.map(item => ({
                                value: item.id,
                                label: item.title,
                                code: '',
                                badge: null
                            }))}
                        />
                        <SearchableSelect
                            label="المنتج المرتبط"
                            hint="تُعرض المنتجات النشطة المتاحة فقط؛ المنتج ذو المهمة السابقة لا يظهر إلا إذا كان يسمح بمهام متعددة."
                            placeholder="— بدون —"
                            value={form.product_id}
                            onChange={(val) => setForm(prev => ({ ...prev, product_id: val }))}
                            clearable
                            options={availableProducts.map(p => ({
                                value: p.id,
                                label: p.name,
                                code: '',
                                badge: null
                            }))}
                        />
                        <Field label="الجهة" required>
                            <select className={inputClass} value={form.org} onChange={set('org')}>
                                {ORG_LIST.map(o => <option key={o.code} value={o.code}>{o.label}</option>)}
                            </select>
                        </Field>
                        <Field label="المسؤول">
                            <select className={inputClass} value={form.assignee_id} onChange={set('assignee_id')}>
                                <option value="">— غير مسنَد —</option>
                                {safeProfiles.filter(u => u.status === 'active')
                                    .map(u => <option key={u.id} value={u.id}>{u.name} ({org(u.org).short})</option>)}
                            </select>
                        </Field>
                        <Field label="الأولوية">
                            <select className={inputClass} value={form.priority} onChange={set('priority')}>
                                {Object.values(PRIORITY).map(p => <option key={p.code} value={p.code}>{p.label}</option>)}
                            </select>
                        </Field>
                        <Field label="تاريخ البدء المخطط">
                            <input type="date" lang="en" dir="ltr" className={inputClass} value={form.planned_start || ''} onChange={set('planned_start')} />
                        </Field>
                        <Field label="تاريخ الاستحقاق">
                            <input type="date" lang="en" dir="ltr" className={inputClass} value={form.due_date || ''} onChange={set('due_date')}
                                   min={form.planned_start || undefined} />
                        </Field>
                        <Field label="الحالة">
                            <select className={inputClass} value={form.status} onChange={set('status')}>
                                {Object.values(TASK_STATUS).map(s => <option key={s.code} value={s.code}>{s.label}</option>)}
                            </select>
                        </Field>
                        <Field label={`نسبة الإنجاز: ${form.progress}%`}
                               hint="تُضبط تلقائيًا إلى 100% عند اختيار حالة مكتملة أو معتمدة.">
                            <input type="range" min="0" max="100" step="5" value={form.progress} onChange={set('progress')}
                                   className="w-full accent-blue-500" aria-label="نسبة الإنجاز" />
                        </Field>
                    </div>
                </form>
            </Modal>
        );
    }

    function PlanImportModal({ open, api, onClose, onImported, toast }) {
        const [file, setFile] = useState(null);
        const [preview, setPreview] = useState(null);
        const [busy, setBusy] = useState(false);
        const validRows = preview ? preview.rows.filter(row => row.valid) : [];

        useEffect(() => {
            if (open) { setFile(null); setPreview(null); setBusy(false); }
        }, [open]);

        const inspect = async () => {
            if (!file) { toast('اختر ملف Excel أولًا.', 'error'); return; }
            setBusy(true);
            try {
                setPreview(await api.plans.preview(file));
            } catch (error) {
                toast(error.message || 'تعذّرت قراءة ملف الخطة.', 'error');
            } finally { setBusy(false); }
        };

        const commit = async () => {
            if (!validRows.length) return;
            setBusy(true);
            try {
                const result = await api.plans.import(validRows);
                toast(`تم استيراد ${result.imported} مهمة بنجاح${result.duplicates ? ` وتجاوز ${result.duplicates} مكررة` : ''}.`, 'success');
                await onImported();
                onClose();
            } catch (error) {
                toast(error.message || 'تعذّر اعتماد الاستيراد.', 'error');
            } finally { setBusy(false); }
        };

        return (
            <Modal open={open} onClose={onClose} size="xl" title="إضافة خطة جديدة من Excel"
                   subtitle="تُعرض معاينة كاملة قبل الإضافة، ولا تُحذف أو تُستبدل أي بيانات حالية."
                   footer={preview && (
                       <React.Fragment>
                           <button type="button" onClick={onClose} disabled={busy}
                                   className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                           <button type="button" onClick={commit} disabled={busy || !validRows.length}
                                   className="px-5 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white rounded-xl text-sm font-bold">
                               {busy && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}
                               اعتماد واستيراد {validRows.length} مهمة
                           </button>
                       </React.Fragment>
                   )}>
                <div className="p-4 bg-blue-950/30 border border-blue-500/30 rounded-xl text-sm text-blue-200 leading-relaxed">
                    يدعم النظام نموذج الخطة الحديث وتنسيق ملف WAMY ذي ورقة «المهام» والأعمدة العشرة. الصفوف الخاطئة أو المكررة ستظهر هنا ولن تُضاف؛ ويمكن اعتماد الصفوف الصحيحة فقط.
                </div>

                <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
                    <Field label="ملف الخطة بصيغة XLSX" required>
                        <input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                               onChange={(event) => { setFile(event.target.files[0] || null); setPreview(null); }}
                               className="block w-full text-sm text-slate-300 file:me-3 file:px-4 file:py-2 file:border-0 file:rounded-lg file:bg-slate-800 file:text-white file:font-bold hover:file:bg-slate-700" />
                    </Field>
                    <button type="button" onClick={inspect} disabled={busy || !file}
                            className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-xl text-sm font-bold shrink-0">
                        {busy && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}
                        فحص وعرض المعاينة
                    </button>
                </div>

                {preview && (
                    <React.Fragment>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            {[
                                ['إجمالي الصفوف', preview.summary.total, 'text-white'],
                                ['جاهزة للاستيراد', preview.summary.valid, 'text-emerald-400'],
                                ['تحتاج تصحيحًا', preview.summary.invalid, 'text-rose-400'],
                                ['مكررة', preview.summary.duplicates, 'text-amber-400']
                            ].map(([label, value, tone]) => (
                                <div key={label} className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-center">
                                    <strong className={cx('block text-xl', tone)}>{value}</strong>
                                    <span className="text-xs text-slate-500">{label}</span>
                                </div>
                            ))}
                        </div>

                        <div className="border border-slate-800 rounded-xl overflow-auto max-h-[22rem]">
                            <table className="w-full text-xs min-w-[62rem]">
                                <thead className="sticky top-0 bg-slate-950 text-slate-400">
                                    <tr>
                                        <th className="p-3 text-start">الصف</th><th className="p-3 text-start">المنتج</th>
                                        <th className="p-3 text-start">المرحلة والمهمة</th><th className="p-3 text-start">الجهة والمسؤول</th>
                                        <th className="p-3 text-start">التواريخ</th><th className="p-3 text-start">النتيجة</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {preview.rows.map(row => (
                                        <tr key={row.row_number} className={row.valid ? 'bg-emerald-950/10' : 'bg-rose-950/15'}>
                                            <td className="p-3 font-mono">{row.row_number}</td>
                                            <td className="p-3"><bdi className="text-blue-400 font-mono">{row.product_code || '—'}</bdi><span className="block text-slate-400">{row.product_name}</span></td>
                                            <td className="p-3"><span className="text-slate-400">{row.phase_name || 'بلا مرحلة'}</span><strong className="block text-white mt-1">{row.title || '—'}</strong></td>
                                            <td className="p-3"><OrgChip code={row.org} /><span className="block text-slate-400 mt-1">{row.assignee_name || 'غير مسند'}</span></td>
                                            <td className="p-3 font-mono" dir="ltr">{row.planned_start || '—'} → {row.due_date || '—'}</td>
                                            <td className="p-3">
                                                {row.valid
                                                    ? <span className="text-emerald-400 font-bold"><i className="fa-solid fa-circle-check me-1"></i>صالح</span>
                                                    : <ul className="text-rose-300 space-y-1">{row.errors.map((error, index) => <li key={index}>• {error}</li>)}</ul>}
