    function AuthScreen({ api }) {
        const [mode, setMode] = useState('login'); // login | signup
        const [form, setForm] = useState({ email: '', password: '', name: '', org: 'wamy', position: '' });
        const [error, setError] = useState('');
        const [notice, setNotice] = useState('');
        const [busy, setBusy] = useState(false);

        const set = (key) => (event) => setForm(prev => ({ ...prev, [key]: event.target.value }));

        const submit = async (event) => {
            event.preventDefault();
            setError(''); setNotice(''); setBusy(true);
            try {
                if (mode === 'login') {
                    const { error: err } = await api.auth.signInWithPassword({
                        email: form.email.trim().toLowerCase(), password: form.password
                    });
                    if (err) throw err;
                } else if (mode === 'signup') {
                    if (form.password.length < 12) throw new Error('كلمة المرور يجب ألا تقل عن 12 حرفًا.');
                    if (!form.name.trim())         throw new Error('الاسم مطلوب.');
                    const { data, error: err } = await api.auth.signUp({
                        email: form.email.trim().toLowerCase(),
                        password: form.password,
                        options: { data: { name: form.name.trim(), org: form.org, position: form.position.trim() } }
                    });
                    if (err) throw err;
                    setNotice(data && data.firstAdmin
                        ? 'تم إنشاء أول حساب كمدير نظام نشط. يمكنك تسجيل الدخول الآن.'
                        : 'تم إنشاء الحساب. انتظر تفعيله من مدير النظام، ثم سجّل الدخول.');
                    setMode('login');
                }
            } catch (err) {
                setError(translateAuthError(err));
            } finally {
                setBusy(false);
            }
        };

        const tabs = [
            { key: 'login',  label: 'تسجيل الدخول' },
            { key: 'signup', label: 'إنشاء حساب' }
        ];

        return (
            <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 flex items-center justify-center p-4">
                <div className="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
                    <div className="text-center space-y-2">
                        <WamyLogo className="w-16 h-16 rounded-2xl mx-auto shadow-xl shadow-blue-500/25" />
                        <h1 className="text-lg font-bold text-white">لوحة متابعة الخطة الزمنية</h1>
                    </div>

                    <div className="grid grid-cols-2 gap-1 p-1 bg-slate-950 rounded-xl border border-slate-800">
                        {tabs.map(t => (
                            <button key={t.key} type="button"
                                    onClick={() => { setMode(t.key); setError(''); setNotice(''); }}
                                    className={cx('py-2 rounded-lg text-sm font-bold transition-colors',
                                        mode === t.key ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white')}>
                                {t.label}
                            </button>
                        ))}
                    </div>

                    {error  && <p role="alert" className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-300 text-sm">{error}</p>}
                    {notice && <p role="status" className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-300 text-sm">{notice}</p>}

                    <form onSubmit={submit} className="space-y-4">
                        {mode === 'signup' && (
                            <React.Fragment>
                                <Field label="الاسم الكامل" required>
                                    <input className={inputClass} value={form.name} onChange={set('name')} required autoComplete="name" />
                                </Field>
                                <div className="grid grid-cols-2 gap-3">
                                    <Field label="الجهة" required>
                                        <select className={inputClass} value={form.org} onChange={set('org')}>
                                            {ORG_LIST.map(o => <option key={o.code} value={o.code}>{o.label}</option>)}
                                        </select>
                                    </Field>
                                    <Field label="المنصب">
                                        <input className={inputClass} value={form.position} onChange={set('position')} placeholder="مثال: مدير مشروع" />
                                    </Field>
                                </div>
                            </React.Fragment>
                        )}

                        <Field label="البريد الإلكتروني" required>
                            <input type="email" dir="ltr" className={cx(inputClass, 'font-mono')} value={form.email}
                                   onChange={set('email')} required autoComplete="email" placeholder="name@wamy.org" />
                        </Field>

                        <Field label="كلمة المرور" required
                               hint={mode === 'signup' ? 'اثنا عشر حرفًا على الأقل. تُخزَّن كتجزئة آمنة داخل PostgreSQL.' : null}>
                            <input type="password" className={inputClass} value={form.password} onChange={set('password')}
                                   required minLength={mode === 'signup' ? 12 : 1}
                                   autoComplete={mode === 'signup' ? 'new-password' : 'current-password'} />
                        </Field>

                        <button type="submit" disabled={busy}
                                className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-60 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 text-sm flex items-center justify-center gap-2">
                            {busy && <i className="fa-solid fa-circle-notch fa-spin"></i>}
                            <span>{mode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب'}</span>
                        </button>
                    </form>
                </div>
            </div>
        );
    }

    function InvitationAcceptanceScreen({ api, token }) {
        const [invitation,setInvitation] = useState(null);
        const [password,setPassword] = useState('');
        const [confirm,setConfirm] = useState('');
        const [error,setError] = useState('');
        const [busy,setBusy] = useState(true);

        useEffect(() => {
            let active = true;
            api.auth.invitation(token).then(value => { if (active) setInvitation(value); })
                .catch(err => { if (active) setError(err.message); }).finally(() => { if (active) setBusy(false); });
            return () => { active = false; };
        }, [api,token]);

        const submit = async event => {
            event.preventDefault(); setError('');
            if (password.length < 12) { setError('كلمة المرور يجب ألا تقل عن 12 حرفًا.'); return; }
            if (password !== confirm) { setError('كلمتا المرور غير متطابقتين.'); return; }
            setBusy(true);
            try {
                await api.auth.acceptInvitation(token,password);
                window.history.replaceState({},document.title,window.location.pathname);
            } catch (err) { setError(err.message); setBusy(false); }
        };

        return <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-5">
                <div className="text-center"><i className="fa-solid fa-user-check text-3xl text-emerald-400 mb-3"></i><h1 className="text-lg font-bold text-white">إكمال تسجيل المستخدم</h1></div>
                {busy && !invitation ? <Spinner label="جارٍ التحقق من رابط الدعوة…" /> : error && !invitation
                    ? <div className="space-y-4"><p role="alert" className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-300 text-sm">{error}</p><a href="/" className="block text-center text-blue-400">العودة لتسجيل الدخول</a></div>
                    : invitation && <form onSubmit={submit} className="space-y-4">
                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl"><strong className="block text-white">{invitation.name}</strong><span className="block text-xs text-slate-400 font-mono" dir="ltr">{invitation.email}</span><span className="block text-xs text-slate-500 mt-1">{lookup(ROLES,invitation.role,'user').label} · {org(invitation.org).label}</span></div>
                        {error && <p role="alert" className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-300 text-sm">{error}</p>}
                        <Field label="كلمة المرور الجديدة" required hint="12 حرفًا على الأقل."><input type="password" className={inputClass} value={password} onChange={event => setPassword(event.target.value)} minLength="12" required autoComplete="new-password" /></Field>
                        <Field label="تأكيد كلمة المرور" required><input type="password" className={inputClass} value={confirm} onChange={event => setConfirm(event.target.value)} minLength="12" required autoComplete="new-password" /></Field>
                        <button disabled={busy} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold rounded-xl">{busy && <i className="fa-solid fa-circle-notch fa-spin me-2"></i>}تفعيل الحساب والدخول</button>
                    </form>}
            </div>
        </div>;
    }

    function translateAuthError(err) {
        const message = String((err && err.message) || err || '');
        if (/Invalid login credentials/i.test(message)) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
        if (/User already registered/i.test(message))   return 'هذا البريد مسجل مسبقًا.';
        if (/rate limit|too many/i.test(message))       return 'محاولات كثيرة خلال وقت قصير. انتظر قليلًا ثم أعد المحاولة.';
        if (/Password should be/i.test(message))        return 'كلمة المرور ضعيفة جدًا. استخدم عشرة أحرف على الأقل.';
        return message || 'تعذّر إتمام العملية.';
    }

    /* Bars are positioned on a shared, real timeline, so they can actually be
       compared. The previous version drew width = progress%, which made a
       30-day product look identical to a 300-day one. */
    function GanttScreen({ data, filters }) {
        const { products, tasks } = data;

        const visible = useMemo(() => products
            .filter(p => (filters.org === 'all' || p.org === filters.org) && p.start_date && p.due_date)
            .sort((a, b) => a.start_date.localeCompare(b.start_date)), [products, filters]);

        const range = useMemo(() => {
            if (!visible.length) return null;
            const starts = visible.map(p => new Date(p.start_date).getTime());
            const ends   = visible.map(p => new Date(p.due_date).getTime());
            const min = Math.min(...starts), max = Math.max(...ends);
            return { min, max, span: Math.max(max - min, 86400000) };
        }, [visible]);

        const months = useMemo(() => {
            if (!range) return [];
            const out = [];
            const cursor = new Date(range.min); cursor.setDate(1);
            while (cursor.getTime() <= range.max) {
                out.push({
                    key: cursor.toISOString().slice(0, 7),
                    label: cursor.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { month: 'short', year: '2-digit' }),
                    offset: Math.max(0, Math.min(100, ((cursor.getTime() - range.min) / range.span) * 100))
                });
                cursor.setMonth(cursor.getMonth() + 1);
            }
            return out;
        }, [range]);

        const todayOffset = range
            ? ((Date.now() - range.min) / range.span) * 100
            : null;

        return (
            <div className="space-y-5">
                <SectionHeading icon="fa-chart-gantt" title="الخطة الزمنية (Gantt)"
                                description="مواقع الأشرطة ومقاساتها تعكس التواريخ الفعلية على محور زمني موحّد" />

                {!range
                    ? <div className="bg-slate-900 border border-slate-800 rounded-2xl">
                          <EmptyState icon="fa-chart-gantt" title="لا توجد منتجات بتواريخ محددة" hint="أضف تاريخ بداية ونهاية للمنتجات لعرضها على المخطط." />
                      </div>
                    : <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 overflow-x-auto">
                        <div className="min-w-[46rem]">
                            {/* Arabic timeline: the earliest date begins at the
                                right edge and time advances toward the left. */}
                            <div className="relative h-6 mb-3 border-b border-slate-800" dir="rtl">
                                {months.map(m => (
                                    <span key={m.key} className="absolute top-0 text-[11px] text-slate-500 font-mono translate-x-1/2 whitespace-nowrap"
                                          style={{ right: m.offset + '%' }}>
                                        {m.label}
                                    </span>
                                ))}
                            </div>

                            <div className="space-y-3" dir="rtl">
                                {visible.map(p => {
                                    const start = new Date(p.start_date).getTime();
                                    const end   = new Date(p.due_date).getTime();
                                    const right = ((start - range.min) / range.span) * 100;
                                    const width = Math.max(((end - start) / range.span) * 100, 1.5);
                                    const pct   = productProgress(p, tasks);
                                    const o     = org(p.org);
                                    return (
                                        <div key={p.id} className="relative">
                                            <div className="flex justify-between items-baseline text-xs mb-1" dir="rtl">
                                                <span className="font-bold text-white flex items-center gap-2 truncate">
                                                    <span className={cx('w-2.5 h-2.5 rounded-full shrink-0', o.dot)}></span>
                                                    <span className="truncate">{p.code} — {p.name}</span>
                                                </span>
                                                <span className="text-slate-400 font-mono text-[11px] shrink-0 ps-3" dir="rtl">
                                                    <bdi>{p.start_date}</bdi> ← <bdi>{p.due_date}</bdi>
                                                </span>
                                            </div>
                                            <div className="relative h-7 bg-slate-950 rounded-lg border border-slate-800">
                                                {todayOffset !== null && todayOffset >= 0 && todayOffset <= 100 && (
                                                    <span className="absolute top-0 bottom-0 w-px bg-rose-500/70 z-10" style={{ right: todayOffset + '%' }}
                                                          title="اليوم" aria-hidden="true"></span>
                                                )}
                                                <div className={cx('absolute top-1 bottom-1 rounded-md opacity-30', o.bar)}
                                                     style={{ right: right + '%', width: width + '%' }}></div>
                                                {/* Rendered only above 0: the horizontal padding sets a ~16px floor
                                                    on the element's width, so a 0% fill would still paint a visible
                                                    chunk and read as progress that has not happened. */}
                                                {pct > 0 && (
                                                    <div className={cx('absolute top-1 bottom-1 rounded-md flex items-center justify-end px-2', o.bar)}
                                                         style={{ right: right + '%', width: (width * pct / 100) + '%' }}>
                                                        {pct >= 15 && <span className="text-[10px] font-bold text-white">{pct}%</span>}
                                                    </div>
                                                )}
                                                {pct < 15 && (
                                                    <span className="absolute top-1/2 -translate-y-1/2 text-[10px] font-bold text-slate-400"
                                                          style={{ right: `calc(${right + width}% + 6px)` }}>{pct}%</span>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                      </div>}
            </div>
        );
    }

    function CalendarScreen({ data, filters }) {
        const { tasks } = data;

        const grouped = useMemo(() => {
            const visible = tasks
                .filter(t => t.due_date && (filters.org === 'all' || t.org === filters.org))
                .filter(t => !filters.query || t.title.toLowerCase().includes(filters.query))
                .sort((a, b) => a.due_date.localeCompare(b.due_date));

            const map = new Map();
            visible.forEach(t => {
                const key = t.due_date.slice(0, 7);
                if (!map.has(key)) map.set(key, []);
                map.get(key).push(t);
            });
            return Array.from(map.entries());
        }, [tasks, filters]);

        return (
            <div className="space-y-5">
                <SectionHeading icon="fa-calendar-days" title="التقويم والجدولة" description="المواعيد النهائية مرتّبة شهريًا" />
                {grouped.length === 0
                    ? <div className="bg-slate-900 border border-slate-800 rounded-2xl">
                          <EmptyState icon="fa-calendar-xmark" title="لا توجد مواعيد مجدولة" hint="أضف تواريخ استحقاق للمهام لعرضها هنا." />
                      </div>
                    : grouped.map(([month, items]) => (
                        <section key={month} className="space-y-3">
                            <h3 className="text-sm font-bold text-slate-300 flex items-center gap-2 sticky top-0 bg-slate-950/95 backdrop-blur py-2 z-10">
                                <i className="fa-regular fa-calendar text-blue-400"></i>
                                <span>{new Date(month + '-01').toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { month: 'long', year: 'numeric' })}</span>
                                <span className="text-xs text-slate-500 font-normal">({items.length} مهمة)</span>
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                {items.map(t => {
                                    const status = lookup(TASK_STATUS, t.status, 'not_started');
                                    const late   = isOverdue(t);
                                    return (
                                        <article key={t.id} className={cx('p-4 bg-slate-900 border rounded-2xl space-y-2.5',
                                            late ? 'border-rose-500/40' : 'border-slate-800')}>
                                            <div className="flex justify-between items-center gap-2">
                                                <span className="text-xs font-mono bg-slate-950 text-blue-400 px-2 py-1 rounded font-bold" dir="ltr">
                                                    {t.due_date}
                                                </span>
                                                <OrgChip code={t.org} />
                                            </div>
                                            <h4 className="text-sm font-bold text-white leading-relaxed">{t.title}</h4>
                                            {t.description && <p className="text-xs text-slate-400">{t.description}</p>}
                                            <div className="flex items-center justify-between gap-2 pt-1">
                                                <Chip className={status.chip}>{status.label}</Chip>
                                                <span className="text-xs text-slate-400 tabular-nums">{t.progress}%</span>
                                            </div>
                                        </article>
                                    );
                                })}
                            </div>
                        </section>
                      ))}
            </div>

    function ChangePasswordModal({ open, api, onClose, toast }) {
        const [currentPassword, setCurrentPassword] = useState('');
        const [newPassword, setNewPassword] = useState('');
        const [confirmPassword, setConfirmPassword] = useState('');
        const [busy, setBusy] = useState(false);

        useEffect(() => {
            if (open) {
                setCurrentPassword('');
                setNewPassword('');
                setConfirmPassword('');
                setBusy(false);
            }
        }, [open]);

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (newPassword.length < 12) {
                toast('يجب أن تكون كلمة المرور الجديدة 12 حرفاً على الأقل', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                toast('كلمتا المرور غير متطابقتين', 'error');
                return;
            }
            setBusy(true);
            try {
                await api.auth.changePassword({
                    current_password: currentPassword,
                    new_password: newPassword
                });
                toast('تم تغيير كلمة المرور بنجاح وتسجيل الخروج من الجلسات الأخرى', 'success');
                onClose();
            } catch (err) {
                toast(err.message || 'تعذر تغيير كلمة المرور', 'error');
            } finally {
                setBusy(false);
            }
        };

        return (
            <Modal open={open} onClose={onClose} title="تغيير كلمة المرور الخاصة بك" size="md"
                   subtitle="تغيير كلمة المرور الشخصية مع إبطال الجلسات الأخرى النشطة تلقائياً"
                   footer={
                       <React.Fragment>
                           <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                           <button type="submit" form="change-pw-form" disabled={busy} className="px-5 py-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white rounded-xl text-sm font-bold">
                               {busy && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}تغيير كلمة المرور
                           </button>
                       </React.Fragment>
                   }>
                <form id="change-pw-form" onSubmit={handleSubmit} className="space-y-4">
                    <Field label="كلمة المرور الحالية" required>
                        <input type="password" className={inputClass} value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} required placeholder="••••••••••••" />
                    </Field>
                    <Field label="كلمة المرور الجديدة" required hint="12 حرفاً على الأقل">
                        <input type="password" className={inputClass} value={newPassword} onChange={e => setNewPassword(e.target.value)} required minLength="12" placeholder="••••••••••••" />
                    </Field>
                    <Field label="تأكيد كلمة المرور الجديدة" required>
                        <input type="password" className={inputClass} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} required minLength="12" placeholder="••••••••••••" />
                    </Field>
                </form>
            </Modal>
        );
    }

    function ResetPasswordModal({ open, user, api, onClose, toast }) {
        const [newPassword, setNewPassword] = useState('');
        const [confirmPassword, setConfirmPassword] = useState('');
        const [busy, setBusy] = useState(false);

        useEffect(() => {
            if (open) {
                setNewPassword('');
                setConfirmPassword('');
                setBusy(false);
            }
        }, [open]);

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!user) return;
            if (newPassword.length < 12) {
                toast('يجب أن تكون كلمة المرور 12 حرفاً على الأقل', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                toast('كلمتا المرور غير متطابقتين', 'error');
                return;
            }
            setBusy(true);
            try {
                await api.profiles.resetPassword(user.id, { new_password: newPassword });
                toast(`تمت إعادة تعيين كلمة المرور للمستخدم ${user.name} بنجاح وإلغاء جلساته النشطة`, 'success');
                onClose();
            } catch (err) {
                toast(err.message || 'تعذر إعادة تعيين كلمة المرور', 'error');
            } finally {
                setBusy(false);
            }
        };

        if (!user) return null;

        return (
            <Modal open={open} onClose={onClose} title={`إعادة تعيين كلمة المرور: ${user.name}`} size="md"
                   subtitle="إجراء إداري لتعيين كلمة مرور جديدة للمستخدم مع تسجيل خروجه فورياً من كافة أجهزته"

                    </div>
                    <Field label="كلمة المرور الجديدة" required hint="12 حرفاً على الأقل">
                        <input type="password" className={inputClass} value={newPassword} onChange={e => setNewPassword(e.target.value)} required minLength="12" placeholder="••••••••••••" />
                    </Field>
                    <Field label="تأكيد كلمة المرور الجديدة" required>
                        <input type="password" className={inputClass} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} required minLength="12" placeholder="••••••••••••" />
                    </Field>
                </form>
            </Modal>
        );

        const mayEdit = canAny(profile, 'Organizations.Edit', 'Settings.General') || isAdmin(profile);
        const mayDelete = canAny(profile, 'Organizations.Delete', 'Settings.General') || isAdmin(profile);

        const orgsList = data.organizations || [];

        const handleSave = async (form) => {
            setBusy(true);
            try {
                if (orgModal.initial) {
                    await api.organizations.update(orgModal.initial.id, form);
                    toast('تم تحديث بيانات الجهة بنجاح', 'success');
                } else {
                    await api.organizations.create(form);
                    toast('تمت إضافة الجهة بنجاح', 'success');
                }
                setOrgModal(null);
                await refresh(true);
            } catch (err) {
                toast(err.message || 'تعذر حفظ بيانات الجهة', 'error');
            } finally {
                setBusy(false);
            }
        };

        const handleToggleStatus = async (o) => {
            setBusy(true);
            try {
                if (o.is_active) {
                    await api.organizations.deactivate(o.id);
                    toast(`تم تعطيل الجهة ${o.name}`, 'success');
                } else {
                    await api.organizations.activate(o.id);
                    toast(`تم تفعيل الجهة ${o.name}`, 'success');
                }
                await refresh(true);
            } catch (err) {
                toast(err.message || 'تعذر تغيير حالة الجهة', 'error');
            } finally {
                setBusy(false);
            }
        };

        const handleDelete = async (o) => {
            if (!confirm(`هل أنت متأكد من حذف الجهة «${o.name}» نهائياً؟ لا يمكن حذف جهة مرتبطة بمشاريع أو مستخدمين.`)) return;
            setBusy(true);
            try {
                await api.organizations.remove(o.id);
                toast('تم حذف الجهة بنجاح', 'success');
                await refresh(true);
            } catch (err) {
                toast(err.message || 'تعذر حذف الجهة', 'error');
            } finally {
                setBusy(false);
            }
        };

        return (
            <div className="space-y-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <SectionHeading icon="fa-building-columns" title="إدارة الجهات والمؤسسات"
                                    description="إدارة الجهات الشريكة، أكوادها الفريدة، وحالات التفعيل للأعمال التشغيلية." />
                    {mayCreate && (
                        <button type="button" onClick={() => setOrgModal({ initial: null })}
                                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-bold flex items-center gap-1.5 shrink-0">
                            <i className="fa-solid fa-plus"></i>
                            <span>إضافة جهة جديدة</span>
                        </button>
                    )}
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md">
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                            <caption className="sr-only">قائمة الجهات</caption>
                            <thead>
                                <tr className="border-b border-slate-800 text-slate-400 bg-slate-950/40 text-xs">
                                    <th scope="col" className="p-4 font-bold text-start">رمز الجهة</th>
                                    <th scope="col" className="p-4 font-bold text-start">الاسم الكامل</th>
                                    <th scope="col" className="p-4 font-bold text-start">الاسم المختصر</th>
                                    <th scope="col" className="p-4 font-bold text-start">المظهر واللون</th>
                                    <th scope="col" className="p-4 font-bold text-start">الحالة</th>
                                    <th scope="col" className="p-4 font-bold text-center no-print">إجراءات</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                                {orgsList.map(o => {
                                    const acc = ORG_ACCENTS[o.accent_color] || ORG_ACCENTS.blue;
                                    return (
                                        <tr key={o.id || o.code} className="hover:bg-slate-800/30">
                                            <td className="p-4 font-mono font-bold text-blue-300" dir="ltr">{o.code}</td>
                                            <td className="p-4 font-bold text-white">{o.name}</td>
                                            <td className="p-4 text-slate-300">{o.short_name || '—'}</td>
                                            <td className="p-4">
                                                <span className={cx('inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs border font-medium', acc.chip)}>
                                                    <span className={cx('w-2 h-2 rounded-full', acc.dot)}></span>
                                                    {o.accent_color || 'blue'}
                                                </span>
                                            </td>
                                            <td className="p-4">
                                                {o.is_active ? (
                                                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-950 text-emerald-300 border border-emerald-500/40">نشطة</span>
                                                ) : (
                                                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-800 text-slate-400 border border-slate-600/40">معطلة</span>
                                                )}
                                            </td>
                                            <td className="p-4 no-print text-center">
                                                <div className="flex items-center justify-center gap-1.5">
                                                    {mayEdit && (
                                                        <button type="button" onClick={() => setOrgModal({ initial: o })}
                                                                title="تعديل الجهة" className="p-2 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 rounded-lg">
                                                            <i className="fa-solid fa-pen-to-square"></i>
                                                        </button>
                                                    )}
                                                    {mayEdit && (
                                                        <button type="button" onClick={() => handleToggleStatus(o)} disabled={busy}
                                                                title={o.is_active ? 'تعطيل الجهة' : 'تفعيل الجهة'}
                                                                className={cx('p-2 rounded-lg', o.is_active ? 'bg-amber-600/20 hover:bg-amber-600/30 text-amber-300' : 'bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300')}>
                                                            <i className={cx('fa-solid', o.is_active ? 'fa-ban' : 'fa-check')}></i>
                                                        </button>
                                                    )}
                                                    {mayDelete && (
                                                        <button type="button" onClick={() => handleDelete(o)} disabled={busy}
                                                                title="حذف الجهة" className="p-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 rounded-lg">
                                                            <i className="fa-solid fa-trash-can"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>

                {orgModal && (
                    <OrganizationModal open={true} initial={orgModal.initial}
                                       onClose={() => setOrgModal(null)}
                                       onSubmit={handleSave}
                                       busy={busy} />
                )}
            </div>
        );
    }

    function PlanItemQuickModal({ open, projectId, api, onClose, onCreated, toast }) {
        const blank = {
            project_id: projectId || '',
            track: '',
            phase: '',
            title: '',
            content: '',
            kpi: '',
            target: '',
            quantity: '',
            unit: '',
            priority: 'normal',
            planned_start: '',
            planned_end: ''
        };
        const [form, setForm] = useState(blank);
        const [busy, setBusy] = useState(false);

        useEffect(() => {
            if (open) {
                setForm({ ...blank, project_id: projectId || '' });
                setBusy(false);
            }
        }, [open, projectId]);

        const set = key => e => setForm(prev => ({ ...prev, [key]: e.target.value }));

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!form.title.trim()) {
                toast('يرجى كتابة عنوان البند أو المنتج المعتمد', 'error');
                return;
            }
            setBusy(true);
            try {
                const created = await api.planItems.create({
                    ...form,
                    quantity: form.quantity ? Number(form.quantity) : null,
                    planned_start: form.planned_start || null,
                    planned_end: form.planned_end || null
                });
                toast('تمت إضافة بند الخطة بنجاح', 'success');
                onCreated(created);
                onClose();
            } catch (err) {
                toast(err.message || 'تعذر إضافة بند الخطة', 'error');
            } finally {
                setBusy(false);
            }
        };

        return (
            <Modal open={open} onClose={onClose} title="إضافة بند خطة / منتج معتمد سريع" size="lg"
                   subtitle="إضافة منتج أو مخرج معتمد في خطة المشروع مباشرة لاستخدامه في المهمة"
                   footer={
                       <React.Fragment>
                           <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                           <button type="submit" form="quick-plan-item-form" disabled={busy} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white rounded-xl text-sm font-bold">
                               {busy && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}إضافة البند للخطة
                           </button>
                       </React.Fragment>
                   }>
                <form id="quick-plan-item-form" onSubmit={handleSubmit} className="space-y-4">
                    <Field label="عنوان المنتج / المخرج المعتمد" required>
                        <input className={inputClass} value={form.title} onChange={set('title')} required maxLength="300" placeholder="مثال: تقرير إعلامي مرئي للحملة" />
                    </Field>
                    <div className="grid sm:grid-cols-2 gap-4">
                        <Field label="المسار / الخطة الفرعية">
                            <input className={inputClass} value={form.track} onChange={set('track')} placeholder="مثال: مسار الإنتاج المرئي" />
                        </Field>
                        <Field label="المرحلة">
                            <input className={inputClass} value={form.phase} onChange={set('phase')} placeholder="مثال: مرحلة الإعداد والتنفيذ" />
                        </Field>
                    </div>
                    <Field label="وصف المحتوى ومواصفات المخرج">
                        <textarea className={cx(inputClass, 'h-20')} value={form.content} onChange={set('content')} placeholder="تفاصيل ومواصفات المخرج المطلوب..." />
                    </Field>
                    <div className="grid sm:grid-cols-2 gap-4">
                        <Field label="مؤشر الأداء (KPI)">
                            <input className={inputClass} value={form.kpi} onChange={set('kpi')} placeholder="مثال: عدد المشاهدات والتفاعل" />
                        </Field>
                        <Field label="المستهدف (Target)">
                            <input className={inputClass} value={form.target} onChange={set('target')} placeholder="مثال: 50,000 مشاهدة" />
                        </Field>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-4">
                        <Field label="تاريخ البدء المخطط">
                            <input type="date" className={inputClass} value={form.planned_start} onChange={set('planned_start')} />
                        </Field>
                        <Field label="تاريخ الانتهاء المخطط">
                            <input type="date" className={inputClass} value={form.planned_end} onChange={set('planned_end')} />
                        </Field>
                    </div>
                </form>
            </Modal>
        );

    function DriveSettingsSection({ settings, onSave, saving, drive, driveConnected, onConnect, toast }) {
        const [form, setForm] = useState(() => ({
            drive_client_id:        (settings && settings.drive_client_id) || '',
            drive_picker_api_key:   (settings && settings.drive_picker_api_key) || '',
            drive_root_folder_id:   (settings && settings.drive_root_folder_id) || '',
            drive_root_folder_name: (settings && settings.drive_root_folder_name) || ''
        }));
        const [picking, setPicking] = useState(false);
        const set = (key) => (e) => setForm(prev => ({ ...prev, [key]: e.target.value }));

        /* Pick the folder before saving, so the credentials being typed are
           the ones used for the picker rather than the last saved pair. */
        const chooseFolder = async () => {
            if (!form.drive_client_id || !form.drive_picker_api_key) {
                toast('أدخل معرّف العميل ومفتاح المتصفح أولًا.', 'error');
                return;
            }
            setPicking(true);
            try {
                drive.configure({ clientId: form.drive_client_id.trim(), apiKey: form.drive_picker_api_key.trim() });
                if (!driveConnected && !(await onConnect())) { setPicking(false); return; }
                const picked = await drive.pick({ mode: 'folder' });
                if (picked && picked.length) {
                    setForm(prev => ({ ...prev, drive_root_folder_id: picked[0].id, drive_root_folder_name: picked[0].name }));
                    toast('تم اختيار المجلد. لا تنسَ حفظ الإعدادات.', 'success');
                }
            } catch (err) {
                toast(err.message, 'error');
            } finally {
                setPicking(false);
            }
        };

        return (
            <div className="space-y-5">
                <SectionHeading icon="fa-cloud" title="ربط Google Drive"
                                description="تُطبَّق إعدادات الربط على جميع المستخدمين، وتُحفظ في قاعدة البيانات لا في المتصفح." />

                <div className="p-4 bg-slate-900 border border-blue-500/30 rounded-2xl flex items-start gap-3 text-sm">
                    <i className="fa-solid fa-shield-halved text-blue-400 mt-0.5"></i>
                    <div className="text-slate-300 leading-relaxed space-y-1">
                        <p className="font-bold text-blue-300">القيمتان أدناه عامّتان، ولا يجوز وضع أي قيمة سرّية هنا.</p>
                        <p>
                            معرّف العميل ومفتاح المتصفح مُعدّان للعمل داخل صفحات الويب:
                            لا يمنحان وحدهما أي وصول، فالوصول يأتي من تسجيل دخول المستخدم بحسابه في Google.
                            <strong className="text-white"> قيّد مفتاح المتصفح</strong> في Google Cloud بنطاق موقعك (HTTP referrer)
                            {/* Two Latin names joined only by the one-letter "و" sit adjacent in the
                                RTL flow and read as one garbled token ("Pickerg Drive"). A full
                                Arabic word between them keeps each name legible. */}
                            وبواجهة <bdi>Drive</bdi> وواجهة <bdi>Picker</bdi> فقط.
                            أما <strong className="text-rose-300">client secret</strong> أو مفتاح حساب الخدمة فلا يوضعان هنا إطلاقًا:
                            هما بمثابة كلمة مرور تُسلَّم لكل من يفتح النظام.
                        </p>
                    </div>
                </div>

                <form className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 shadow-md"
                      onSubmit={(e) => { e.preventDefault(); onSave(form); }}>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <Field label="Google OAuth Client ID" required
                               hint="من Google Cloud ← Credentials ← OAuth client ID (نوع: Web application).">
                            <input className={cx(inputClass, 'font-mono text-xs')} dir="ltr"
                                   value={form.drive_client_id} onChange={set('drive_client_id')}
                                   placeholder="000000000000-xxxxxxxx.apps.googleusercontent.com" />
                        </Field>
                        <Field label="Picker browser API key" required
                               hint="مفتاح متصفح مقيَّد بالنطاق (HTTP referrer). تحتاجه أداة اختيار الملفات.">
                            <input className={cx(inputClass, 'font-mono text-xs')} dir="ltr"
                                   value={form.drive_picker_api_key} onChange={set('drive_picker_api_key')}
                                   placeholder="AIzaSy..." />
                        </Field>
                    </div>

                    <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div className="min-w-0">
                                <p className="text-sm font-bold text-slate-200">مجلد المشروع الجذري</p>
                                <p className="text-xs text-slate-500 mt-0.5">
                                    تُنشأ داخله مجلدات المنتجات، وفي كل منها «{FOLDER_LABELS.proposals}» و«{FOLDER_LABELS.approved}».
                                </p>
                            </div>
                            <button type="button" onClick={chooseFolder} disabled={picking}
                                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white rounded-xl text-sm font-bold shrink-0">
                                {picking
                                    ? <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>
                                    : <i className="fa-brands fa-google-drive me-1.5"></i>}
                                اختيار المجلد من Drive
                            </button>
                        </div>

                        {form.drive_root_folder_id ? (
                            <div className="flex items-center gap-2 text-sm">
                                <i className="fa-solid fa-folder text-amber-400"></i>
                                <span className="text-white font-bold">{form.drive_root_folder_name || 'مجلد بلا اسم'}</span>
                                <a href={`https://drive.google.com/drive/folders/${form.drive_root_folder_id}`}
                                   target="_blank" rel="noopener noreferrer"
                                   className="text-xs text-blue-400 hover:text-blue-300 font-bold">
                                    فتح في Drive <i className="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                        ) : (
                            <p className="text-xs text-amber-300">لم يُحدَّد مجلد بعد؛ لن يعمل الرفع حتى تختاره.</p>
                        )}

                        <details className="text-xs">
                            <summary className="cursor-pointer text-slate-400 hover:text-slate-200">إدخال معرّف المجلد يدويًا</summary>
                            <input className={cx(inputClass, 'font-mono text-xs mt-2')} dir="ltr"
                                   value={form.drive_root_folder_id} onChange={set('drive_root_folder_id')}
                                   placeholder="1AbCdEf..." />
                        </details>
                    </div>

                    <div className="pt-3 border-t border-slate-800 flex items-center justify-between gap-3">
                        <span className={cx('text-xs font-bold flex items-center gap-1.5',
                            driveConnected ? 'text-emerald-400' : 'text-slate-500')}>
                            <span className={cx('w-2 h-2 rounded-full', driveConnected ? 'bg-emerald-500' : 'bg-slate-600')}></span>
                            {driveConnected ? 'متصل بحساب Google في هذه الجلسة' : 'غير متصل بحساب Google'}
                        </span>
                        <button type="submit" disabled={saving}
                                className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white rounded-xl text-sm font-bold">
                            {saving && <i className="fa-solid fa-circle-notch fa-spin me-1.5"></i>}
                            حفظ الإعدادات
                        </button>
                    </div>
                </form>
            </div>
        );
    }

    function SafeDeleteProjectModal({ open, project, api, onClose, onDeleted, onArchived, toast }) {
        const [deps, setDeps] = useState(null);
        const [loading, setLoading] = useState(true);
        const [busy, setBusy] = useState(false);
        const [force, setForce] = useState(false);

        useEffect(() => {
            if (!open || !project) return;
            setLoading(true);
            setDeps(null);
            setForce(false);
            api.projects.getDependencies(project.id)
                .then(data => { setDeps(data); setLoading(false); })
                .catch(err => { toast(err.message, 'error'); setLoading(false); });
        }, [open, project]);

        if (!open || !project) return null;

        const hasDeps = deps && (deps.tasks_count > 0 || deps.products_count > 0 || deps.plans_count > 0 || deps.files_count > 0);

        const handleArchive = async () => {
            setBusy(true);
            try {
                await api.projects.archive(project.id);
                toast(`تمت أرشفة المشروع «${project.name}» بنجاح.`, 'success');
                await onArchived();
                onClose();
            } catch (err) {
                toast(err.message || 'تعذرت أرشفة المشروع', 'error');
            } finally { setBusy(false); }
        };

        const handleDelete = async () => {
            setBusy(true);
            try {
                await api.projects.deleteSafe(project.id, force);
                toast(`تم حذف المشروع «${project.name}» بنجاح.`, 'success');
                await onDeleted();
                onClose();
            } catch (err) {
                toast(err.message || 'تعذر حذف المشروع', 'error');
            } finally { setBusy(false); }
        };

        return (
            <Modal open={open} onClose={onClose} size="lg"
                   title={`إدارة حذف وأرشفة المشروع: ${project.name}`}
                   subtitle={project.classification ? `تصنيف: ${project.classification}` : 'إجراء إداري للمشروع'}
                   footer={
                       <React.Fragment>
                           <button type="button" onClick={onClose} disabled={busy} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                           {hasDeps && (
                               <button type="button" onClick={handleArchive} disabled={busy}
                                       className="px-5 py-2 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white rounded-xl text-sm font-bold flex items-center gap-1.5">
                                   {busy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-box-archive"></i>}
                                   أرشفة المشروع بأمان
                               </button>
                           )}
                           {(!hasDeps || force) && (
                               <button type="button" onClick={handleDelete} disabled={busy}
                                       className="px-5 py-2 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white rounded-xl text-sm font-bold flex items-center gap-1.5">
                                   {busy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-trash-can"></i>}
                                   {force ? 'تأكيد الحذف الإجباري' : 'حذف المشروع نهائيًا'}
                               </button>
                           )}
                       </React.Fragment>
                   }>
                {loading ? (
                    <div className="py-8 text-center text-slate-400">
                        <i className="fa-solid fa-circle-notch fa-spin text-2xl text-blue-400 mb-2"></i>
                        <p>جارٍ فحص التبعيات والارتباطات التشغيلية للمشروع...</p>
                    </div>
                ) : (
                    <div className="space-y-4">
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-center">
                                <span className="text-xs text-slate-400 block mb-1">الخطط والمسارات</span>
                                <strong className="text-xl font-bold text-cyan-400">{deps ? deps.plans_count : 0}</strong>
                            </div>
                            <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-center">
                                <span className="text-xs text-slate-400 block mb-1">المنتجات والمخرجات</span>
                                <strong className="text-xl font-bold text-blue-400">{deps ? deps.products_count : 0}</strong>
                            </div>
                            <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-center">
                                <span className="text-xs text-slate-400 block mb-1">المراحل والمعالم</span>
                                <strong className="text-xl font-bold text-indigo-400">{deps ? deps.phases_count : 0}</strong>
                            </div>
                            <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-center">

    function HierarchicalImportModal({ open, initialEntity = 'projects', api, onClose, onImported, toast }) {
        const [entity, setEntity] = useState(initialEntity || 'projects');
        const [file, setFile] = useState(null);
        const [preview, setPreview] = useState(null);
        const [busy, setBusy] = useState(false);
        const [mode, setMode] = useState('add_only');

        useEffect(() => {
            if (open) {
                setEntity(initialEntity || 'projects');
                setFile(null);
                setPreview(null);
                setBusy(false);
                setMode('add_only');
            }
        }, [open, initialEntity]);

        const validRows = preview ? preview.rows.filter(row => row.valid) : [];

        const inspect = async () => {
            if (!file) { toast('اختر ملف Excel أولًا.', 'error'); return; }
            setBusy(true);
            try {
                const res = await api.hierarchyImport.preview(entity, file);
                setPreview(res);
                toast(`تم فحص الملف: ${res.summary.valid} صف صالح من إجمالي ${res.summary.total}`, 'info');
            } catch (error) {
                toast(error.message || 'تعذّرت قراءة ملف الاستيراد.', 'error');
            } finally { setBusy(false); }
        };

        const commit = async () => {
            if (!validRows.length) return;
            setBusy(true);
            try {
                const result = await api.hierarchyImport.commit(entity, validRows, mode);
                toast(`تم الاستيراد بنجاح: إدراج ${result.inserted} سجل، تحديث ${result.updated} سجل، وتجاوز ${result.skipped} سجل.`, 'success');
                await onImported();
                onClose();
            } catch (error) {
                toast(error.message || 'تعذّر اعتماد الاستيراد.', 'error');
            } finally { setBusy(false); }
        };

        const currentEntityMeta = HIERARCHY_ENTITIES.find(e => e.key === entity) || HIERARCHY_ENTITIES[0];

        return (
            <Modal open={open} onClose={onClose} size="xl"
                   title={`استيراد وتصدير البيانات: ${currentEntityMeta.label}`}
                   subtitle="معالج الاستيراد المتكامل — مطابقة البيانات، التحقق من المفاتيح الأجنبية، واعتماد التحديثات"
                   footer={
                       <React.Fragment>
                           <button type="button" onClick={onClose} disabled={busy} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold">إلغاء</button>
                           {preview && (
                               <button type="button" onClick={commit} disabled={busy || !validRows.length}
                                       className="px-5 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white rounded-xl text-sm font-bold flex items-center gap-1.5">
                                   {busy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-cloud-arrow-up"></i>}
                                   اعتماد واستيراد {validRows.length} سجل
                               </button>
                           )}
                       </React.Fragment>
                   }>
                <div className="space-y-4">
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        {HIERARCHY_ENTITIES.map(ent => (
                            <button key={ent.key} type="button"
                                    onClick={() => { setEntity(ent.key); setFile(null); setPreview(null); }}
                                    className={cx('p-2.5 rounded-xl text-start border transition-all text-xs font-bold flex flex-col gap-1',
                                        entity === ent.key
                                            ? 'bg-blue-600 border-blue-500 text-white shadow-md'
                                            : 'bg-slate-900 border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-white')}>
                                <div className="flex items-center gap-2">
                                    <i className={ent.icon}></i>
                                    <span>{ent.label.split('(')[0]}</span>
                                </div>
                                <span className={cx('text-[10px] font-normal', entity === ent.key ? 'text-blue-200' : 'text-slate-500')}>{ent.label.match(/\((.*?)\)/)?.[1] || ''}</span>
                            </button>
                        ))}
                    </div>

                    <div className="p-3.5 bg-slate-900 border border-slate-800 rounded-xl flex flex-wrap items-center justify-between gap-3 text-xs">
                        <div className="flex items-center gap-2 text-slate-300">
                            <i className="fa-solid fa-circle-info text-blue-400 text-sm"></i>
                            <span>{currentEntityMeta.desc}</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <a href={api.templates.url(entity)} download
                               className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 rounded-lg font-bold flex items-center gap-1.5 transition-colors">
                                <i className="fa-solid fa-file-excel"></i>
                                تحميل القالب الفارغ
                            </a>
                            <a href={api.export.url(entity)} download
                               className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-emerald-500/30 rounded-lg font-bold flex items-center gap-1.5 transition-colors">
                                <i className="fa-solid fa-download"></i>
                                تصدير البيانات الحالية
                            </a>
                        </div>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
                        <Field label="ملف البيانات المكتمل بصيغة XLSX" required className="flex-1">
                            <input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                                   onChange={(event) => { setFile(event.target.files[0] || null); setPreview(null); }}
                                   className="block w-full text-sm text-slate-300 file:me-3 file:px-4 file:py-2 file:border-0 file:rounded-lg file:bg-slate-800 file:text-white file:font-bold hover:file:bg-slate-700" />
                        </Field>
                        <button type="button" onClick={inspect} disabled={busy || !file}
                                className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-xl text-sm font-bold shrink-0 flex items-center gap-2 justify-center">
                            {busy ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-magnifying-glass-chart"></i>}
                            فحص وتحليل الملف
                        </button>
                    </div>

                    {preview && (
                        <div className="space-y-4 pt-2 border-t border-slate-800">
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                {[
                                    ['إجمالي السجلات', preview.summary.total, 'text-white'],
                                    ['سجلات صالحة', preview.summary.valid, 'text-emerald-400'],
                                    ['أخطاء أو حقول مفقودة', preview.summary.invalid, 'text-rose-400'],
                                    ['مكررة / موجودة مسبقًا', preview.summary.duplicates, 'text-amber-400']
                                ].map(([lbl, val, tone]) => (
                                    <div key={lbl} className="p-3 bg-slate-950 border border-slate-800 rounded-xl text-center">
                                        <strong className={cx('block text-xl', tone)}>{val}</strong>
                                        <span className="text-xs text-slate-500">{lbl}</span>
                                    </div>
                                ))}
                            </div>

                            <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                                <label className="block text-xs font-bold text-slate-300">طريقة معالجة السجلات الموجودة مسبقًا:</label>
                                <div className="grid sm:grid-cols-3 gap-2 text-xs">
                                    {[
                                        { key: 'add_only', label: 'إضافة الجديد فقط', hint: 'تجاوز السجلات الموجودة مسبقًا' },
                                        { key: 'update_existing', label: 'تحديث السجلات الموجودة', hint: 'تحديث الحقول وإضافة الجديد' },
                                        { key: 'skip_duplicates', label: 'تجاوز المطابق تمامًا', hint: 'عدم التعديل على أي سجل حالي' }
                                    ].map(m => (
                                        <label key={m.key} className={cx('p-2.5 rounded-lg border cursor-pointer flex items-start gap-2 transition-colors',
                                            mode === m.key ? 'bg-blue-950/60 border-blue-500/50 text-white' : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700')}>
                                            <input type="radio" name="import-mode" value={m.key} checked={mode === m.key} onChange={() => setMode(m.key)} className="mt-0.5 accent-blue-500" />
                                            <div>
                                                <strong className="block text-slate-200">{m.label}</strong>
                                                <span className="text-[10px] text-slate-500">{m.hint}</span>
                                            </div>
                                        </label>

                            </div>

                            <div className="border border-slate-800 rounded-xl overflow-auto max-h-[18rem]">
                                <table className="w-full text-xs min-w-[50rem]">
                                    <thead className="sticky top-0 bg-slate-950 text-slate-400 border-b border-slate-800">
                                        <tr>
                                            <th className="p-3 text-start">الصف</th>
                                            <th className="p-3 text-start">الرمز</th>
                                            <th className="p-3 text-start">الاسم / العنوان</th>

                                            <th className="p-3 text-start">حالة السجل</th>

                                    <tbody className="divide-y divide-slate-800">
                                        {preview.rows.map(row => (
                                            <tr key={row.row_number} className={row.valid ? 'bg-emerald-950/10' : 'bg-rose-950/15'}>
                                                <td className="p-3 font-mono">{row.row_number}</td>

                                                <td className="p-3 font-bold text-white">{row.name || row.title || '—'}</td>

    function ProjectsManagementSection({ data, profile, api, refresh, onEditProject, onCreateProject, onSafeDeleteProject, onOpenImport, toast }) {
        const [search, setSearch] = useState('');
        const [statusFilter, setStatusFilter] = useState('all');
        const [orgFilter, setOrgFilter] = useState('all');
        const [sortField, setSortField] = useState('name');
        const [sortAsc, setSortAsc] = useState(true);
        const [busyId, setBusyId] = useState(null);

        const safeProjects = sanitizeRows(data.projects);
        const safeTasks = sanitizeRows(data.tasks);
        const safeProducts = sanitizeRows(data.products);
        const safePlanItems = sanitizeRows(data.planItems);

        const filtered = useMemo(() => {
            return safeProjects.filter(p => {
                if (statusFilter !== 'all' && p.status !== statusFilter) return false;
                if (orgFilter !== 'all' && p.org !== orgFilter) return false;
                if (search) {
                    const q = search.toLowerCase();
                    const matchName = (p.name || '').toLowerCase().includes(q);
                    const matchCode = (p.code || '').toLowerCase().includes(q);
                    const matchHCode = (p.hierarchical_code || '').toLowerCase().includes(q);
                    const matchDesc = (p.description || '').toLowerCase().includes(q);
                    if (!matchName && !matchCode && !matchHCode && !matchDesc) return false;
                }
                return true;
            }).sort((a, b) => {
                let vA = a[sortField] || '';
                let vB = b[sortField] || '';
                if (typeof vA === 'string') vA = vA.toLowerCase();
                if (typeof vB === 'string') vB = vB.toLowerCase();
                if (vA < vB) return sortAsc ? -1 : 1;
                if (vA > vB) return sortAsc ? 1 : -1;
                return 0;
            });
        }, [safeProjects, statusFilter, orgFilter, search, sortField, sortAsc]);

        const toggleSort = (field) => {
            if (sortField === field) setSortAsc(!sortAsc);
            else { setSortField(field); setSortAsc(true); }
        };

        const totalActive = safeProjects.filter(p => p.status === 'active').length;
        const totalPlans = safePlanItems.length;
        const totalProducts = safeProducts.length;
        const totalTasks = safeTasks.length;

        const toggleActivation = async (proj) => {
            const isCurrentlyActive = proj.status === 'active';
            setBusyId(proj.id);
            try {
                if (isCurrentlyActive) {
                    await api.projects.deactivate(proj.id);
                    toast(`تم تعطيل المشروع «${proj.name}» مع المحافظة على جميع بياناته وسجلاته السابقة.`, 'info');
                } else {
                    await api.projects.activate(proj.id);
                    toast(`تم تفعيل المشروع «${proj.name}» بنجاح وإتاحته في فلتر النظام.`, 'success');
                }
                if (refresh) await refresh();
            } catch (err) {
                toast(err.message || 'تعذر تغيير حالة تفعيل المشروع', 'error');
            } finally {
                setBusyId(null);
            }
        };

        return (
            <div className="space-y-5">
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">إجمالي المشاريع</span>
                        <strong className="text-2xl font-bold text-white">{safeProjects.length}</strong>
                    </div>
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">المشاريع النشطة</span>
                        <strong className="text-2xl font-bold text-emerald-400">{totalActive}</strong>
                    </div>
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">الخطط والمسارات</span>
                        <strong className="text-2xl font-bold text-cyan-400">{totalPlans}</strong>
                    </div>
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">المنتجات والمخرجات</span>
                        <strong className="text-2xl font-bold text-blue-400">{totalProducts}</strong>
                    </div>
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center">
                        <span className="text-xs text-slate-400 block mb-1">المهام التشغيلية</span>
                        <strong className="text-2xl font-bold text-amber-400">{totalTasks}</strong>
                    </div>
                </div>

                <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex flex-wrap items-center justify-between gap-3">
                    <div className="flex flex-wrap items-center gap-2 flex-1 min-w-[18rem]">
                        <div className="relative flex-1 min-w-[12rem]">
                            <i className="fa-solid fa-magnifying-glass absolute top-1/2 -translate-y-1/2 start-3 text-slate-500 text-xs"></i>
                            <input type="search" value={search} onChange={e => setSearch(e.target.value)}
                                   placeholder="بحث باسم المشروع أو الوصف..."
                                   className="w-full bg-slate-950 border border-slate-700 rounded-xl ps-9 pe-3 py-2 text-xs text-white focus:border-blue-500 focus:outline-none" />
                        </div>
                        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
                                className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-blue-500 focus:outline-none">
                            <option value="all">كل الحالات</option>

                            <option value="on_hold">معلق (On Hold)</option>

                            <i className="fa-solid fa-file-excel"></i>
                            استيراد وتصدير النماذج

                                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors">
                            <i className="fa-solid fa-plus"></i>
                            مشروع جديد
                        </button>
                    </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md">
                    {filtered.length === 0 ? (
                        <div className="py-12 text-center text-slate-400">
                            <i className="fa-solid fa-folder-open text-3xl mb-2 text-slate-600"></i>
                            <p className="font-bold text-slate-300">لا توجد مشاريع مطابقة لمعايير البحث</p>
                            <p className="text-xs text-slate-500 mt-1">جرّب تغيير التصفية أو أضف مشروعًا جديدًا.</p>
                        </div>

                                        <th className="p-3.5 cursor-pointer hover:text-white" onClick={() => toggleSort('name')}>

                                        <th className="p-3.5">الجهة</th>
